ashyyyk.tulip"],"effect":{"id":"vis-tulipan-especial","kind":"visual","planet":"naboo","title":"Un tulipán nuevo","body":"Ha florecido un tulipán distinto en el jardín de Naboo. Las semillas llegaron desde el santuario de Kashyyyk."}},{"id":"mustafar-a-ahchto","requires":["mustafar.temple"],"effect":{"id":"slot-libro-encendido","kind":"slot","planet":"ahch-to","title":"Un libro se ha encendido","body":"Uno de los libros de la biblioteca de Ahch-To brilla desde que se abrió el templo de Mustafar.  Ya puedes leerlo en su biblioteca: «Lo que significa respetar»."}},{"id":"jedha-a-endor","requires":["jedha.cipher"],"effect":{"id":"vis-mapa-del-cofre","kind":"visual","planet":"endor","title":"Coordenadas descifradas","body":"El archivo de Jedha ha revelado dónde buscar en el bosque de Endor: hay un objeto más escondido."}},{"id":"alderaan-a-bespin","requires":["alderaan.capsule"],"effect":{"id":"vis-globo-capsula","kind":"visual","planet":"bespin","title":"Un globo con destino","body":"Desde Alderaan ha salido un globo dorado hacia las nubes de Bespin: lleva la señal de una cápsula del tiempo guardada."}},{"id":"ahchto-a-mustafar","requires":["ahch-to.calm"],"effect":{"id":"vis-lava-en-calma","kind":"visual","planet":"mustafar","title":"La lava se enfría","body":"La calma de Ahch-To llega hasta Mustafar: los ríos de lava se ralentizan y aparecen piedras firmes."}},{"id":"coruscant-a-hoth","requires":["coruscant.lights"],"effect":{"id":"vis-ciudad-desde-hoth","kind":"visual","planet":"hoth","title":"Luces en el horizonte","body":"Con todos los edificios de Coruscant encendidos, su resplandor se ve desde el telescopio de Hoth."}},{"id":"endor-a-naboo","requires":["endor.fireflies"],"effect":{"id":"vis-luciernagas-lago","kind":"visual","planet":"naboo","title":"Luciérnagas en el lago","body":"Las luciérnagas que recogiste en Endor han encontrado el lago de Naboo."}},{"id":"bespin-a-desconocido","requires":["bespin.landmarks","hoth.constellation"],"effect":{"id":"hint-ruta-oculta","kind":"hint","planet":"desconocido","title":"Una ruta sin nombre","body":"Los miradores de Bespin y el cielo de Hoth apuntan al mismo punto del mapa. Algo se acerca desde el borde de la galaxia."}}],"intro1":["Transmisión recibida.","Destinataria: Arián.","Origen: Tenerife.","Remitente: Yeidan.","Hay miles de millones de estrellas en esta galaxia, pero esta transmisión solo tenía un destino.","El tuyo."],"crawl":["EL ARCHIVO DE LAS ESTRELLAS PERDIDAS","Una transmisión viajó desde una isla hasta una galaxia que no estaba en ningún mapa.","Al llegar, se rompió en fragmentos. Cada fragmento cayó en un planeta distinto: una carta, un recuerdo, una sorpresa.","Solo una exploradora puede recuperarlos todos."],"droids":[{"id":"chispa","label":"Chispa","note":"Curiosa y rápida; siempre encuentra algo brillante","color":"#ffd166"},{"id":"brujula","label":"Brújula","note":"Tranquila; nunca se pierde","color":"#7fd6ff"},{"id":"tuerca","label":"Tuerca","note":"Cabezota y cariñosa; arregla lo que sea","color":"#ff9bb0"}],"sabers":[{"id":"azul","label":"Azul","hex":"#4aa8ff"},{"id":"verde","label":"Verde","hex":"#4dff8a"},{"id":"violeta","label":"Violeta","hex":"#b06aff"},{"id":"blanco","label":"Blanco","hex":"#f0f6ff"},{"id":"ambar","label":"Ámbar","hex":"#ffb347"},{"id":"turquesa","label":"Turquesa","hex":"#3df2e0"}],"accents":[{"id":"cielo","label":"Cielo"},{"id":"violeta","label":"Violeta"},{"id":"esmeralda","label":"Esmeralda"},{"id":"ambar","label":"Ámbar"},{"id":"rosa","label":"Rosa"}]};
const DATA2={"dialog":{"chispa":{"hola":["¡Bip bip! Hola, {n}. Hoy huele a descubrimientos.","¡Aquí estoy! ¿Miramos qué brilla por ahí?","¡Hola, {n}! Tengo las luces encendidas por si hay aventura."],"animo":["Cada pasito cuenta. Yo cuento todos los tuyos, ¡y van muchos!","Si algo no sale, probamos otra cosa. ¡Eso también es explorar!","Eres capaz de más de lo que piensas. Mis sensores no se equivocan."],"curiosidad":["Dato curioso: en Tatooine hay dos soles y aun así a mí me gusta más la luz de tus ojos… quiero decir, de tu pantalla.","Dato curioso: los droides contamos las estrellas dormidos. Siempre salen distintas.","Dato curioso: una chispa viaja a mucha velocidad, pero se detiene si alguien la mira con cariño."],"vuelta":["¡Qué bien verte, {n}! Todo sigue en su sitio, sin prisas.","¡Has vuelto! Yo estaba aquí, ordenando chispas."],"celebra":["¡Lo has conseguido! ¡Chispas por todas partes!","¡Bip bip bip! ¡Qué descubrimiento tan bonito!","¡Eso merece una vuelta de victoria!"],"estado":{"happy":["Estoy a tope: luces brillantes y cabeza despejada."],"curious":["Estoy bien. Con curiosidad, como siempre."],"sleepy":["Tengo poca energía, pero nada grave. Cuando puedas, una recarga y listo."],"celebrate":["¡Estoy de fiesta!"]}},"brujula":{"hola":["Hola, {n}. Respira. Aquí todo va a su ritmo.","Buenas. Cuando quieras, caminamos juntas.","Me alegra que estés aquí, {n}. Sin prisa."],"animo":["No hay que llegar rápido. Hay que llegar con ganas.","Un paso pequeño sigue siendo un paso. Y ya lo has dado.","Descansar también es parte del viaje. Lo haces bien."],"curiosidad":["Dato curioso: las constelaciones solo existen desde donde se miran. Cada mirada dibuja la suya.","Dato curioso: una brújula no sabe adónde vas, solo te ayuda a no perder el norte.","Dato curioso: en Hoth el silencio es tan grande que se oyen las estrellas. Es un decir."],"vuelta":["Bienvenida de nuevo, {n}. Nada se ha movido de sitio.","Qué bien que hayas vuelto. Todo estaba esperándote con calma."],"celebra":["Muy bien hecho. Despacio, pero seguro.","Un buen descubrimiento. Mereces disfrutarlo.","Eso ha quedado precioso. Te lo has ganado."],"estado":{"happy":["Muy bien. Tranquila y con las luces en calma."],"curious":["Estoy bien. Atenta a lo que venga."],"sleepy":["Me pesan un poco los engranajes. Una recarga me vendría bien, sin agobio."],"celebrate":["Estoy contenta. Mucho."]}},"tuerca":{"hola":["¡Hola, {n}! Si algo está torcido, yo lo arreglo. Y si no, lo abrazo.","Aquí estoy, con la llave inglesa y el corazón preparado.","¡Ya era hora de verte! Bueno, no, no había hora. Aquí siempre eres bienvenida."],"animo":["No te rindas, que yo no soy de abandonar tornillos ni amistades.","Si hoy cuesta, mañana se arregla. Y yo estaré aquí para ayudarte.","Tienes buen corazón. Eso no se fabrica en ningún taller."],"curiosidad":["Dato curioso: un droide cabezota es solo un droide que cree mucho en las cosas.","Dato curioso: cada tuerca encaja con su tornillo. No es casualidad; es diseño.","Dato curioso: la mejor herramienta del taller es tener a alguien que te sostenga la linterna."],"vuelta":["¡Has vuelto, {n}! Yo he ido engrasando todo, por si acaso.","Qué alegría. No te preocupes por el tiempo: aquí nada se oxida."],"celebra":["¡Mira qué bien ha quedado eso! ¡Orgullo de taller!","¡Eso es trabajo bien hecho!","¡Ole mis tuercas! ¡Lo has logrado!"],"estado":{"happy":["Como nueva. Hasta chirrío de contenta."],"curious":["Bien. Con ganas de arreglar algo."],"sleepy":["Me falla un poco la batería. Una recarga y vuelvo a ser yo."],"celebrate":["¡Estoy radiante!"]}}},"npcs":{"archivista":{"id":"archivista","name":"Madame Tinta","role":"Archivista de cartas","where":"Cartas","color":"#e6b87a","shape":"visera","job":"Cuida las cartas y te señala cuál leer a continuación.","lines":["Bienvenida al archivo. Cada carta está en su estante, esperando a su lectora.","Las cartas no caducan. Yo les quito el polvo para que siempre estén listas.","Si no sabes por dónde empezar, empieza por la más nueva. Yo te la señalo.","Leer despacio es la mejor manera de leer."]},"piloto":{"id":"piloto","name":"Capitán Rumbo","role":"Piloto de transmisiones","where":"Mapa","color":"#7fd6ff","shape":"casco","job":"Trae una transmisión nueva cada día y te regala chispas por recogerla.","lines":["¡Aquí el capitán Rumbo! Traigo la transmisión de hoy, calentita.","Entrego mensajes por toda la galaxia. Algunos llegan en un segundo; otros tardan en encontrar a su destinataria.","Mañana habrá otra. Si hoy no puedes, no pasa nada: aquí no se acumulan deberes."]},"explorador":{"id":"explorador","name":"Vega la Mirona","role":"Exploradora de constelaciones","where":"Hoth","color":"#b8c8ff","shape":"capa","job":"Te da pistas sobre las estrellas y las constelaciones de Hoth.","lines":["Aquí el cielo se ve entero. Si miras bien, las estrellas dibujan cosas.","Una constelación es solo una historia que alguien decidió contar uniendo puntos.","Empieza por las estrellas más brillantes y ve uniendo. Sin prisa."]},"guardian":{"id":"guardian","name":"Grumo el Guardián","role":"Guardián de holocrones","where":"Endor","color":"#9bd37a","shape":"capucha","job":"Guarda los holocrones de Endor y te ayuda a encontrar sus secretos.","lines":["Los holocrones son memorias en forma de luz. Los guardo con mucho cariño.","En este bosque todo se esconde cerca de lo pequeño: una luz, una criatura, un cofre.","Si un cofre no se abre, quizá le falte una pista de otro planeta."]},"jardinero":{"id":"jardinero","name":"Brote","role":"Robot jardinero","where":"Naboo","color":"#6fe0b0","shape":"sombrero","job":"Cuida el jardín de Naboo y te cuenta qué falta por hacer allí.","lines":["Clic, clic. Estoy regando. Las flores crecen cuando no las miras con prisa.","Cada tulipán tiene su ritmo. El jardín no compite con nadie.","Si quieres ayudar, toca las flores con suavidad. No muerden, lo prometo."]},"comerciante":{"id":"comerciante","name":"Don Baratija","role":"Comerciante de accesorios","where":"Tienda","color":"#ffb347","shape":"tunica","job":"Vende accesorios para tu droide a cambio de chispas.","lines":["¡Pasa, pasa! Tengo cosas que ni los droides saben que necesitan.","Las chispas se ganan jugando y explorando. Aquí no se cobra ni un céntimo de verdad.","Los accesorios nuevos se van desbloqueando según crece la amistad con tu droide."]},"narrador":{"id":"narrador","name":"La Voz de las Estrellas","role":"Narradora de historias","where":"Recuerdos","color":"#d6a6ff","shape":"tunica","job":"Cuenta pequeñas leyendas de la galaxia mientras repasas tus recuerdos.","lines":["Hace mucho, una estrella se quedó sin su luz y empezó a escribir cartas para que alguien la encontrara.","Dicen que el archivo de las estrellas perdidas guarda lo que otros olvidaron. Yo prefiero decir: lo que alguien ha querido conservar.","Cada recuerdo es una pequeña luz. Juntas, hacen un mapa.","Las historias no se acaban: esperan a que alguien las vuelva a contar."]}},"news":["Hoy no hay nada que arreglar. Solo que explorar si te apetece.","Se ha avistado una estrella nueva cerca de tu planeta favorito. Quizá sea la tuya.","Recordatorio oficial de la galaxia: beber agua y estirar las piernas.","Un droide ha informado de que hoy es un buen día para leer una carta con calma.","Las constelaciones están especialmente claras esta noche.","Aviso: aquí no existe el retraso. Todo llega cuando tiene que llegar.","Mensaje sin importancia: los droides te echan de menos cuando no estás, pero se les pasa jugando.","Los tulipanes de Naboo han crecido un poco. Nadie sabe por qué, pero a todos nos gusta.","Hoy la nave va tranquila. Puedes llevarla a donde quieras.","El archivo informa de que ninguna carta ha caducado. Ninguna.","Una pequeña esfera ha sido vista rodando por ahí. Parece que lleva un mensaje.","Previsión: cielos despejados, ánimo suave y nada de prisa.","Mensaje oficial: cualquier momento es bueno para empezar. También este.","La galaxia dice que sigas a tu ritmo. Y la galaxia casi nunca se equi
