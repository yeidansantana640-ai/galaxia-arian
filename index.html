<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galaxia de Arián</title>
<meta name="theme-color" content="#03040a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{
  --void:#03040a;--deep:#070a18;--panel:#0c1126;--panel2:#121937;
  --ink:#eef3ff;--ink2:#b7c3dd;--ink3:#7b88a6;--hair:rgba(255,255,255,.1);--hair2:rgba(255,255,255,.18);
  --gold:#ffd98a;--gold2:#f2b84b;--ok:#8dffc4;--danger:#ff8a9b;
  --accent-h:205;--accent:hsl(var(--accent-h) 100% 70%);--accent-soft:hsl(var(--accent-h) 100% 70% / .16);
  --accent-line:hsl(var(--accent-h) 100% 70% / .45);--accent-glow:hsl(var(--accent-h) 100% 65% / .55);
  --holo:#7fe3ff;
  --f-display:"Orbitron","Trebuchet MS",system-ui,sans-serif;--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-letter:"Cormorant Garamond",Georgia,serif;
  --ts:1;--tabh:64px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
html[data-accent=azul]{--accent-h:208}html[data-accent=verde]{--accent-h:140}html[data-accent=violeta]{--accent-h:272}
html[data-accent=blanco]{--accent-h:210}html[data-accent=blanco]{--accent:#eef4ff;--accent-glow:rgba(220,235,255,.55)}
html[data-accent=ambar]{--accent-h:36}html[data-accent=turquesa]{--accent-h:174}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:calc(16px * var(--ts));line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:clip}
body{min-height:100dvh}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
html[data-motion=reduced] *,html[data-motion=reduced] *::before,html[data-motion=reduced] *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--hair2);background:rgba(255,255,255,.06);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;touch-action:manipulation;transition:transform .14s,background .2s,box-shadow .3s}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn--primary{background:linear-gradient(180deg,hsl(var(--accent-h) 100% 76%),hsl(var(--accent-h) 90% 58%));color:#03101c;border-color:transparent;box-shadow:0 6px 24px var(--accent-glow)}
html[data-accent=blanco] .btn--primary{background:linear-gradient(180deg,#fff,#cfdcf2)}
.btn--gold{background:linear-gradient(180deg,#ffe7a8,#e9a83c);color:#241400;border-color:transparent;box-shadow:0 6px 24px rgba(255,190,80,.35)}
.btn--ghost{background:transparent}
.btn--sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn--icon{width:48px;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.07);color:var(--ink2);white-space:nowrap}
.chip--gold{background:rgba(255,217,138,.14);color:var(--gold)}
.chip--ok{background:rgba(110,240,170,.13);color:var(--ok)}
.chip--accent{background:var(--accent-soft);color:var(--accent)}
.eyebrow{font:600 11px var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink3)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .8s var(--ease)}
.ring{--p:0;--sz:56px;width:var(--sz);height:var(--sz);border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.ring>span{width:calc(var(--sz) - 10px);height:calc(var(--sz) - 10px);border-radius:50%;background:#0a0f22;display:grid;place-items:center;font:700 13px var(--f-body)}
.holo{position:relative;background:linear-gradient(180deg,rgba(16,26,56,.94),rgba(7,10,25,.96));border:1px solid hsl(var(--accent-h) 100% 70% / .3);border-radius:20px;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.holo::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,hsl(var(--accent-h) 100% 80% / .04) 0 1px,transparent 1px 3px)}
.holo::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
.corners{position:absolute;inset:6px;pointer-events:none}
.corners i{position:absolute;width:12px;height:12px;border:2px solid var(--accent);opacity:.7}
.corners i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.corners i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.corners i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.corners i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}

/* ---------- app shell ---------- */
#app{position:relative;min-height:100dvh}
.view{position:relative;min-height:100dvh;padding:calc(16px + var(--st)) 16px calc(var(--tabh) + var(--sb) + 28px);display:flex;flex-direction:column;align-items:center}
.view>.page{width:100%;max-width:640px;display:grid;gap:18px;align-content:start;position:relative;z-index:2}
.view-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 700px at 80% -10%,hsl(var(--accent-h) 80% 30% / .22),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(140,70,200,.18),transparent 60%),var(--void)}
.view-bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfe3ff,transparent),radial-gradient(1.4px 1.4px at 200px 160px,#ffe9c7,transparent),radial-gradient(1px 1px at 60px 190px,#fff,transparent);background-size:240px 240px;opacity:.5}
.ptop{display:flex;align-items:center;gap:10px;min-height:48px}
.ptop .grow{flex:1;min-width:0}
.ptitle{font:700 clamp(1.6rem,7vw,2.2rem)/1.1 var(--f-display);letter-spacing:.04em}
.plead{margin:6px 0 0;color:var(--ink2);max-width:52ch}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px 0 4px;margin-left:-4px;background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer}
.section-t{display:flex;align-items:center;gap:10px;margin:6px 2px -6px;font:600 11px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.section-t::after{content:"";flex:1;height:1px;background:var(--hair)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--hair)}
.seg button{min-height:40px;border:0;border-radius:11px;background:none;color:var(--ink2);font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent-line)}
.empty{padding:28px 18px;text-align:center;color:var(--ink3);border:1px dashed var(--hair2);border-radius:18px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tabh) + var(--sb));padding:0 max(6px,env(safe-area-inset-left)) var(--sb);background:rgba(5,7,16,.86);border-top:1px solid var(--hair);}
.tab{position:relative;display:grid;place-content:center;justify-items:center;gap:3px;background:none;border:0;color:var(--ink3);font-size:11px;font-weight:600;cursor:pointer;touch-action:manipulation}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent)}
.tab[aria-current=page]::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 4px 4px;background:var(--accent);box-shadow:0 0 14px var(--accent-glow)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--gold);color:#140c00;font:700 10px/16px var(--f-body)}

/* ---------- MAP ---------- */
.map{position:fixed;inset:0;z-index:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#02030a;cursor:grab}
.map.dragging{cursor:grabbing}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.route{fill:none;stroke-linecap:round}
.route-base{stroke:rgba(140,190,255,.16);stroke-width:1.2}
.route-on{stroke:hsl(var(--accent-h) 100% 72% / .75);stroke-width:1.6;stroke-dasharray:2 7;animation:dash 1.4s linear infinite;filter:drop-shadow(0 0 3px var(--accent-glow))}
.route-link{stroke:rgba(255,217,138,.32);stroke-width:1;stroke-dasharray:1 6}
@keyframes dash{to{stroke-dashoffset:-18}}
.region{position:absolute;transform:translate(-50%,-50%);font:600 11px var(--f-display);letter-spacing:.5em;text-transform:uppercase;color:rgba(170,200,255,.28);white-space:nowrap;pointer-events:none;text-align:center}
.region small{display:block;font:500 9px var(--f-body);letter-spacing:.3em;color:rgba(170,200,255,.2);margin-top:4px}
.pnode{position:absolute;left:0;top:0;will-change:transform;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;touch-action:none}
.pnode .halo{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,var(--atm) 0%,transparent 62%);opacity:.32;pointer-events:none}
.pnode[data-next] .halo{opacity:.55;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);opacity:.75}}
.pnode[data-locked] .planet{filter:grayscale(.85) brightness(.45)}
.pnode[data-sel] .reticle{opacity:1;transform:scale(1)}
.reticle{position:absolute;inset:-30%;opacity:0;transform:scale(1.5);transition:opacity .35s,transform .5s var(--ease);pointer-events:none}
.reticle svg{width:100%;height:100%;overflow:visible;animation:spin 14s linear infinite}
.reticle .pulse{position:absolute;inset:18%;border-radius:50%;border:2px solid var(--gold);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.plabel{position:absolute;left:0;top:0;transform:translate(-50%,0);pointer-events:none;display:grid;justify-items:center;gap:2px;transition:opacity .25s}
.plabel b{font:700 11px var(--f-display);letter-spacing:.18em;text-transform:uppercase;padding:3px 9px 3px 11px;border-radius:99px;background:rgba(4,6,16,.72);border:1px solid rgba(255,255,255,.14);white-space:nowrap;}
.plabel small{font-size:10px;color:var(--ink3);white-space:nowrap;background:rgba(4,6,16,.55);padding:0 6px;border-radius:6px}
.plabel[data-next] b{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(255,200,100,.25)}
.plabel[data-done] b::after{content:" ✓";color:var(--ok)}
.plabel[data-hide]{opacity:0}
.planet{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:0 0 calc(var(--d) * .18) var(--atm);transform:translateZ(0)}
.planet>.tex{position:absolute;left:0;top:0;height:100%;width:400%;background-size:auto 100%;background-repeat:repeat-x;animation:rot var(--rot,60s) linear infinite;will-change:transform}
.planet::before{content:"";position:absolute;inset:0;z-index:1;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.35),transparent 38%),radial-gradient(circle at 72% 72%,rgba(0,0,0,.82),transparent 62%);mix-blend-mode:normal}
.planet::after{content:"";position:absolute;inset:0;z-index:1;border-radius:50%;box-shadow:inset calc(var(--d) * -.14) calc(var(--d) * -.1) calc(var(--d) * .22) rgba(0,0,0,.85),inset 0 0 calc(var(--d) * .06) var(--atm)}
@keyframes rot{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.p-extra{position:absolute;pointer-events:none}
.map-ui{position:fixed;z-index:30;pointer-events:none;inset:0}
.map-ui>*{pointer-events:auto}
.map-head{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--st)) 14px 30px;display:flex;align-items:flex-start;gap:10px;background:linear-gradient(180deg,rgba(2,3,10,.85),transparent);pointer-events:none}
.map-head>*{pointer-events:auto}
.map-title{flex:1;min-width:0}
.map-title h1{font:700 15px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 18px rgba(255,200,100,.35)}
.map-title p{margin:2px 0 0;font-size:12px;color:var(--ink2);letter-spacing:.04em}
.map-tools{position:absolute;right:12px;top:calc(var(--st) + 74px);display:grid;gap:8px}
.mtool{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(8,12,28,.78);border:1px solid var(--hair2);color:var(--ink);cursor:pointer;touch-action:manipulation}
.mtool:active{transform:scale(.94)}
.mtool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.coords{position:absolute;left:14px;top:calc(var(--st) + 78px);font:500 10px/1.5 var(--f-display);letter-spacing:.14em;color:rgba(160,200,255,.55);pointer-events:none;text-transform:uppercase}
.sheet{position:absolute;left:50%;bottom:calc(var(--tabh) + var(--sb) + 12px);width:min(calc(100% - 24px),560px);transform:translate(-50%,calc(100% + 120px));transition:transform .5s var(--ease);padding:16px 16px 14px;display:grid;gap:12px}
.sheet[data-open]{transform:translate(-50%,0)}
.sheet-h{display:flex;gap:14px;align-items:center}
.sheet-h .mini{width:62px;height:62px;flex:none}
.sheet-h .grow{flex:1;min-width:0}
.sheet-h h2{font:700 20px var(--f-display);letter-spacing:.08em}
.sheet-h p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.sheet .x{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.06);color:var(--ink2);cursor:pointer;z-index:2}
.sheet-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--hair)}
.stat b{display:block;font:700 16px var(--f-display);color:var(--ink)}
.stat span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.sheet-actions{display:flex;gap:8px}
.sheet-actions .btn{flex:1}
.sheet .sector{font:500 10px var(--f-display);letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}
.minimap{position:absolute;left:12px;bottom:calc(var(--tabh) + var(--sb) + 12px);width:104px;height:74px;border-radius:12px;background:rgba(6,9,22,.78);border:1px solid var(--hair2);overflow:hidden;transition:opacity .3s}
.minimap canvas{width:100%;height:100%}
.sheet-open .minimap{opacity:0;pointer-events:none}
.map-hint{position:absolute;left:50%;bottom:calc(var(--tabh) + var(--sb) + 22px);transform:translateX(-50%);padding:8px 14px;border-radius:99px;font-size:12px;color:var(--ink2);background:rgba(6,9,22,.8);border:1px solid var(--hair);white-space:nowrap;transition:opacity .4s;pointer-events:none}
.sheet-open .map-hint{opacity:0}

/* hyperspace */
.hyper{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;transition:opacity .25s}
.hyper[data-on]{opacity:1}
.hyper canvas{width:100%;height:100%}
.flash{position:fixed;inset:0;z-index:91;pointer-events:none;background:#fff;opacity:0}
.flash[data-on]{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

/* droid */
.droid-fab{position:fixed;right:12px;bottom:calc(var(--tabh) + var(--sb) + 12px);z-index:45;width:62px;height:70px;border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6));transition:transform .3s var(--ease),opacity .3s}
.droid-fab:active{transform:scale(.92)}
.sheet-open .droid-fab,.hide-droid .droid-fab{opacity:0;pointer-events:none;transform:translateY(20px)}
.droid-fab svg{width:100%;height:100%;overflow:visible}
.bb-body{animation:roll 2.6s ease-in-out infinite;transform-origin:32px 52px}
.bb-head{animation:bobh 2.6s ease-in-out infinite}
@keyframes roll{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes bob{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
.droid-bubble{position:fixed;right:80px;bottom:calc(var(--tabh) + var(--sb) + 40px);z-index:46;max-width:min(250px,64vw);padding:10px 12px;border-radius:16px 16px 4px 16px;font-size:13.5px;line-height:1.4;background:rgba(10,16,36,.95);border:1px solid hsl(var(--accent-h) 100% 70% / .35);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}

/* modal & sheets */
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,3,9,.72);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal-card{width:100%;max-width:600px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px calc(18px + var(--sb));border-radius:24px 24px 0 0;display:grid;gap:14px;align-content:start;animation:up .45s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:700px){.modal{align-items:center}.modal-card{border-radius:24px;max-height:86dvh}}
.modal-h{display:flex;align-items:center;gap:12px}
.modal-h .grow{flex:1;min-width:0}
.modal-h h2{font:700 18px var(--f-display);letter-spacing:.06em}
.modal-x{width:42px;height:42px;flex:none;border-radius:12px;border:0;background:rgba(255,255,255,.07);color:var(--ink2);cursor:pointer;font-size:18px}

/* toast */
.toasts{position:fixed;left:0;right:0;top:calc(var(--st) + 10px);z-index:95;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;width:min(100%,420px);display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;cursor:pointer;animation:tin .5s var(--ease)}
.toast .ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);font-size:18px}
.toast b{display:block;font-size:14px}
.toast span{font-size:12.5px;color:var(--ink2)}
.toast.out{animation:tout .4s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.97)}}
@keyframes tout{to{opacity:0;transform:translateY(-12px)}}

/* ---------- PLANET VIEW ---------- */
.pv{position:relative;min-height:100dvh;padding:0 0 calc(var(--tabh) + var(--sb) + 30px)}
.pv-amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pv-amb canvas{position:absolute;inset:0;width:100%;height:100%}
.pv-amb .scape{position:absolute;left:0;right:0;bottom:0;width:100%;height:46vh}
.pv-amb .sky{position:absolute;inset:0}
.pv-amb .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(3,4,10,.55) 60%,rgba(3,4,10,.92))}
.pv-inner{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:calc(10px + var(--st)) 16px 0;display:grid;gap:16px}
.pv-hero{display:grid;justify-items:center;text-align:center;gap:8px;padding:8px 0 4px}
.pv-hero .big{width:min(46vw,190px);aspect-ratio:1}
.pv-hero h1{font:700 clamp(2rem,10vw,3rem)/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 30px var(--atm,rgba(255,255,255,.3))}
.pv-hero .tag{font-family:var(--f-letter);font-style:italic;font-size:1.3rem;color:var(--ink2)}
.pv-hero .desc{max-width:44ch;color:var(--ink2);font-size:14.5px;margin:0}
.pv-stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.effect{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;border-radius:16px;border:1px solid rgba(255,217,138,.4);background:linear-gradient(180deg,rgba(255,200,100,.1),rgba(255,200,100,.03))}
.effect .ic{font-size:20px;line-height:1}
.effect b{color:var(--gold);display:block;font-size:14px}
.effect span{font-size:13.5px;color:var(--ink2)}
.missions{display:grid;gap:10px}
.mission{display:flex;align-items:center;gap:14px;width:100%;padding:14px;text-align:left;cursor:pointer;border-radius:18px;transition:transform .15s}
.mission:active{transform:scale(.985)}
.mission .mi{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(255,255,255,.03));border:1px solid var(--hair2)}
.mission[data-done] .mi{border-color:rgba(141,255,196,.5);box-shadow:0 0 16px rgba(141,255,196,.18)}
.mission .grow{flex:1;min-width:0}
.mission b{display:block;font-size:15.5px}
.mission span{font-size:13px;color:var(--ink2)}
.mission[data-locked]{opacity:.55}
.lcards{display:grid;gap:10px}
.lcard{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;text-align:left;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair);cursor:pointer;transition:transform .15s,background .2s}
.lcard:active{transform:scale(.985);background:rgba(255,255,255,.07)}
.lcard[disabled]{cursor:default;opacity:.62}
.lcard .lk{width:46px;height:46px;flex:none;display:grid;place-items:center}
.lcard .grow{flex:1;min-width:0}
.lcard b{display:block;font-size:15px;line-height:1.25}
.lcard span{font-size:12.5px;color:var(--ink3)}
.lcard .new{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);flex:none}
.lcard .fav{color:var(--gold);font-size:16px}
.kind-ic svg{width:40px;height:40px;overflow:visible}

/* mission stages */
.stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:1px solid var(--hair2);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage--tall{aspect-ratio:3/4}
.stage .it{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:44px;display:grid;place-items:center;background:none;border:0;padding:0;font-size:26px;cursor:pointer;transition:transform .3s,opacity .4s}
.stage .it:active{transform:translate(-50%,-50%) scale(.9)}
.stage .it[data-got]{opacity:.15;pointer-events:none;transform:translate(-50%,-50%) scale(1.6)}
.m-note{margin:0;color:var(--ink2);font-size:14.5px}
.m-quote{margin:0;font-family:var(--f-letter);font-size:1.35rem;line-height:1.45;text-align:center;color:var(--ink);text-wrap:balance}
.m-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.m-done{display:grid;justify-items:center;gap:8px;text-align:center;padding:14px;border-radius:16px;background:rgba(141,255,196,.07);border:1px solid rgba(141,255,196,.3)}
.m-done b{color:var(--ok)}
.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pad{aspect-ratio:1.4;border-radius:18px;border:2px solid rgba(255,255,255,.14);background:color-mix(in srgb,var(--c) 22%,#0b0f23);cursor:pointer;transition:filter .12s,transform .12s,box-shadow .2s}
.pad[data-lit]{background:var(--c);filter:brightness(1.25);transform:scale(.97);box-shadow:0 0 30px var(--c)}
.holdbtn{position:relative;width:150px;height:150px;border-radius:50%;margin:0 auto;display:grid;place-items:center;border:2px solid var(--accent-line);background:radial-gradient(circle,var(--accent-soft),transparent 70%);color:var(--ink);font-weight:700;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.holdbtn svg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg)}
.holdbtn circle{fill:none;stroke-width:5}
.field{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--accent-line);background:rgba(0,0,0,.35);color:var(--ink);font:inherit;font-size:16px}
textarea.field{min-height:110px;resize:vertical}
.optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opt{min-height:56px;padding:10px 12px;border-radius:14px;border:1px solid var(--hair2);background:rgba(255,255,255,.05);color:var(--ink);text-align:left;cursor:pointer;font-size:14px;font-weight:600;display:grid;gap:2px}
.opt small{font-weight:400;color:var(--ink3);font-size:12px}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 14px var(--accent-glow)}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem{aspect-ratio:1;border-radius:14px;border:1px solid var(--hair2);background:linear-gradient(135deg,#2a2016,#16110b);font-size:26px;cursor:pointer;display:grid;place-items:center;color:var(--gold);transition:transform .3s}
.mem[data-open]{background:linear-gradient(135deg,rgba(255,217,138,.25),rgba(255,217,138,.05));border-color:var(--gold)}
.mem[data-ok]{opacity:.55}
.mem:not([data-open])>span{opacity:0}
.cipher{display:grid;justify-items:center;gap:14px}
.cipher-wheel{width:220px;height:220px;border-radius:50%;position:relative;border:2px solid rgba(255,217,138,.45);background:radial-gradient(circle,rgba(255,217,138,.12),rgba(0,0,0,.2) 70%);transition:transform .35s var(--ease)}
.cipher-wheel span{position:absolute;left:50%;top:50%;font:700 12px var(--f-display);color:var(--gold)}
.cipher-out{font:700 clamp(1.05rem,5vw,1.4rem) var(--f-display);letter-spacing:.14em;text-align:center;min-height:2.6em;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal b{font-size:11px;color:var(--ink3);font-weight:600}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.04);color:var(--ink2);cursor:pointer}
.cal button[data-21]{border-color:var(--gold);color:var(--gold);font-weight:700;box-shadow:0 0 12px rgba(255,217,138,.3)}
.cal button[data-today]{background:var(--accent-soft);color:var(--ink)}
.range{width:100%;accent-color:var(--gold);height:36px}

/* ---------- LETTER READER ---------- */
.reader{position:fixed;inset:0;z-index:80;overflow-y:auto;overscroll-behavior:contain;background:#03040a}
.reader-bg{position:fixed;inset:0;pointer-events:none}
.reader-in{position:relative;max-width:640px;margin:0 auto;padding:calc(10px + var(--st)) 16px calc(30px + var(--sb));display:grid;gap:16px}
.reader-top{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:3;padding:calc(6px + var(--st)) 0 6px;margin-top:calc(-10px - var(--st))}
.reader-top::before{content:"";position:absolute;inset:0 -16px;background:linear-gradient(180deg,rgba(3,4,10,.95) 60%,transparent);z-index:-1}
.reader-top .grow{flex:1}
.projector{display:grid;justify-items:center;gap:0;margin-top:6px}
.beam{width:min(78%,420px);height:46px;clip-path:polygon(44% 100%,56% 100%,100% 0,0 0);background:linear-gradient(0deg,rgba(127,227,255,.55),rgba(127,227,255,.04));filter:blur(1px);animation:flicker 3s infinite}
@keyframes flicker{0%,100%{opacity:.85}47%{opacity:.85}48%{opacity:.4}50%{opacity:.9}}
.paper{position:relative;display:grid;gap:18px;padding:26px 22px 28px;border-radius:22px;animation:materialize .9s var(--ease) both}
@keyframes materialize{0%{opacity:0;transform:translateY(12px) scaleY(.96);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
.paper p{margin:0;font-family:var(--f-letter);font-size:calc(1.28rem * var(--ts));line-height:1.62;color:#f3f7ff;text-wrap:pretty;hyphens:auto}
.paper .stamp{font:600 10.5px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--holo)}
.paper .rule{height:1px;background:linear-gradient(90deg,transparent,var(--hair2),transparent)}
.paper h1{font-family:var(--f-letter);font-size:clamp(2rem,8.5vw,2.6rem);line-height:1.08;font-weight:600}
.paper--holo{background:linear-gradient(180deg,rgba(40,120,170,.18),rgba(10,30,60,.25));border:1px solid rgba(127,227,255,.35);box-shadow:0 0 40px rgba(127,227,255,.12),inset 0 0 30px rgba(127,227,255,.06)}
.paper--holo::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(127,227,255,.05) 0 1px,transparent 1px 4px)}
.paper--holo p,.paper--holo h1{color:#e8fbff;text-shadow:0 0 12px rgba(127,227,255,.25)}
.paper--archive{background:linear-gradient(180deg,#e9dcc0,#d8c5a0);color:#2b1f12;border:1px solid #b89a6a;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 60px rgba(120,80,30,.25)}
.paper--archive p,.paper--archive h1{color:#2b1f12;text-shadow:none}
.paper--archive .stamp{color:#7a5528}
.paper--archive .rule{background:linear-gradient(90deg,transparent,#a8865a,transparent)}
.paper--archive .sign{color:#7a5528}
.paper--holocron{background:linear-gradient(180deg,rgba(60,40,10,.4),rgba(20,12,4,.6));border:1px solid rgba(255,217,138,.5);box-shadow:0 0 60px rgba(255,190,80,.15),inset 0 0 40px rgba(255,190,80,.08)}
.paper--holocron p,.paper--holocron h1{color:#fff6e3}
.paper--holocron .stamp{color:var(--gold)}
.paper .sign{text-align:right;font-style:italic;color:var(--gold)}
.reader-actions{display:flex;gap:8px}
.reader-actions .btn{flex:1}
.glyphs{display:flex;justify-content:center;gap:10px;opacity:.55;font-size:13px;letter-spacing:.3em;color:#7a5528;font-family:var(--f-display)}
.cube{width:120px;height:120px;margin:10px auto 0;perspective:500px}
.cube-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cuberot 9s linear infinite}
.cube-in i{position:absolute;inset:0;border:2px solid rgba(255,217,138,.8);background:radial-gradient(circle,rgba(255,217,138,.35),rgba(120,70,10,.25) 70%);box-shadow:inset 0 0 20px rgba(255,200,100,.5)}
.cube-in i:nth-child(1){transform:translateZ(60px)}.cube-in i:nth-child(2){transform:rotateY(90deg) translateZ(60px)}.cube-in i:nth-child(3){transform:rotateY(180deg) translateZ(60px)}
.cube-in i:nth-child(4){transform:rotateY(-90deg) translateZ(60px)}.cube-in i:nth-child(5){transform:rotateX(90deg) translateZ(60px)}.cube-in i:nth-child(6){transform:rotateX(-90deg) translateZ(60px)}
@keyframes cuberot{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.cube.opening .cube-in{animation:cubeopen 1.4s var(--ease) forwards}
@keyframes cubeopen{0%{transform:rotateX(-20deg) rotateY(0) scale(1)}70%{transform:rotateX(-20deg) rotateY(540deg) scale(1.2);opacity:1}100%{transform:rotateX(-20deg) rotateY(720deg) scale(.2);opacity:0}}

/* ---------- pages ---------- */
.pcards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.pcards{grid-template-columns:repeat(3,1fr)}}
.pcard{display:grid;justify-items:center;gap:6px;padding:16px 10px 12px;text-align:center;border-radius:18px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--hair);transition:transform .15s}
.pcard:active{transform:scale(.97)}
.pcard .pp{width:64px;height:64px}
.pcard b{font:700 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.pcard span{font-size:11.5px;color:var(--ink3)}
.pcard .bar{width:80%}
.pcard[data-locked]{opacity:.5}
.summary{display:flex;gap:14px;align-items:center;padding:14px 16px}
.summary .grow{flex:1;min-width:0;display:grid;gap:4px}
.summary b{font-size:15px}
.summary span{font-size:13px;color:var(--ink2)}
.timeline{position:relative;display:grid;gap:14px;padding-left:24px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--gold),var(--accent),transparent)}
.tl{position:relative;padding:14px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair)}
.tl::before{content:"";position:absolute;left:-23px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.tl .d{font:600 11px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.tl b{display:block;font-size:16px;margin-top:2px}
.tl p{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.tl .m-row{justify-content:flex-start;margin-top:8px}
.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.counter div{padding:14px 6px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair)}
.counter b{display:block;font:700 clamp(1.4rem,7vw,2rem) var(--f-display);color:var(--gold)}
.counter span{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.secret-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair)}
.secret-row .grow{flex:1;min-width:0}
.secret-row b{display:block;font-size:14.5px}
.secret-row span{font-size:12.5px;color:var(--ink3)}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair)}
.setrow .grow{flex:1;min-width:0}
.setrow b{display:block;font-size:15px}
.setrow span{font-size:12.5px;color:var(--ink3)}
.switch{position:relative;width:52px;height:30px;flex:none;border-radius:99px;border:0;background:rgba(255,255,255,.15);cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.switch[aria-checked=true]{background:var(--accent)}
.switch[aria-checked=true]::after{transform:translateX(22px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;background:#0a0f22}
.swatch i{width:8px;height:30px;border-radius:4px;background:#fff;box-shadow:0 0 6px 3px var(--c),0 0 16px 6px var(--c)}
.swatch[aria-pressed=true]{border-color:var(--c)}

/* ---------- intro ---------- */
.intro{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;touch-action:manipulation}
.intro canvas{position:absolute;inset:0;width:100%;height:100%}
.intro-stage{position:relative;z-index:2;width:100%;max-width:560px;padding:0 26px;text-align:center}
.i-meta{margin:0;font:600 12px var(--f-display);letter-spacing:.28em;text-transform:uppercase;color:var(--holo);opacity:0;animation:iup 1s var(--ease) both}
.i-line{margin:10px 0 0;font-family:var(--f-letter);font-size:clamp(1.45rem,6.2vw,2rem);line-height:1.3;color:#eef4ff;opacity:0;animation:iup 1.1s var(--ease) both;text-wrap:balance}
.i-gold{color:var(--gold);font-size:clamp(2rem,9vw,2.8rem);text-shadow:0 0 30px rgba(255,217,138,.45)}
@keyframes iup{from{opacity:0;transform:translateY(14px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.longago{font-family:var(--f-body);font-size:clamp(1.05rem,4.6vw,1.35rem);color:#5fb8ff;line-height:1.5;opacity:0;animation:lga 5s ease both;text-align:left;max-width:22em;margin:0 auto}
@keyframes lga{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
.crawl-wrap{position:fixed;inset:0;perspective:320px;perspective-origin:50% 30%;overflow:hidden;z-index:2;mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 100%);-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 100%)}
.crawl{position:absolute;left:50%;bottom:0;width:min(88vw,520px);transform-origin:50% 100%;transform:translateX(-50%) rotateX(24deg) translateY(100%);animation:crawl 24s linear forwards;color:var(--gold);text-align:justify;font:600 clamp(1.15rem,5vw,1.55rem)/1.5 var(--f-body)}
.crawl h2{text-align:center;font:700 clamp(1.2rem,5.4vw,1.7rem) var(--f-display);letter-spacing:.1em;margin-bottom:1em}
.crawl .ep{text-align:center;font:600 .9em var(--f-display);letter-spacing:.2em;margin-bottom:.4em}
.crawl p{margin:0 0 1em}
@keyframes crawl{from{transform:translateX(-50%) rotateX(24deg) translateY(100%)}to{transform:translateX(-50%) rotateX(24deg) translateY(-160%)}}
.i-title{display:grid;justify-items:center;gap:10px}
.i-sw{margin:0;font:900 clamp(2.4rem,12vw,4.6rem)/1 var(--f-display);letter-spacing:.08em;color:transparent;-webkit-text-stroke:2px var(--gold);text-shadow:0 0 40px rgba(255,217,138,.35);opacity:0;animation:zoomout 2.4s var(--ease) both}
@keyframes zoomout{from{opacity:0;transform:scale(2.4);letter-spacing:.3em}to{opacity:1;transform:none}}
.i-sub{margin:0;font:600 clamp(.95rem,4.6vw,1.3rem) var(--f-display);letter-spacing:.3em;text-transform:uppercase;opacity:0;animation:iup 1s var(--ease) 1.2s both}
.i-date{margin:4px 0 18px;font-family:var(--f-letter);font-size:1.2rem;color:var(--ink2);opacity:0;animation:iup 1s var(--ease) 1.6s both}
.i-cta{opacity:0;animation:iup 1s var(--ease) 2s both;min-width:240px}
.i-foot{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:0 20px calc(20px + var(--sb));display:grid;justify-items:center;gap:8px}
.i-skip{min-height:44px;padding:0 22px;border-radius:99px;border:1px solid var(--hair2);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;font-weight:600}
.i-hint{margin:0;font-size:12px;color:var(--ink3);letter-spacing:.06em}

/* setup */
.setup{position:fixed;inset:0;z-index:99;overflow-y:auto;background:radial-gradient(ellipse at 50% 20%,#0d1638,#03040a 65%);padding:calc(24px + var(--st)) 16px calc(24px + var(--sb));display:flex;justify-content:center}
.setup-in{width:100%;max-width:520px;display:grid;gap:18px;align-content:center}
.setup h1{font:700 1.6rem var(--f-display);letter-spacing:.06em}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.14)}
.dots i[data-on]{background:var(--accent);box-shadow:0 0 10px var(--accent-glow)}
.droid-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.droid-pick button{display:grid;justify-items:center;gap:4px;padding:12px 6px;border-radius:16px;border:1px solid var(--hair2);background:rgba(255,255,255,.04);cursor:pointer;color:var(--ink)}
.droid-pick button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.droid-pick svg{width:56px;height:62px}
.droid-pick small{color:var(--ink3);font-size:11.5px;line-height:1.3;text-align:center}

/* saber divider */
.saber{height:4px;border-radius:99px;background:#fff;box-shadow:0 0 6px 2px var(--accent),0 0 18px 4px var(--accent-glow);transform-origin:left;animation:ignite .9s var(--ease) both}
@keyframes ignite{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.planet,.bb-body,.bb-head,.reticle svg,.route-on,.cube-in{animation:none!important}}
@media (orientation:landscape) and (max-height:520px){
  .sheet{left:auto;right:12px;transform:translate(0,calc(100% + 120px));width:340px}
  .sheet[data-open]{transform:translate(0,0)}
  .map-tools{top:calc(var(--st) + 60px)}
  .pv-hero .big{width:120px}
}
.pcard{overflow:hidden}
.kind-ic svg{width:100%;height:auto}
.lcard .kind-ic svg{width:40px;height:40px}
@keyframes fly{from{transform:translateX(-40vw)}to{transform:translateX(120vw)}}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) translateY(-4px)}50%{transform:translate(-50%,-50%) translateY(4px)}}

@keyframes bobh{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
@media (orientation:landscape) and (max-height:560px){
  .sheet{left:auto;right:12px;top:calc(var(--st) + 10px);bottom:calc(var(--tabh) + var(--sb) + 10px);transform:translate(0,0) translateX(calc(100% + 40px));width:min(360px,46vw);overflow-y:auto;align-content:start}
  .sheet[data-open]{transform:none}
  .sheet .m-note{display:none}
  .map-tools{right:auto;left:12px;top:calc(var(--st) + 112px);grid-auto-flow:column}
  .coords{display:none}
}
/* droid hangar, npcs, orbi, achievements */
.dr-head{display:flex;gap:14px;align-items:center}
.dr-ava{width:92px;height:100px;flex:none;display:grid;place-items:center;border-radius:20px;background:radial-gradient(circle at 50% 60%,var(--accent-soft),transparent 70%)}
.dr-ava svg{overflow:visible}
.dr-stats{display:grid;gap:6px;flex:1;min-width:0;font-size:12px;color:var(--ink2)}
.bubble{margin:0;padding:12px 14px;border-radius:14px;background:hsl(var(--accent-h) 100% 70% / .1);border:1px solid hsl(var(--accent-h) 100% 70% / .3);color:var(--ink);line-height:1.5;font-size:14.5px}

@media (orientation:landscape) and (max-height:560px){.nextbtn{top:calc(var(--st) + 54px)}}

.paper--archive{transform-origin:top;animation:unroll 1.2s var(--ease) both}
@keyframes unroll{0%{opacity:0;clip-path:inset(0 0 100% 0)}20%{opacity:1}100%{clip-path:inset(0 0 0 0)}}

.reader .saber{animation:ignite 1s var(--ease) 1.2s both}

.tab svg{transition:transform .3s var(--ease)}
.tab[aria-current=page] svg{transform:translateY(-2px) scale(1.08)}
.noanim .pv-hero .big,.noanim .pv-hero h1,.noanim .pv-hero .tag,.noanim .pv-hero .desc,.noanim .pv-hero .pv-stats,.noanim .pv-hero .eyebrow,.noanim .pv-inner>*,.noanim .view>.page>*{animation:none!important}
.pnode,.plabel{transition:opacity .4s}

.has-sel .plabel:not([data-hide]){opacity:.55}

</style></head><body><script>
const DATA={"planets":[{"id":"naboo","name":"Naboo","tagline":"El jardín de las cartas","description":"Lagos tranquilos, jardines y una arquitectura elegante. Aquí empieza el viaje y aquí se guardan las primeras cartas.","palette":{"surface":["#9fe3c0","#2f8f7a","#0b3b3f"],"atmosphere":"#a8ffe0"}},{"id":"coruscant","name":"Coruscant","tagline":"La ciudad de los recuerdos","description":"Una ciudad que nunca se apaga. Cada edificio iluminado guarda un recuerdo de nuestra historia.","palette":{"surface":["#ffd98a","#c0763a","#3a1d3f"],"atmosphere":"#ffc16b"}},{"id":"tatooine","name":"Tatooine","tagline":"Dos lugares, una historia","description":"Un desierto bajo dos soles que representa los kilómetros entre Tenerife y Valencia, y las ganas de acortarlos.","palette":{"surface":["#ffe3a1","#d99a4e","#6b3a22"],"atmosphere":"#ffd38a"}},{"id":"endor","name":"Endor","tagline":"El bosque de los secretos","description":"Un bosque lleno de luces pequeñas y sonidos suaves. Casi todo lo importante está escondido.","palette":{"surface":["#9be37a","#3c7a3a","#10301f"],"atmosphere":"#b6ff9a"}},{"id":"ahch-to","name":"Ahch-To","tagline":"La biblioteca de los sentimientos","description":"Una isla tranquila con una biblioteca antigua. Cada libro se abre como una carta que merece leerse despacio.","palette":{"surface":["#b9d6ff","#4f7fb5","#12294a"],"atmosphere":"#a8d0ff"}},{"id":"mustafar","name":"Mustafar","tagline":"El valor de seguir adelante","description":"Un planeta volcánico sobre la paciencia, la madurez y el apoyo mutuo.","palette":{"surface":["#ff9a6b","#b3341d","#2a0a0f"],"atmosphere":"#ff7a4d"}},{"id":"alderaan","name":"Alderaan","tagline":"El planeta de los sueños","description":"Un lugar tranquilo y hermoso donde guardar lo que queremos hacer, ver y construir juntos.","palette":{"surface":["#c8e6ff","#5aa0d8","#1b3f66"],"atmosphere":"#b0dcff"}},{"id":"hoth","name":"Hoth","tagline":"El observatorio estelar","description":"Un planeta nevado con el mejor cielo de la galaxia. Desde aquí se observan estrellas y mensajes escondidos.","palette":{"surface":["#ffffff","#b7d4ea","#4a6a8a"],"atmosphere":"#e3f4ff"}},{"id":"bespin","name":"Bespin","tagline":"La ciudad de las nubes","description":"Una ciudad suspendida en el cielo, ligera y luminosa, para los mensajes cortos y las postales.","palette":{"surface":["#ffd1e0","#e88fb0","#6a3a7a"],"atmosphere":"#ffb8d2"}},{"id":"kashyyyk","name":"Kashyyyk","tagline":"El santuario de la naturaleza","description":"Árboles gigantes y criaturas por cuidar. Un planeta pensado para quien trata tan bien a los animales.","palette":{"surface":["#7fe0a0","#2c8a5a","#0a2e2a"],"atmosphere":"#8affc0"}},{"id":"jedha","name":"Jedha","tagline":"El archivo de las historias","description":"Una ciudad antigua de templos y archivos donde viven las leyendas galácticas y los mensajes cifrados.","palette":{"surface":["#e8d3b0","#a8825a","#3a2a22"],"atmosphere":"#ffe0b0"}},{"id":"desconocido","name":"El Sistema Desconocido","tagline":"El final secreto","description":"Un sistema oculto que solo aparece cuando la aventura principal está completa. Aquí se cierra la historia.","palette":{"surface":["#e5c9ff","#8a5cd8","#1a1040"],"atmosphere":"#c9a0ff"}}],"letters":[{"id":"naboo-solsticio","title":"El día más largo","category":"historia","language":"es","planet":"naboo","transmission":"Transmisión desde Naboo · la primera","unlock":{"type":"always"},"body":["Mi niña, voy a empezar por un dato que me gusta mucho: el 21 de junio de 2026 fue el solsticio de verano. Es el día con más luz de todo el año, el que más tarda en terminar. Y justo ese día es el que elegimos, sin buscarlo, como el principio de nuestra historia.","No te voy a contar qué pasó aquel día como si fuera una película, porque lo que vivimos fue de verdad y no necesita adornos. Lo guardo tal cual, con lo que sentí y con lo poco que entendía entonces de lo que estaba empezando. Lo único que añado es esta coincidencia, que me parece un detalle precioso: empezamos en el día en que la luz gana la partida.","Me gusta pensar que desde entonces cada día 21 es como una pequeña estación a la que llegamos. Un sitio donde parar un momento, mirar hacia atrás y comprobar cuánto camino llevamos. Y mirar hacia delante, sin prisa, que lo bonito se cuida despacio.","Esta galaxia, mi amor, la he hecho para ti. Cada planeta, cada rincón y cada carta que vayas encontrando tiene detrás muchas horas y muchas ganas de que sonrías. Esta es la primera. Quería que fuera sencilla: una bienvenida y una fecha.","Así que ya lo sabes. Si alguna vez te preguntas por dónde empieza todo esto, empieza en el día más largo del año, con la luz entrando por todas partes. No hace falta saber más.","Ahora explora a tu ritmo. No hay prisa, no hay examen y no se pierde nada si un día no entras. Aquí todo te espera.","Te quiero muchísimo."]},{"id":"naboo-trato","title":"Cómo tratas a la gente","category":"admiracion","language":"es","planet":"naboo","transmission":"Transmisión desde Naboo · jardines de palacio","unlock":{"type":"planet-visited","planet":"naboo"},"body":["Hay una cosa tuya que no sale en ninguna foto y que a mí me parece de lo mejor que tienes: cómo tratas a la gente.","Lo he visto con tu madre. Hay una manera de mirarla, de contestarle, de estar pendiente de ella, que dice más que cualquier frase bonita. Lo he visto con tu familia, con tus amigos, y también con las personas mayores, a las que hablas con una paciencia y un cariño que no todo el mundo tiene. Y con tus perritos, que se te nota que los quieres como a dos personas más de la casa.","Tienes un don, cariño, aunque quizá no te lo parezca porque a ti te sale sin esfuerzo: haces que la gente se sienta bien a tu lado. No hace falta que hagas nada especial. Basta con que estés, escuches y sonrías. La gente se relaja cerca de ti, y eso es un regalo enorme.","Yo me fijo mucho en eso. Una persona se conoce de verdad por cómo trata a quien no puede darle nada a cambio. Y tú, con una naturalidad que me impresiona, eres amable con todos. Con el de la tienda, con la vecina, con quien sea.","A veces, cuando estoy lejos, me pongo a recordar esas pequeñas escenas y pienso: qué suerte tengo de que alguien así me quiera y me dedique parte de su tiempo.","Sé que para ti es lo normal. Por eso te lo escribo, para que lo sepas desde fuera: lo que haces con los demás se nota, se agradece y se recuerda. Yo lo recuerdo.","Gracias por ser así, mi vida. Me hace querer ser mejor persona a mí también."]},{"id":"naboo-nervios","title":"Contar las horas","category":"recuerdos","language":"es","planet":"naboo","transmission":"Transmisión desde Naboo · antes de viajar","unlock":{"type":"flag","flag":"naboo.garden"},"body":["Te cuento lo que me pasa cuando sé que voy a verte, por si no te lo había dicho nunca con todas las letras.","Empiezo a contar las horas. Primero son días, claro. Pero cuando falta poco, se convierten en horas, y al final me sorprendo mirando el reloj como si pudiera acelerarlo con la mirada. Reviso la maleta una vez, otra, otra más. Me pregunto si me habré dejado algo importante, y casi siempre lo importante no cabe en ninguna maleta.","Y los nervios, mi niña. Pensarás que con la confianza que ya tenemos se me tendrían que haber pasado. Pues no. Me siguen entrando exactamente igual. Un cosquilleo en el estómago, un poco de miedo a hacerlo todo mal y muchísima ilusión por estar a tu lado. Todo mezclado.","Lo curioso es que no quiero que se me quiten. Me gusta que me pase. Creo que esos nervios son la prueba de que lo nuestro me importa de verdad, de que no lo doy por hecho y de que cada encuentro sigue siendo algo grande para mí.","Imagino que a ti también te pasa algo parecido. Si es así, me encantaría saberlo algún día con tus propias palabras. Y si no, no pasa nada, ya me ocupo yo de ponerme nervioso por los dos.","Mientras tanto, en mi isla sigo contando. Tengo una cuenta atrás en la cabeza que no necesita calendario. Sé perfectamente cuánto falta, y sé también que cuando llegue ese día me va a parecer que todo el tiempo de espera ha valido la pena.","Cuéntame tú cómo lo llevas, cariño. Y mientras tanto, aquí tienes mis horas, todas contadas, todas para ti."]},{"id":"naboo-agost","title":"Agost","category":"historia","language":"va","planet":"naboo","transmission":"Transmissió des de Naboo · el primer viatge","unlock":{"type":"flag","flag":"naboo.fountain"},"body":["Xiqueta meua, vull parlar-te d'agost. L'agost de 2026, quan vaig agafar un avió des de Tenerife i vaig anar a València a vore't.","Quan una cosa s'espera tant, la imaginació es posa a treballar sola. Jo m'ho havia imaginat de moltes maneres, i com sempre la realitat va ser millor i més senzilla. Va ser fer el viatge, arribar, i sentir que tot el que havíem parlat des de lluny ara tenia cara, veu i mirada.","Aquells dies van estar plens de coses boniques. Hi va haver flors, hi va haver sorpreses, hi va haver moments amb la teua família, i hi va haver uns nervis enormes que no hi havia manera de llevar-me. Jo anava per ahí intentant semblar tranquil i et puc assegurar que per dins era un caos de felicitat.","No et vaig a contar cada detall, perquè hi ha coses que es queden millor guardades. Però sí que vull que saps una cosa: en aquell viatge vaig entendre que el que sentia no era una il·lusió passatgera. Vaig tornar a casa amb la maleta una mica més buida i el cor molt més ple.","Eixes setmanes d'agost són per a mi com un paisatge al qual puc tornar quan vull. Tanque els ulls i hi sóc. Hi ha llum, hi ha rialles, i hi estàs tu.","Gràcies per deixar-me entrar en la teua vida i en la teua família amb tanta naturalitat. No ho oblidaré mai.","T'estime moltíssim, vida meua.","Cada vegada que passe per davant d'una font, m'ho recorde i em ve un somriure. Les coses menudes tenen eixa propietat: s'amaguen en qualsevol lloc i, quan menys t'ho esperes, et porten d'un salt a un moment concret. Per a mi, ara, una font és això: una finestra xicoteta cap a un dia que vull conservar."]},{"id":"naboo-boberies","title":"Les teues boberies","category":"admiracion","language":"va","planet":"naboo","transmission":"Transmissió des de Naboo · el llac","unlock":{"type":"flag","flag":"naboo.bench"},"body":["Anem a parlar d'una cosa molt seriosa: les teues boberies.","Eixes coses que dius sense adonar-te'n, les ocurrències que et surten de no se sap on, els gestos que fas quan penses que ningú t'està mirant. Jo sí que et mire, i que sàpies que m'ho apunte tot al cor. Hi ha dies que podria escriure un llibre només amb el que dius quan estàs distreta.","El més bonic és que no ho fas per fer-me riure. Et ix així, de manera natural, i per això em fa tanta gràcia. Una boberia teua val més que mil acudits ben preparats. És com si el món tinguera un botó de felicitat i tu el trobares sense voler cada vegada.","A mi, que de vegades em pose massa seriós, em ve fenomenal. M'agafes distret, em fas riure i, de sobte, tot pesa menys. Eixa és una de les coses que més t'agraïsc: que has portat a la meua vida un poc més de lleugeresa.","I també m'agrada el teu riure, clar. El teu riure i eixa cara que fas quan intentes no riure i no ho aconseguixes. Eixa cara és un tresor. Si pogués guardar-la en un pot la portaria sempre en la butxaca.","Quan estem lluny, vaig recordant algunes d'eixes boberies. Em pose a somriure sol pel carrer i la gent deu pensar que estic un poc sonat. Però no importa. Que pensen el que vulguen, jo sé el motiu.","Continua sent així, cariño. No canvies res. T'estime moltíssim.","I és que a mi les boberies que fem tu i jo no em pareixen boberies. Les considere part de la nostra manera de ser: eixe llenguatge secret, eixos acudits que ningú més entendria. Tinc moltes ganes de continuar inventant-ne, i espere que tu també. Si un dia deixem de dir-nos coses sense sentit, serà que alguna cosa ha canviat massa."]},{"id":"naboo-pasear","title":"Pasear sin prisa","category":"suenos","language":"es","planet":"naboo","transmission":"Transmisión desde Naboo · el jardín del lago","unlock":{"type":"all","of":[{"type":"flag","flag":"naboo.garden"},{"type":"flag","flag":"naboo.fountain"},{"type":"flag","flag":"naboo.bench"}]},"body":["Cuando me preguntan por mis sueños, la gente espera cosas grandes. Y los tengo, no te creas. Pero los que más me ilusionan son los pequeños, y casi todos tienen que ver contigo.","Me imagino paseando. Nada más. Caminar sin mirar la hora, con algún sitio al que ir o sin ninguno, y hablar de lo que se nos ocurra. Me imagino que me cuentas una historia, de esas que sabes tú, mitología o lo que sea, y que yo hago de oyente agradecido aunque tú sepas muchísimo más que yo.","Me imagino sentarnos juntos en un banco, sin móviles ni pantallas, y que el rato se alargue porque no hay nada urgente que hacer. Compartir un sitio tranquilo. Hacer silencio sin que sea incómodo. Que nos veamos y que sobren las palabras.","Me gustaría conocer más lugares contigo. No lugares famosos, necesariamente. Lugares que a partir de ese día fueran nuestros. Y también me hace ilusión que nuestras familias se conozcan más, que haya mesas largas y tiempo para todo.","Sé que esto suena sencillo, pero para mí es lo que más vale. Cuando estoy lejos y me pregunto qué quiero, la respuesta siempre es algo así: tiempo contigo, de ese que no tiene nombre.","No te prometo nada con fecha, porque no quiero prometer lo que no depende solo de mí. Pero sí te prometo que lo deseo con el corazón entero y que voy a seguir trabajando, con paciencia, para que las cosas buenas lleguen cuando tengan que llegar.","Mientras tanto, este paseo por Naboo es nuestro primer ensayo. Te veo ahí, junto al lago, sentada sin prisa. Y me gusta lo que veo, mi niña bonita."]},{"id":"naboo-mar","title":"Un mar de por medio","category":"distancia","language":"bilingue","planet":"naboo","transmission":"Transmisión desde Naboo · entre dos orillas","unlock":{"type":"all","of":[{"type":"planet-visited","planet":"naboo"},{"type":"flag","flag":"naboo.bench"}]},"body":["Entre tú y yo hay un mar. Lo digo sin dramatismo, como quien describe un mapa: yo en Tenerife, tú en Alzira, y por medio un montón de agua y de kilómetros.","Al principio pensaba que eso era un obstáculo y nada más. Ahora lo veo distinto. Un mar también es un camino. Es lo que hace que cada vez que cruzo para verte tenga un peso especial, que cada llegada sea una pequeña fiesta y que cada despedida duela, sí, pero también deje un montón de cosas bonitas para recordar.","Et mentiria si et diguera que no et trobe a faltar. Et trobe a faltar moltíssim: la teua mà, la teua veu, les teues ocurrències en persona. Però també et diré una cosa que he après: que la distància no és el contrari de l'estima. Només és una manera de viure-la amb paciència.","Hay días en que se me hace larga, no te lo voy a negar. Otros, en cambio, se me pasan rápido pensando en lo siguiente que haremos. Lo importante es que, pase lo que pase, seguimos siendo parte del día a día del otro. Una llamada, un mensaje, una foto o una carta bastan para que el mar se haga un poco más pequeño.","M'agrada pensar que l'aigua que ens separa és la mateixa que ens uneix. Que és el mateix mar, i que quan miro cap a l'horitzó, tu estàs mirant cap a l'altre costat.","Gracias por tener paciencia conmigo, por esperar y por confiar. Te quiero muchísimo, mi vida. T'estime moltíssim."]},{"id":"coruscant-llamadas","title":"Las noches en llamada","category":"distancia","language":"es","planet":"coruscant","transmission":"Transmisión desde Coruscant · hora nocturna","unlock":{"type":"flag","flag":"coruscant.lights"},"body":["Esta ciudad no duerme nunca, y me ha recordado a nuestras noches.","Durante mucho tiempo, mi plan favorito del día fue esperar a que llegara la noche para hablar contigo. Nada especial: la llamada, tu voz, un rato de contarnos el día. A veces hablábamos mucho y otras casi nada, y las dos cosas me parecían perfectas. Había noches en que nos quedábamos dormidos sin colgar. Yo me quedaba un momento escuchándote respirar, tranquila, y pensaba que aunque nos separaran tantos kilómetros, en ese instante estábamos en el mismo sitio.","Te voy a confesar algo: ese sonido tranquilo me daba una paz enorme. No hacía falta que dijeras nada. Con saber que estabas ahí, al otro lado, me bastaba.","También quiero decirte que me parece bonito cómo hemos ido cuidando esos ratos. Nos hemos puesto nuestros límites en las llamadas y en cómo nos demostramos cariño, porque los dos queremos hacer las cosas como creemos que está bien. Y lo hemos hablado con naturalidad, con respeto, sin que ninguno sintiera que se le pedía algo difícil. Eso me hace valorarte todavía más. Es otra manera de cuidarnos.","Ahora, cuando miro las luces de esta ciudad inventada, pienso en todas las ventanas encendidas y en la cantidad de gente que, como nosotros, comparte la noche con alguien que está lejos. Me gusta pensar que no somos los únicos, pero también que lo nuestro tiene un brillo propio.","Gracias por todas esas noches, mi amor. Las guardo como se guarda lo que de verdad importa: sin hacer ruido, pero sin dejar nunca que se apague."]},{"id":"coruscant-ojos","title":"Tus ojos marrones","category":"admiracion","language":"es","planet":"coruscant","transmission":"Transmisión desde Coruscant · torre del amanecer","unlock":{"type":"flag","flag":"coruscant.daynight"},"body":["Podría hablarte de tus ojos durante una hora, así que voy a intentar ser breve y seguramente fracasaré.","Son marrones, y dicho así parece poca cosa. Pero cuando te miro a los ojos, no es un color lo que veo. Veo una expresión que cambia constantemente: cuando te ríes, cuando estás pensando en algo, cuando algo te emociona o cuando te quedas un segundo callada y se te nota que estás en otro sitio. Podría pasarme horas mirándote, y seguiría encontrando detalles que no había visto.","Hay una cosa que me pasa y que no me pasa con nadie más. Cuando me miras, me siento visto. No como cuando alguien te mira por educación, sino de verdad. Como si pudieras saber lo que pienso antes de que lo diga. Y eso, aunque a veces me da un poquito de vergüenza, me gusta muchísimo.","Una de las cosas que más echo de menos cuando estoy en mi isla es eso, simplemente poder mirarte. A través de una pantalla no es lo mismo. En una videollamada te veo, pero no te encuentro. Hace falta tenerte delante para que los ojos hagan su trabajo.","Por eso cuando nos vemos en persona intento mirarte todo lo que puedo, aunque a veces me corte un poco. Quiero llevarme la mayor cantidad posible de esa imagen, para poder recordarla después con calma.","Y si algún día me pillas mirándote con cara de tonto, no te asustes: es que me estoy acordando de lo afortunado que soy.","Te quiero muchísimo, mi niña bonita."]},{"id":"coruscant-manos","title":"Debajo de la mesa","category":"recuerdos","language":"es","planet":"coruscant","transmission":"Transmisión desde Coruscant · mesa para dos","unlock":{"type":"flag","flag":"coruscant.inbox"},"body":["Hay gestos pequeños que valen más que cualquier discurso. Uno de los que más guardo es el de nuestras manos juntas debajo de la mesa.","Estábamos sentados, con la gente alrededor, y por encima de la mesa todo era normal: conversación, miradas educadas, tal vez un vaso de agua. Pero por debajo, discretamente, nuestras manos se buscaban. Era una cosa casi secreta, nuestra, que nadie más tenía por qué saber.","Me acuerdo de lo importante que me parecía, y de lo poco que duraba cada vez que aparecía algo que había que atender. Sentía que estaba haciendo algo enorme sin que nadie lo notara. Se me ponía un calorcito que no tenía que ver con la temperatura.","No sé si tú lo recuerdas igual, mi vida. Imagino que cada uno guarda su versión. La mía tiene mucho que ver con la tranquilidad que me daba. Una mano cogida no necesita explicaciones. No pide nada, no promete nada, solo dice: estoy aquí contigo.","Es curioso. Con todo lo que se puede contar de un viaje, los sitios, los planes, la comida, lo que de verdad se me quedó grabado fue esto. Un gesto de apenas unos segundos. Un contacto.","Cuando estoy en casa y me noto un poco bajo de ánimo, cierro los ojos y me traigo ese recuerdo. Vuelvo a sentir esa calma. Y entonces la distancia se hace más llevadera.","Tengo muchas ganas de volver a sentarme a una mesa contigo. Aunque sea un café, aunque sea poca cosa. Con tal de tener tu mano cerca, el resto es lo de menos."]},{"id":"coruscant-cartas","title":"Tus cartas","category":"momentos","language":"es","planet":"coruscant","transmission":"Transmisión desde Coruscant · archivo del holoterminal","unlock":{"type":"flag","flag":"coruscant.diary"},"body":["Hoy quiero darte las gracias por una cosa concreta: tus cartas.","Cuando abro una de tus cartas, me pasa algo muy particular. Antes de leer la primera línea ya sé que me van a hacer bien. Y siempre lo hacen. Tienes una manera de decir las cosas, con tanta ternura y tanto cuidado, que me hace sentir querido de un modo que casi no sé describir.","Me has escrito cosas preciosas. Me has recordado que quieres estar a mi lado en los días buenos y también en los difíciles. Y mira, esa frase, la de los días difíciles, es la que más me pesa en el buen sentido. Es fácil querer cuando todo va bien. Que alguien te diga que seguirá ahí cuando las cosas no salgan como esperabas es otra liga completamente distinta.","No sé si sabes cuántas veces las he releído. Hay momentos en que me hacen falta, y las busco como quien busca un abrigo. Las leo despacio, a veces en voz baja. Y siempre encuentro una frase nueva que antes se me había pasado.","También me gusta saber que te tomaste tu tiempo. Una carta no se escribe en un minuto, y que alguien dedique ese tiempo a pensar en ti, a elegir las palabras, es uno de los mayores regalos que se pueden hacer. Para mí ese tiempo vale más que cualquier cosa que se pueda comprar.","Esta galaxia, en parte, existe por eso. Porque tú me escribes con el corazón y yo quería, a mi manera, escribirte también. Con letras, con planetas y con todas las ganas.","Gracias por cada una de tus palabras, mi amor. Las tengo guardadas con muchísimo cariño."]},{"id":"coruscant-octubre","title":"El 3 d’octubre","category":"historia","language":"va","planet":"coruscant","transmission":"Transmissió des de Coruscant · el segon viatge","unlock":{"type":"all","of":[{"type":"flag","flag":"coruscant.lights"},{"type":"flag","flag":"coruscant.daynight"}]},"body":["Hi ha dates que no necessiten gaire explicació. El 3 d'octubre va ser una d'eixes: la data en què vaig tornar a València.","Quan vam estar junts a l'agost, jo pensava que ja ho havia viscut tot, que no hi havia res més. I després va resultar que tornar a vore't era encara més bonic. La primera vegada tens la sorpresa; la segona tens la certesa. I jo vaig descobrir que m'agradava més la certesa.","Poder vore't una altra vegada després d'estar tan lluny, separats per tants quilòmetres, va significar moltíssim per a mi. Vaig comprendre que allò no era un moment passatger, que anàvem de veres. Que hi havia ganes per part dels dos de continuar, de cuidar-ho, de fer-ho bé.","Els dies abans del viatge van ser un poc una tortura dolça. Comptava les hores, em preguntava si seria igual que l'altra vegada. I va ser igual, i va ser diferent. Més tranquil, més nostre. Ja no havia d'impressionar ningú; només estar.","Una cosa que m'agradaria que sàpigues és que cada vegada que torne a València em sent un poc menys visitant. No sé com explicar-ho. És com si la ciutat, i sobretot tu, em reconeguera.","Eixe 3 d'octubre és ja una de les pàgines que més voldria rellegir. Si algun dia ho fem, vull que estiguem els dos, amb un café a la mà, vorem les fotos i ens riguem de com anàvem de nerviosos.","Gràcies per eixe retrobament, cariño. T'estime moltíssim.","Hi ha dates que no són ni festes ni aniversaris, i tot i això es queden. Per a mi, el 3 d'octubre és una d'eixes. No cal fer-hi res especial: només em basta saber que va passar, que era real, i que d'allà vam continuar cap endavant amb més confiança, un poc més a prop l'un de l'altre."]},{"id":"coruscant-caras","title":"Nuestras caras de situación","category":"recuerdos","language":"bilingue","planet":"coruscant","transmission":"Transmisión desde Coruscant · señal de risas","unlock":{"type":"all","of":[{"type":"flag","flag":"coruscant.inbox"},{"type":"flag","flag":"coruscant.diary"}]},"body":["Esta carta va de reírnos, que es una parte muy importante de lo nuestro y a veces se me olvida decirlo.","Tenemos una cosa que me encanta: las caras de situación. Esos momentos en que, sin decirnos nada, nos miramos y sabemos exactamente lo que está pensando el otro. Una ceja, una media sonrisa, una mirada de reojo. Y empezamos a reírnos sin que nadie más entienda por qué. Es de lo mejor que tenemos.","Les nostres rialles són un món a part. No sé si ens passa a tothom, però a nosaltres ens passa molt: alguna bobada que no té importància es converteix de sobte en el moment més divertit del dia. I després no podem parar.","También me encantan esos momentos en los que parece que pensamos lo mismo a la vez. Cuando uno empieza una frase y el otro la termina, o cuando los dos decimos algo idéntico en el mismo segundo. No sé qué es. Quizá nada raro; quizá simplemente que nos conocemos mejor de lo que creíamos.","Jo crec que això és molt important. Riure junts vol dir que estem a gust, que no hem de fingir res. Que podem ser nosaltres, amb les nostres cares rares i els nostres silencis còmics.","Cuando estoy lejos y me acuerdo de alguna de esas escenas, me río solo. Y siempre pienso lo mismo: qué suerte que alguien me entienda con una sola mirada.","Seguiremos acumulando caras de situación, mi vida. Cada encuentro será una nueva colección. Y mientras tanto, yo guardo las que ya tengo, con muchísimo cariño. Te quiero muchísimo. T'estime moltíssim."]},{"id":"tatooine-ruta","title":"Tenerife – Valencia","category":"distancia","language":"es","planet":"tatooine","transmission":"Transmisión desde Tatooine · puerto espacial","unlock":{"type":"flag","flag":"tatooine.trips3"},"body":["Si algún día dibujaran nuestra historia en un mapa, sería una línea. Una línea fina que sale de Tenerife, cruza el agua y llega a Valencia. Y de vuelta.","Me gusta imaginarla así, porque cuando estás metido en la distancia solo ves los kilómetros que faltan, y cuando te alejas un poco ves otra cosa: ves un camino. Un camino que ya hemos recorrido, que ya conocemos, y que seguiremos recorriendo.","Hay quien piensa que la distancia solo se soporta. Yo he empezado a pensar que se puede habitar. Que tiene sus rutinas, sus rincones y sus trucos. Los mensajes del día, las llamadas, las cuentas atrás, las fotos que mandamos, las cosas que guardamos para contarnos cuando nos veamos. Todo eso forma una especie de casa que construimos entre los dos aunque cada uno viva en su sitio.","No quiero decirte que es fácil. Hay momentos en que pesa, y los dos lo sabemos. Pero tampoco quiero hablar de esto como si fuera una tragedia, porque no lo es. Es una circunstancia, y estamos aprendiendo a llevarla con paciencia y con ilusión. Cada viaje es una prueba de que queremos ir.","Y yo, cada vez que pongo rumbo a Valencia, noto algo parecido a lo que debe sentir un navegante que sabe que al otro lado hay tierra. No es solo alegría. Es la seguridad de que alguien me espera.","Gracias por ser esa tierra firme, mi vida. Gracias por esperarme y por venir también a mi encuentro, aunque sea con la cabeza y el corazón."]},{"id":"tatooine-soles","title":"Dos sols","category":"distancia","language":"va","planet":"tatooine","transmission":"Transmissió des de Tatooine · dos horitzons","unlock":{"type":"flag","flag":"tatooine.suns"},"body":["En este planeta hi ha dos sols, i sempre que els mire pense en nosaltres.","Tu tens el teu sol a València, jo tinc el meu a Tenerife. Cadascú viu el seu dia amb la seua llum, i de vegades es nota que hi ha un petit desfasament: tu estàs veient una alba que jo encara no he vist, o jo estic mirant un capvespre que tu ja has deixat arrere. Però en el fons és el mateix cel gran, i és la mateixa estrella la que ens il·lumina.","M'agrada pensar que, encara que estiguem en llocs diferents, compartim el mateix dia. Quan t'escric al matí, tu estàs ocupada amb les teues coses; quan em contestes, jo potser estic pensant en tu des d'un altre racó. I això que pareix poca cosa és una manera molt bonica de fer companyia.","Hi ha una cosa que m'ha ensenyat la distància: a valorar els petits moments. Un missatge de bon dia pesa molt. Una fotografia dels teus gossets em canvia la jornada. Una cançó que et fa pensar en mi, encara que no la haja dit abans, em fa sentir que ocupe un lloc dins del teu dia.","Quan un dels dos té un mal dia, l'altre pot fer de segon sol. Això és el que vull ser per a tu: un poc de llum extra, d'eixa que no enlluerna, sinó que acompanya.","Gràcies per ser el meu altre sol, xiqueta. T'estime moltíssim.","A vegades faig un joc xicotet: quan veig la posta de sol, calcule quant de temps li queda a la teua. I imagine que en algun moment els dos mirem la mateixa llum que se'n va. No és gens científic, ho sé, però em fa companyia, i això és el que importa."]},{"id":"tatooine-peus","title":"Els peus davall la taula","category":"recuerdos","language":"va","planet":"tatooine","transmission":"Transmissió des de Tatooine · senyals secretes","unlock":{"type":"flag","flag":"tatooine.beacon"},"body":["Esta carta és per a un record que només entendrem nosaltres dos: els peus davall la taula.","Si algú ho llegira sense saber res, pensaria que estic dient una bobada. I té gràcia, perquè és justament això, una bobada, però de les que valen or. Eixes xicotetes trepitjades, eixos tocs de peu, eixes bromes silencioses mentre per damunt de la taula tot semblava normal i seriós.","Era la nostra manera de parlar sense dir res. Un toc volia dir «estic ací». Un altre, «mira què ha dit». Un altre, simplement, «me n'alegre que estigues». Podíem estar en mig d'una conversa amb altres persones i, en secret, tenir una altra conversa paral·lela que ningú més sentia.","A mi eixos moments em fan una gràcia tremenda. Perquè em recorden que la complicitat no necessita grans gestos. Que de vegades és això: un peu que busca un altre peu, una mirada que es creua, una rialla que es contén per no fer-se notar.","Jo crec que les relacions es construïxen així, amb coses xicotetes que després ningú pot explicar però que tots dos recordem perfectament. Algú de fora diria que no té importància. Però sí que la té, perquè eixes coses ens fan ser nosaltres.","Quan m'ho recorde, em ve la rialla. M'imagine l'escena des de fora i pense que hauríem eixit en alguna pel·lícula d'espies de baixa categoria. Però la veritat és que m'és igual, perquè ens ho passàvem molt bé.","Gràcies per eixes xicotetes trepitjades, vida meua. N'hi haurà moltes més."]},{"id":"tatooine-despedidas","title":"Las despedidas","category":"recuerdos","language":"bilingue","planet":"tatooine","transmission":"Transmisión desde Tatooine · última llamada de embarque","unlock":{"type":"flag","flag":"tatooine.trips3"},"body":["Las despedidas son la parte más difícil de todo esto, y creo que no te lo he escrito nunca así de directo.","Cuando se acercan los últimos días de un viaje, empiezo a mirar el tiempo de otra forma. Todo parece que corre más rápido. Intento exprimir cada rato, y a la vez me da miedo gastarlo. Y llega el momento, y hay que volver a Tenerife, y siento que me dejo allí un trozo de mí.","Recuerdo los abrazos antes de separarnos. Esos abrazos que se alargan un poquito más de lo que tocaría. Y las miradas, que dicen todo lo que la boca no consigue. Quería aprovechar hasta el último segundo, hasta el último gesto.","També recorde el petó a la galta en una d'aquelles despedides. Una cosa molt senzilla, molt dolça. Va ser com un punt i seguit: no és un adéu, és un fins aviat. Eixe petó el guarde com un petit tresor.","Lo más curioso es que, aunque duelen, estas despedidas también me enseñan algo. Me dicen que lo que vivimos vale la pena. Que no me dolería tanto si no fuera importante. Y me hacen volver a casa con una sensación mezclada, un poco de pena y mucha ilusión por el siguiente encuentro.","Quan torne a Tenerife, els primers dies són els més estranys. Tot em sembla massa silenciós. Però després arriba un missatge teu i es posa de nou en marxa el món.","Gracias por hacer que cada despedida sea un hasta pronto, mi niña. Te quiero muchísimo."]},{"id":"tatooine-camino","title":"Entre un viaje y otro","category":"historia","language":"es","planet":"tatooine","transmission":"Transmisión desde Tatooine · diario de a bordo","unlock":{"type":"all","of":[{"type":"flag","flag":"tatooine.trips3"},{"type":"flag","flag":"tatooine.suns"}]},"body":["Entre agosto y octubre hubo un tiempo que casi no cuenta en los calendarios y que para mí fue importantísimo: el de en medio.","Los viajes son lo que se ve. Las fechas, los billetes, las fotos. Pero lo que pasó entre un viaje y el otro es lo que sostuvo todo. Fueron semanas de mensajes, de llamadas, de ir sabiendo cosas el uno del otro un poco más cada día. Allí no había flores ni sorpresas, pero había constancia. Y la constancia, cuando se trata de querer a alguien, es lo que más pesa.","Recuerdo que después del primer viaje todo me parecía algo distinto. La ilusión seguía, pero tenía un sabor nuevo: ya no era una promesa sin forma, era una realidad con cara. Sabía a quién iba a escribirle cuando me despertara, a quién iba a contarle una tontería, con quién quería celebrar una buena noticia.","Y eso hizo que el segundo viaje fuera diferente. Más tranquilo, más mío y tuyo. Ya no era descubrirnos; era reconocernos.","Si tuviera que resumir estos meses en una idea, sería esta: lo nuestro ha crecido despacio, y yo lo agradezco. No ha sido un golpe de emoción que luego se apaga. Ha sido algo que se ha ido construyendo con pequeñas cosas, una detrás de otra, como se construyen las cosas que duran.","Y todavía queda mucho camino. No hay prisa. Cada tramo tiene su belleza y no me quiero saltar ninguno.","Gracias por ir a este ritmo conmigo, mi amor. Es el ritmo que más me gusta."]},{"id":"tatooine-jehova","title":"Lo que más admiro de ti","category":"admiracion","language":"es","planet":"tatooine","transmission":"Transmisión desde Tatooine · lo más importante","unlock":{"type":"planets-visited","min":3},"body":["Entre todas las cosas que admiro de ti, hay una que está por encima de las demás: tu amor por Jehová.","Te lo digo sin rodeos porque es verdad. Me hace sentir muy orgulloso verte esforzarte por hacer las cosas bien, por poner tu fe por delante, por querer agradarle en lo grande y en lo pequeño. No es algo que hagas para que te vean. Se nota que es sincero, que nace de dentro, que forma parte de quién eres.","En un mundo donde muchas cosas se hacen a medias, ver a alguien que se toma en serio lo que cree es una de las cosas más bonitas que existen. Y que esa persona seas tú, la persona a la que quiero, me llena de agradecimiento.","Lo valoro mucho porque yo también quiero mejorar en eso. Estar cerca de ti me anima a querer hacerlo mejor. No porque me lo pidas ni porque me compares con nada, sino porque tu ejemplo me hace querer acercarme más. Cuando te veo, pienso: yo también quiero ser así de constante.","Sé que ninguno de los dos es perfecto y que cada uno está aprendiendo. Pero creo que lo importante es que miramos en la misma dirección. Eso, para mí, vale muchísimo más que cualquier otra cosa que pudiéramos tener en común.","Así que gracias, mi niña. Gracias por tu fe, por tu esfuerzo y por ese corazón que pones en todo.","Tengo claro que, si hay algo que me enamora de ti, y hay muchas cosas, esto está justo en el centro."]},{"id":"tatooine-esperar","title":"Aprendre a esperar","category":"distancia","language":"va","planet":"tatooine","transmission":"Transmissió des de Tatooine · el desert","unlock":{"type":"all","of":[{"type":"flag","flag":"tatooine.suns"},{"type":"flag","flag":"tatooine.beacon"}]},"body":["Al desert aprens una cosa que a la ciutat se t'oblida: que esperar no és perdre el temps.","Jo no he sigut mai una persona especialment paciente. Vull les coses ja, vull saber-ho tot, vull que els dies passen més ràpid. I resulta que la vida m'ha posat en una situació on la paciència és obligatòria: viure amb un mar pel mig. Al principi ho portava malament. Ara ho porte millor, i en gran part és gràcies a tu.","Tu tens una manera de fer les coses amb calma que m'ha contagiat. Veig com t'ho preses amb serenitat, com no et venç el desànim, com dius «ja arribarà» i et creus de veres que arribarà. I jo, que sóc més nerviós, he anat aprenent de tu.","Esperar a estar junts, esperar a vore'ns, esperar que les coses es vagen posant al seu lloc. Hi ha una cosa molt bonica en açò: quan esperes algú de veres, no passes el temps sense fer res. L'ompli de coses. De cartes, de missatges, de projectes, de pensaments. Cada dia d'espera és un dia que dediques, a la teua manera, a esta persona.","I jo, en els meus dies d'espera, he descobert que també m'estic construint. Que aprenc a cuidar el que estime, a no donar res per fet i a agrair els moments que sí que tenim.","Sé que la paciència no sempre és còmoda. Però quan pense en el que hi ha a l'altre costat de l'espera, em pareix un preu molt xicotet.","Gràcies per esperar amb mi, xiqueta. No ho faria amb ningú més. T'estime moltíssim."]},{"id":"tatooine-encuentros","title":"Cuando nos volvemos a ver","category":"momentos","language":"es","planet":"tatooine","transmission":"Transmisión desde Tatooine · aterrizaje","unlock":{"type":"all","of":[{"type":"flag","flag":"tatooine.trips3"},{"type":"flag","flag":"tatooine.suns"},{"type":"flag","flag":"tatooine.beacon"}]},"body":["Quiero dedicar una carta entera a ese momento exacto en que nos volvemos a ver después de estar separados. Solo ese instante.","Es un instante muy raro. Llevas días, semanas, preparán
