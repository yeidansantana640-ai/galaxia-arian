dolo en la cabeza. Imaginas cómo será, qué dirás, cómo te mirará. Y cuando por fin llega, el cerebro se queda en blanco. De golpe todo lo que habías ensayado desaparece y lo único que queda es la persona que tienes delante.","A mí me pasa que no sé muy bien qué hacer con las manos. Sonrío un poco más de lo normal. Se me escapa alguna tontería. Y noto, mientras todo eso ocurre, que por dentro hay una alegría enorme que busca la manera de salir.","Lo que más me gusta es la sensación de que los días de espera se doblan sobre sí mismos. De repente ya no hay distancia, ya no hay calendario ni cuentas atrás. Solo hay un presente muy nítido en el que estás tú.","Y después viene la parte más sencilla y más bonita: seguir. Pasear, hablar, reírnos, mirarnos. Descubrir que, aunque hayamos pasado tiempo lejos, nos entendemos igual que siempre. Que todo sigue donde lo dejamos.","Cada encuentro es un regalo que no doy por supuesto y que agradezco a Jehová cada vez.","Ojalá nos queden muchos encuentros por delante. Mientras llega el próximo, aquí me tienes, preparando maleta y ensayando las palabras que luego se me olvidarán. Te quiero muchísimo, mi vida.","Y lo bonito es que cada reencuentro tiene su propio sabor. El primero estaba lleno de nervios. El segundo, de confianza. Y los que vengan tendrán algo distinto que todavía no sé nombrar. Me gusta ir descubriendo cómo cambian, porque eso significa que lo nuestro está vivo y que avanza."]},{"id":"endor-flores","title":"Flores en Valencia","category":"historia","language":"es","planet":"endor","transmission":"Transmisión desde Endor · bosque de luciérnagas","unlock":{"type":"flag","flag":"endor.holocron"},"body":["Hay una imagen que me gusta guardar: yo, en Valencia, con unas flores en la mano, pensando en cómo dártelas.","Parece una escena sencilla y lo es. Pero tenía más nervios de los que quería admitir. Quería que el gesto saliera bien, que te gustara, que no fuera ni demasiado ni demasiado poco. Le di mil vueltas, como hago con todo lo que me importa.","Con el tiempo he entendido que las flores no eran lo importante. Lo importante era lo que querían decir: que había pensado en ti antes de verte, que quería que tu día tuviera algo bonito, que me apetecía tener un detalle contigo sin ninguna razón más que quererlo.","Y lo que más recuerdo es tu reacción. No hizo falta ningún discurso. Se notó que te hizo ilusión, y eso para mí fue suficiente recompensa. Ver que un gesto pequeño puede alegrarle el día a alguien es una de las cosas que más me gusta de querer a una persona.","Por eso en este bosque he dejado escondido un recuerdo así, de los que parecen poca cosa. Porque creo que nuestra historia está hecha de eso: de detalles pequeños que, juntos, forman algo grande.","Hay muchas flores todavía por regalarte, y también muchas maneras de decirte lo que siento sin palabras. Mientras llegan, te dejo esta carta, que es mi ramo de hoy.","Te quiero, Arián. Que tengas un día precioso.","Si tuviera que elegir una sola cosa de aquel día para quedarme, no sería la flor, ni siquiera el momento de entregarla. Sería ese segundo antes, en el que todavía no sabía cómo iba a salir todo, y aun así tenía ganas. Esa mezcla de nervio y de ilusión es, creo, lo que se siente cuando algo importa."]},{"id":"endor-escoltar","title":"Escoltar-te parlar","category":"admiracion","language":"va","planet":"endor","transmission":"Transmissió des d’Endor · llum entre els arbres","unlock":{"type":"flag","flag":"endor.fireflies"},"body":["M'agrada moltíssim escoltar-te quan parles d'allò que t'apassiona.","Es nota de seguida. Canvia el to de la veu, els ulls et brillen un poc més, i et sorgeixen les paraules amb una facilitat que no tens quan parles d'altres coses. Parles de mitologia, de llibres, de pel·lícules, de la història de Roma, de personatges que t'han marcat, i jo em quede escoltant sense cap ganes d'interrompre't.","Hi ha persones que s'avergonyeixen d'allò que els agrada. Tu no. Tu ho expliques amb una alegria sincera, i això ho trobe molt valuós. Perquè quan algú parla així, em deixa entrar un poquet al seu món, i jo m'ho prenc com un regal.","He après coses amb tu que no hauria après de cap altra manera. He descobert històries que no coneixia, i he mirat amb uns altres ulls algunes que ja coneixia. I el millor és que no ho fas per presumir: ho fas perquè t'agrada compartir.","A mi em passa una cosa estranya: encara que el tema no siga el meu, em contagies l'entusiasme. Si tu estàs contenta parlant d'alguna cosa, a mi em dóna per escoltar-la sense mirar el rellotge.","Així que ja ho saps: quan vulgues contar-me alguna cosa que t'agrade, tens un oient atent, i content, i enamorat de la teua manera d'il·lusionar-te.","Gràcies per ensenyar-me el teu món, xiqueta. T'estime molt.","I no és només escoltar: és que després ho recorde. Un nom d'un personatge que em vas contar, una escena que et va fer riure, una dada que et va fer brillar els ulls. Quan et ho torne a dir més endavant, noto que somrius, i això és el que més m'agrada: demostrar-te que no se me'n va res."]},{"id":"endor-pequenos","title":"Los pequeños momentos","category":"momentos","language":"bilingue","planet":"endor","transmission":"Transmisión desde Endor · lo que casi no se ve","unlock":{"type":"flag","flag":"endor.creature"},"body":["Si me pidieran que explicara qué es lo que más me gusta de estar contigo, no hablaría de lo grande. Hablaría de lo pequeño.","Me gusta el momento en que te ríes de algo antes de acabar de contarlo. Me gusta cuando te quedas pensando y se te nota en la cara que estás buscando la palabra exacta. Me gusta cómo cambia tu mirada cuando algo te hace gracia, aunque intentes disimularlo.","M'agraden les converses que no van enlloc. Les que comencem parlant d'una cosa i acabem en una altra completament diferent. Eixes en què el temps passa sense que ens adonem, i quan mirem el rellotge ja és molt més tard del que pensàvem.","Y me gustan los silencios cómodos. Los que no hace falta llenar con nada, porque simplemente estar el uno al lado del otro ya es suficiente.","Tal vez a veces no valoramos del todo estas cosas, porque parecen normales. Pero yo las guardo todas. Las tengo ordenadas en una especie de archivo mental, y de vez en cuando abro un cajón y repaso alguna.","Els grans moments són bonics, però no sé si sostenen una relació. Jo crec que el que la sosté són estos xicotets detalls de cada dia, que se sumen sense fer soroll.","Gracias por ser, entre otras muchas cosas, la persona que convierte lo pequeño en algo especial. Te quiero muchísimo, mi vida.","Hay otra cosa pequeña que adoro: cuando nos despedimos de una llamada y todavía dices una última cosa. Esa frase que aparece cuando ya estábamos terminando, casi sin pensarla. Suele ser la más sincera de toda la conversación, y la guardo con especial cuidado."]},{"id":"endor-secreta-1","title":"Lo que nunca consigo explicarte","category":"secreta","language":"es","planet":"endor","transmission":"Transmisión cifrada desde Endor · secreto I","unlock":{"type":"flag","flag":"endor.chest"},"body":["Esta es la primera carta secreta, y la he guardado en un cofre porque habla de algo que me cuesta decir a la cara: lo que de verdad siento y no consigo explicarte bien.","Cuando estoy contigo se me ocurren mil cosas que decirte, y cuando llega el momento se me quedan a medias. Quiero decirte que me importas muchísimo, y sale una frase correcta pero pequeña. Quiero decirte que me haces mejor persona, y sale una broma. Es mi forma de protegerme, supongo. Y por eso he empezado a escribir: porque sobre el papel tengo tiempo de pensar cada palabra.","Lo que quiero que sepas es que cuando te hablo de pequeñas cosas, detrás hay algo mucho más grande. Cuando te pregunto qué tal tu día, lo que quiero saber es si estás bien. Cuando te mando un mensaje sin motivo, es porque me acordé de ti y me hizo feliz acordarme. Cuando me despido, siempre me quedo con ganas de seguir.","No sé explicarte con exactitud lo que siento, pero sí sé que es sincero. No lo he fingido ni lo he exagerado. Es algo tranquilo y firme que ha ido creciendo desde el 21 de junio, y que cada vez que nos vemos o nos hablamos se hace un poco más sólido.","Me gusta cómo eres. Me gusta tu manera de tratar a la gente, tu sentido de lo que está bien, tu cuidado con las cosas pequeñas. Me gusta que seas auténtica y que no tengas que aparentar nada. Me gusta que me escuches, y que me hagas querer ser más paciente, más atento y más constante.","Quizá lo más difícil de decir sea esto: tengo ilusión por lo que viene. No hago promesas que no sé si puedo cumplir, ni quiero ponerle fecha a nada que no depende solo de mí. Lo que sí puedo prometerte es que, mientras me dejes, seguiré cuidando esto con todo el cariño y el respeto que merece.","Y si alguna vez no me sale decírtelo en voz alta, recuerda que existe este archivo, y que cada carta de aquí es un intento de explicarte lo que mi boca no sabe.","Hay algo más que quiero confesarte, y es que a veces tengo miedo de no estar a la altura. De no saber cuidarte tan bien como mereces, de decir algo mal, de hacerte esperar demasiado. No lo cuento para que me tranquilices, sino para que sepas que, cuando me ves torpe, no es por falta de cariño: es por exceso de ganas de hacerlo bien.","Y quiero que sepas también qué es lo que más me alegra de ti, aunque sea una tontería: que contestes con una broma cuando me ves serio. Que me recuerdes, sin decirlo, que no hace falta darle tantas vueltas a todo. Contigo aprendo a quitarme peso de encima, y eso, créeme, es un regalo que no sé cómo devolverte.","Si hubiera una única cosa que quisiera que te llevaras de esta carta, sería esta: no eres una más en mi vida ni una ilusión pasajera. Eres alguien a quien quiero conocer despacio, durante mucho tiempo, con respeto, con cuidado y con ganas. Eso es lo que siento, y lo he escrito aquí para que no se me olvide a mí tampoco.","Gracias por tener paciencia con mi torpeza, mi niña. Gracias por seguir abriendo cofres.","Con todo mi cariño, Yeidan."]},{"id":"ahchto-respeto","title":"Lo que significa respetar","category":"fe-valores","language":"es","planet":"ahch-to","transmission":"Transmisión desde Ahch-To · biblioteca de piedra","unlock":{"type":"flag","flag":"ahch-to.books"},"body":["Quiero escribirte sobre algo que para mí es la base de todo: el respeto.","Respetar es mucho más que no hacer daño. Es escuchar de verdad. Es tener en cuenta tus tiempos, tus límites y lo que te hace sentir cómoda. Es no empujar, no presionar y no esperar de ti nada que no quieras darme libremente. Para mí, querer a alguien y respetarlo son la misma cosa.","También es respetar lo que crees. Tu fe forma parte de ti, y yo no quiero que tengas que elegir entre ser tú y estar conmigo. Quiero apoyarte en lo que te importa, aprender de lo que me enseñas y dejar que las decisiones importantes se tomen con calma y a su debido tiempo.","Y respetar es también cuidar los detalles. Contestarte con atención, no dejarte plantada, avisarte si algo cambia, y estar presente cuando hablamos y no a medias. Cosas que parecen pequeñas y que dicen mucho de lo que uno valora a la otra persona.","Me gustaría que sintieras siempre, desde el primer momento, que contigo puedo ser yo y que tú puedes ser tú. Sin máscaras y sin prisas. Que no hay ninguna cosa tuya que yo quiera cambiar para que encaje.","A veces me pregunto qué ve alguien de fuera en nuestra historia. Y creo que lo que más me gustaría es que viera respeto. Eso me haría sentir que lo estamos haciendo bien.","Gracias por enseñarme, sin pretenderlo, a querer mejor. Te lo agradezco de verdad.","Y si alguna vez fallo en esto, dímelo sin miedo. Respetar también es aceptar la corrección, escucharla y rectificar. No pretendo hacerlo todo bien a la primera, pero sí quiero que sepas que tengo la intención de aprender, y que tus palabras siempre serán bienvenidas."]},{"id":"ahchto-paciencia","title":"La paciència","category":"fe-valores","language":"va","planet":"ahch-to","transmission":"Transmissió des d’Ahch-To · quietud","unlock":{"type":"flag","flag":"ahch-to.calm"},"body":["Hui vull parlar-te d'una virtut que he après a valorar molt des que et conec: la paciència.","Les coses importants no ixen d'un dia per a un altre. Es cuiden, es regen, es deixen créixer. I això val per a una planta, per a una amistat, per a una relació, i també per a un mateix. Cadascú té el seu ritme, i no n'hi ha cap de millor que els altres.","Jo no sempre he tingut esta calma. Tinc la tendència a voler-ho tot ràpid, a angoixar-me si les coses no van com espere. Però amb tu estic aprenent una altra manera de mirar. Una manera que diu: no passa res, ho anirem veient, tenim temps.","Vull que sàpigues que no tinc cap pressa. No et demane que vages més ràpid del que et vinga bé, ni que decidisques coses abans d'hora. Vull que vages al teu pas, i jo aniré al meu, i mentrestant gaudirem del camí.","La paciència també és confiança. Confiar que el que és bo no desapareix perquè passen els dies. Confiar que les paraules que ens diem són sinceres, encara que no ens vegem. Confiar en Jehovà quan les coses no depenen de nosaltres.","Cada dia que passa és un pas, encara que xicotet. I a mi m'agrada contar-los al teu costat.","Gràcies per ensenyar-me a no tindre pressa, vida meua. T'estime moltíssim.","Pense, també, que la paciència no és quedar-se quiet. És continuar fent les xicotetes coses de cada dia, amb constància, mentre esperes. Estudiar, treballar, cuidar els qui t'envolten, parlar-nos. Esperar així no pesa tant, perquè cada jornada té el seu sentit."]},{"id":"ahchto-bondad","title":"La bondad","category":"fe-valores","language":"es","planet":"ahch-to","transmission":"Transmisión desde Ahch-To · una nota en la roca","unlock":{"type":"flag","flag":"ahch-to.note"},"body":["Cuando pienso en las cualidades que más valoro en una persona, siempre aparece la bondad. Y cuando pienso en ti, aparece enseguida.","Tu bondad no es de las que hacen ruido. No necesita que la vean. Está en cómo hablas de la gente, en cómo cuidas lo que te importa, en cómo te preocupas por los demás sin hacer un espectáculo de ello. Es una bondad que se ve en los gestos pequeños y constantes.","Y me hace pensar en lo que cuesta ser amable de verdad. Es fácil serlo cuando todo va bien. Lo difícil es serlo cuando estás cansada, cuando algo te molesta, cuando nadie te está mirando. Tú lo haces, y por eso lo valoro todavía más.","He aprendido contigo que la bondad no es debilidad. Que se puede ser firme y amable al mismo tiempo, que se puede tener carácter sin dejar de ser cálida. Eso me parece una forma de fortaleza muy hermosa.","Intento que algo de eso se me pegue. Intento tratar mejor a los demás, tener más paciencia, juzgar menos y escuchar más. No siempre lo consigo, pero tu ejemplo me ayuda mucho a querer intentarlo.","Si algún día tienes dudas sobre lo que aportas, recuerda esta carta. Aportas muchísimo, y una gran parte de eso es la bondad con la que haces las cosas.","Gracias por ser como eres, mi niña. Te quiero.","Hay un tipo de bondad que me parece especialmente valioso: la que se ejerce sin recibir nada a cambio. La que se queda en silencio y no pide que la reconozcan. Cuando la veo en ti, me da la sensación de estar ante algo auténtico, y eso me hace querer protegerlo y cuidarlo."]},{"id":"ahchto-jehova","title":"Acercarnos a Jehová","category":"fe-valores","language":"bilingue","planet":"ahch-to","transmission":"Transmisión desde Ahch-To · el mismo horizonte","unlock":{"type":"all","of":[{"type":"flag","flag":"ahch-to.books"},{"type":"flag","flag":"ahch-to.calm"},{"type":"flag","flag":"ahch-to.note"}]},"body":["Esta carta es de las más importantes para mí, y quiero escribirla con cuidado.","Una de las cosas que más me gustaría es que los dos sigamos acercándonos a Jehová, cada uno a su ritmo y con sus propias decisiones. No quiero que esto sea un tema de presión ni de comparaciones. Quiero que sea algo natural, que nazca de dentro.","Estic aprenent molt estant prop teu. Veig com et prepares, com li dónes importància a les coses espirituals, com t'esforces per ser constant. I això m'inspira. No perquè ho facis per a mi, sinó perquè veig que és sincer.","Quiero que sepas que lo mío con la fe es un camino en el que sigo creciendo. No tengo todas las respuestas ni soy un ejemplo perfecto. Pero sí tengo el deseo sincero de mejorar y de que Jehová esté en el centro de mi vida y, si algún día llega, de lo que construyamos juntos.","Jo crec que una relació és més forta quan les dues persones miren cap a la mateixa direcció. No perquè ens evite les dificultats, sinó perquè dóna un sentit a tot el que fem, també a les coses xicotetes.","Por eso, cuando hablamos de lo que leemos, de lo que aprendemos o de lo que nos anima, siento que estamos construyendo algo sólido. Algo que no depende solo de lo que sentimos, sino de unos principios en los que ambos creemos.","Gracias por compartir esto conmigo, Arián. Es uno de los regalos más grandes que me has hecho."]},{"id":"ahchto-principios","title":"Cariño con principios","category":"fe-valores","language":"es","planet":"ahch-to","transmission":"Transmisión desde Ahch-To · el límite que cuida","unlock":{"type":"planets-visited","min":4},"body":["Querer a alguien no significa dejar de lado lo que uno es. Y yo quiero quererte sin dejar de ser fiel a lo que creo y a lo que tú crees.","Eso significa poner límites, y no los pongo como una barrera, sino como una forma de cuidarte. Cuidar que lo que hacemos sea limpio, que no nos lleve a situaciones que luego lamentemos, que podamos mirarnos a la cara con la conciencia tranquila. Para mí es una manera de demostrar cariño: no ir más deprisa de lo que debemos, y no pedirte nada que no sea correcto.","Algunos piensan que eso enfría las relaciones. A mí me parece que las hace más fuertes. Cuando sabes que la otra persona te respeta tanto que protege lo que os une, confías todavía más.","También significa que el cariño se demuestra de maneras muy variadas: una palabra amable, un detalle, un mensaje en el momento justo, escuchar con atención, orar por ti. No hace falta nada más para que se note.","Quiero que estés tranquila siempre respecto a esto. Siempre podrás decirme si algo no te parece bien, y yo lo escucharé sin ofenderme. Prefiero cien veces que me lo digas a que te quedes callada.","Y quiero que sepas que, aunque pongamos límites, el cariño no se queda corto. Cabe todo lo que siento, que es muchísimo.","Gracias por entenderlo conmigo, mi vida.","Creo que, al final, los principios no son un freno, sino un mapa. Nos dicen por dónde ir cuando hay muchas direcciones posibles. Y tener un mapa en común hace que caminar juntos sea más fácil, porque no hay que negociar cada paso desde cero: ya sabemos qué cosas importan."]},{"id":"ahchto-diario","title":"Parte de mi día a día","category":"distancia","language":"es","planet":"ahch-to","transmission":"Transmisión desde Ahch-To · respiración lenta","unlock":{"type":"flag","flag":"ahch-to.calm"},"body":["Aunque estemos lejos, quiero que sientas que formas parte de mi día a día. No solo de mis fines de semana de viaje ni de los momentos especiales. De mi rutina normal.","Cuando me despierto, pienso en cómo estarás. Mientras trabajo o hago mis cosas, imagino qué estarás haciendo tú. Cuando me pasa algo curioso, lo primero que pienso es que quiero contártelo. Cuando veo algo bonito, pienso en enseñártelo. Cuando vuelvo a casa por la tarde, sé que algún mensaje tuyo estará esperándome.","Esa presencia pequeña y constante me hace compañía. No sustituye estar juntos, desde luego, pero hace que la distancia sea más llevadera. Siento que no estoy solo, que hay alguien que me acompaña aunque no esté en la misma habitación.","Me gustaría que tú también lo sintieras así. Que sepas que puedes contarme cualquier cosa, grande o pequeña. Un mal día, una alegría, una tontería que se te ha ocurrido. Que para mí nada de lo tuyo es poco importante.","A veces los silencios largos me inquietan, y no es por desconfianza. Es porque me importas y me gusta saber que estás bien. Pero aprendo a respetar tus tiempos, y confío en que, cuando puedas, aparecerás con una sonrisa o un cuéntame.","Gracias por dejarme formar parte de tu día a día, mi niña. Es uno de mis sitios favoritos.","A veces, cuando un día se hace largo, pienso que tú también estarás cansada, y me gustaría que mi mensaje fuera un pequeño descanso. No una obligación de contestar, sino un hueco tranquilo en medio de la jornada. Ojalá lo sientas así: como una pausa amable y no como una tarea más."]},{"id":"ahchto-any","title":"Un any i mig","category":"suenos","language":"va","planet":"ahch-to","transmission":"Transmissió des d’Ahch-To · un horitzó tranquil","unlock":{"type":"flag","flag":"ahch-to.note"},"body":["Hi ha un número que em ve al cap de tant en tant: un any i mig.","No és una data fixada ni un pla tancat. És una manera de dir que, tal com estan les coses, entenc que hem de tindre paciència i que hi ha un temps per davant que no depén només de nosaltres. No et prometre res que no puga complir, ni vull posar-te pressió. Només vull ser sincer sobre com ho veig.","El que sí et puc dir és que no m'espanta esperar. Perquè no és esperar sense més: és anar fent camí, conéixer-nos millor, créixer cadascú en les seues coses i, si és la voluntat de Jehovà, anar acostant-nos.","No estem en una cursa. No hi ha una línia d'arribada que ens obligue a córrer. Hi ha un camí, i en el camí hi ha moltes coses bones per viure: les trucades, els viatges, les cartes, els projectes, els moments en què ens riem junts.","Quan pense en el futur, no el veig com una cosa llunyana i borrosa. El veig com una sèrie de passos xicotets i possibles. Cada vegada que ens veiem és un pas. Cada missatge és un pas. Cada decisió que prenem amb calma és un pas.","Et demane només una cosa: que si alguna vegada tens dubtes, m'ho dígues. Parlar-ne tranquil·lament ens ajuda més que guardar-ho dins.","Gràcies per caminar a poc a poc amb mi, xiqueta. T'estime moltíssim.","Y si en algún momento las cosas cambian, o si lo que hoy veo así resulta ser distinto, te lo diré con la verdad por delante. No quiero que construyamos sobre suposiciones. Prefiero un camino lento y claro que uno rápido y confuso. Ese es el trato que me gustaría tener contigo."]},{"id":"ahchto-bautismo","title":"Tu bautismo","category":"momentos","language":"es","planet":"ahch-to","transmission":"Transmisión desde Ahch-To · un día importante","unlock":{"type":"all","of":[{"type":"flag","flag":"ahch-to.books"},{"type":"flag","flag":"ahch-to.calm"}]},"body":["Hay un momento de tu vida que me gustaría tratar con mucho respeto: tu bautismo.","Es una decisión personal y valiente, y me emociona pensar en lo que significó para ti. Dedicarle tu vida a Jehová es algo muy serio, y verlo en ti me hace admirarte todavía más. No es una cosa que se haga a la ligera, y tú lo hiciste porque lo sentías.","No quiero inventar detalles de ese día ni hablar como si lo hubiera vivido, porque no estuve allí. Lo que sí puedo hacer es decirte lo que me provoca saber que lo hiciste: orgullo, respeto y agradecimiento. Orgullo por tu valentía, respeto por tu decisión y agradecimiento por que me dejes conocer a alguien así.","Cuando pienso en ello, entiendo mejor por qué eres como eres. Por qué cuidas tanto lo que haces, por qué tienes esa calma, por qué te importan los demás. Todo eso tiene una raíz, y esa raíz es lo que más te define.","Quiero ser alguien que te ayude a mantenerte firme en eso. Que te anime cuando las cosas se pongan difíciles, que te recuerde lo importante y que nunca ponga nada por delante de tu relación con Jehová.","Si algún día me quieres contar cómo fue ese día, con los detalles que quieras, te escucharé con mucha atención. Sin prisa y sin interrumpir.","Gracias por haber tomado esa decisión, mi vida. Me inspira muchísimo.","Me gustaría también que sepas que no doy por sentado lo que cuesta mantenerse fiel día a día. Una decisión así se renueva con la oración, el estudio y los pequeños actos de cada jornada. Admiro la constancia con que lo haces, y quiero apoyarte con paciencia, nunca con presión."]},{"id":"ahchto-orgullo","title":"Orgulloso de quien soy contigo","category":"admiracion","language":"es","planet":"ahch-to","transmission":"Transmisión desde Ahch-To · la roca más alta","unlock":{"type":"all","of":[{"type":"flag","flag":"ahch-to.note"},{"type":"planets-visited","min":4}]},"body":["Esta carta va un poco al revés: en vez de hablarte de lo que admiro de ti, quiero hablarte de lo que estoy descubriendo en mí gracias a ti.","Estoy más atento. Antes pasaba por muchas cosas sin fijarme, y ahora observo los detalles, porque contigo he aprendido que ahí está lo importante. Estoy más paciente, porque estar lejos me ha enseñado que no todo se resuelve ya. Estoy más constante, porque querer a alguien de verdad significa estar, no solo sentir.","También estoy más agradecido. Doy gracias por cosas que antes daba por hechas: una llamada, un mensaje, un rato juntos. Y esa gratitud me hace ver la vida de otra manera, más amable, menos apresurada.","No quiero decir que me hayas cambiado, porque no me gustaría que lo pensaras como una carga. Lo que has hecho es sacar lo mejor de mí, esa parte que a veces se queda escondida. Y sentirme así me hace estar orgulloso, no por vanidad, sino por ver que puedo crecer.","Ojalá algún día pueda decirte con hechos, y no solo con palabras, lo mucho que me has ayudado. Mientras tanto, seguiré haciendo el esfuerzo de ser mejor persona, cada día un poquito.","Gracias por ser esa luz tranquila que me anima a mejorar, Arián. Te quiero muchísimo.","Hay algo más que descubro: que no tengo que aparentar contigo. Antes me preocupaba por parecer más seguro de lo que estaba. Contigo puedo decir lo que siento, incluso las dudas, y no pasa nada. Esa libertad de ser yo sin disfraces es uno de los regalos más grandes que me ha dado esta historia."]},{"id":"mustafar-fortaleza","title":"Tu fortaleza","category":"admiracion","language":"es","planet":"mustafar","transmission":"Transmisión desde Mustafar · río de lava","unlock":{"type":"flag","flag":"mustafar.sequence"},"body":["Si tuviera que describir tu fortaleza, no usaría la imagen de una roca. Usaría la de un árbol: algo que se mantiene firme precisamente porque sabe doblarse.","No voy a hablar de cosas que no sé ni a inventarme dificultades que no me has contado. Hablo solo de lo que veo. Veo a alguien que se toma las cosas con serenidad, que sabe esperar, que no se deja arrastrar por el primer impulso. Veo a alguien que mantiene sus decisiones aunque no sean las más fáciles, y que no necesita explicarse ante todo el mundo.","Esa fortaleza no es dureza. Hay personas que parecen fuertes porque no muestran nada, y tú eres fuerte sin dejar de ser cercana y amable. Eso es mucho más difícil, y por eso me parece más valioso.","También veo tu constancia. Esa capacidad de seguir haciendo las cosas bien día tras día, sin necesitar aplausos. Es lo que hace que lo que construyes dure: tu fe, tus estudios, tus gustos, tus relaciones.","A mí me hace mucho bien tenerte cerca, aunque sea a distancia. Me recuerda que la fuerza real es tranquila. Que no hay que gritar para ser firme, ni correr para llegar.","Me gustaría que de vez en cuando te miraras como yo te miro. Estoy seguro de que te sorprenderías.","Gracias por ser un ejemplo para mí, mi vida. Te admiro muchísimo.","Y hay un detalle que me llama mucho la atención: cómo te mantienes tranquila cuando algo no sale como esperabas. No lo vives como un drama. Respiras, lo piensas, y sigues. Esa manera de afrontar lo inesperado es algo que quisiera aprender, y que intento copiarte con humildad."]},{"id":"mustafar-confianza","title":"Paciència i confiança","category":"distancia","language":"va","planet":"mustafar","transmission":"Transmissió des de Mustafar · respiracions de vapor","unlock":{"type":"flag","flag":"mustafar.vents"},"body":["La distància posa a prova dues coses: la paciència i la confiança. I jo vull parlar-te de la segona.","Confiar no vol dir no tindre dubtes mai. Vol dir que, quan en tinc, parle amb tu en lloc de callar-me. Vol dir que no interprete els silencis com si foren senyals roïns, que no imagine coses que no són, que em fie del que ens diem encara que no ens veiem.","Jo confie en tu. Confie que quan em dius una cosa és perquè la sents, i que quan estàs ocupada no és perquè m'oblides. Espere que tu també puguis confiar en mi de la mateixa manera: que quan no et conteste enseguida és perquè estic fent coses, no perquè em preocupe menys.","La confiança es construïx amb hàbits xicotets. Complir el que diem. Avisar si alguna cosa canvia. Dir la veritat encara que siga incòmoda. Ser el mateix quan ens veuen que quan no. Eixes coses, repetides durant mesos, formen una base molt ferma.","I també es construïx amb la paciència de no voler-ho tot a l'instant. Hi ha moments en què el millor que podem fer és respirar, deixar que passe el dia i tornar a parlar amb la ment més tranquil·la.","Ho estem fent bé, xiqueta. No és fàcil, però ho estem fent bé. I jo estic orgullós de nosaltres.","Gràcies per la teua confiança. T'estime moltíssim.","També crec que la confiança creix quan es pot dir «no ho sé» o «tinc por» sense que passe res. Si els dos podem ser vulnerables, la relació es fa més forta. Vull ser eixa persona amb qui puguis dir-ho tot, i vull que tu també siguis eixe lloc segur per a mi."]},{"id":"mustafar-crecer","title":"Seguir creciendo","category":"suenos","language":"es","planet":"mustafar","transmission":"Transmisión desde Mustafar · el templo","unlock":{"type":"flag","flag":"mustafar.temple"},"body":["Uno de mis deseos más sencillos para nosotros es este: que sigamos creciendo.","No hablo de cambiar para gustarnos más. Hablo de que cada uno siga siendo mejor versión de sí mismo, y que lo hagamos al lado del otro. Que dentro de un año me mire al espejo y vea a alguien más paciente, más atento y más sereno. Que tú te mires y veas a alguien más segura de lo valiosa que eres.","Me imagino que seguiremos aprendiendo juntos. Cosas pequeñas, como descubrir nuevos gustos del otro, y cosas grandes, como entender mejor lo que creemos y por qué. Me gusta pensar que cada conversación nos deja un poco más sabios.","Me imagino también que seguiremos teniendo proyectos propios. Tú con tus estudios, tus aficiones, tu espiritualidad. Yo con los míos. Porque creo que una relación sana no consiste en fundirse en uno, sino en dos personas que se acompañan mientras cada una va a lo suyo.","Y ojalá sigamos ilusionándonos. Con un viaje, con un detalle, con una carta. Con las cosas que nos hacen reír y con las que nos hacen reflexionar. Que la ilusión no se apague aunque pasen los años y la costumbre.","No sé qué traerá el futuro, y no quiero hacer predicciones. Pero sí sé qué clase de persona quiero ser en él: alguien que cuida, que escucha y que no se rinde fácilmente cuando algo importa.","Gracias por querer crecer conmigo, mi niña. Seguimos.","Me gustaría, además, que celebráramos los progresos pequeños. No esperar a los grandes logros para alegrarnos. Si uno de los dos aprende algo nuevo, mejora un hábito o consigue algo que le costaba, que el otro lo note y lo diga. Crecer se hace más ligero cuando alguien te mira con orgullo."]},{"id":"mustafar-construido","title":"Lo que hemos construido","category":"historia","language":"es","planet":"mustafar","transmission":"Transmisión desde Mustafar · forja","unlock":{"type":"all","of":[{"type":"flag","flag":"mustafar.sequence"},{"type":"flag","flag":"mustafar.vents"}]},"body":["A veces me detengo y miro hacia atrás para ver lo que hemos hecho juntos desde el 21 de junio, y me sorprende.","Hemos construido una rutina de mensajes y llamadas que nos sostiene. Hemos construido varios viajes, con sus despedidas y sus reencuentros. Hemos construido un lenguaje propio, con bromas que solo entendemos nosotros. Hemos construido confianza, que es lo que más tarda y lo que más vale.","Hemos construido también una manera de hablar de las cosas importantes. Sin gritar, sin acusar, intentando entender al otro. No siempre nos sale perfecta, pero lo intentamos, y eso ya es mucho.","Y hemos construido algo que no se ve: una compañía. La sensación de que hay alguien al otro lado que piensa en ti, que se alegra de tus alegrías y que te acompaña en tus cosas. Eso no se puede medir ni fotografiar, pero se siente cada día.","Todo esto lo hemos hecho poco a poco, sin correr. Y por eso creo que tiene buenas bases. No ha sido un fuego artificial; ha sido un fuego de hogar, de esos que se mantienen encendidos y dan calor.","Me gusta saber que todavía no hemos terminado. Que hay mucho por construir. Pero también me gusta detenerme de vez en cuando, como hoy, para agradecer lo que ya existe.","Gracias por ser la mitad de esta obra, Arián. No la habría hecho sin ti.","Lo curioso es que casi nada de esto lo planeamos. No nos sentamos un día a decidir cómo sería nuestra historia. Simplemente, fuimos haciendo lo que nos parecía correcto, y el resultado es lo que hay hoy. Me gusta esa naturalidad, esa falta de guion, porque hace que todo sea auténtico."]},{"id":"mustafar-encuentros","title":"Aprovechar cada encuentro","category":"distancia","language":"es","planet":"mustafar","transmission":"Transmisión desde Mustafar · cuenta atrás","unlock":{"type":"all","of":[{"type":"flag","flag":"mustafar.sequence"},{"type":"flag","flag":"mustafar.vents"},{"type":"flag","flag":"mustafar.temple"}]},"body":["Cuando uno vive lejos de la persona que quiere, aprende a valorar los encuentros de una manera especial. Cada uno cuenta, y yo no quiero malgastar ninguno.","No me refiero a llenarlos de planes ni a ir con prisa. Me refiero a estar presente de verdad. A dejar el móvil, a mirarte cuando hablas, a escuchar sin pensar en lo que voy a responder. A no dejar para luego lo que puedo decirte hoy.","Quiero decirte las cosas bonitas cuando las pienso. Un gracias, un me gusta cómo te ríes, un qué bien se está contigo. A veces las guardamos esperando el momento perfecto, y el momento perfecto es casi siempre ahora.","Quiero, también, que los ratos tranquilos tengan su espacio. No hace falta hacer algo especial cada minuto. A veces lo mejor de un encuentro es un paseo sin rumbo, una conversación sin prisa o un rato de silencio compartido.","Y quiero cuidar el final de cada encuentro. Que la despedida no empañe lo vivido, que sepamos quedarnos con lo bueno y con las ganas de repetir. Porque la mejor manera de despedirse es con ganas de volver.","Sé que habrá encuentros mejores y otros más sencillos. Pero todos me parecen un regalo, y espero tratarlos como tal.","Gracias por cada rato que hemos compartido y por los que vendrán, mi vida. Te quiero muchísimo.","Y cuando termine cada encuentro, quiero llevarme algo concreto: una frase, una imagen, una risa. Algo que pueda sacar del bolsillo en los días de espera y volver a sentir un momento de aquel rato. Prefiero pocas cosas bien guardadas que muchas olvidadas."]},{"id":"alderaan-dia21","title":"El día 21","category":"momentos","language":"es","planet":"alderaan","transmission":"Transmisión desde Alderaan · calendario","unlock":{"type":"any","of":[{"type":"day-of-month","day":21},{"type":"flag","flag":"alderaan.calendar"}]},"body":["El 21 de junio de 2026 es una fecha que ya no puedo mirar como otra cualquiera. Y por eso, cada día 21, me pasa algo curioso: me detengo un segundo.","No es una celebración con velas ni con grandes planes. Es más bien un pequeño guiño interno. Pienso: hoy es 21, y un día 21 empezó todo esto. Me acuerdo de cómo me sentía entonces, con las dudas y la ilusión mezcladas, sin saber muy bien hacia dónde iba a ir, y me doy cuenta de todo lo que ha pasado desde entonces.","Los calendarios están llenos de fechas que no significan nada, y de pronto una de ellas se convierte en una especie de punto de partida personal. Eso me parece bonito. Que algo tan corriente como un número pueda cargarse de recuerdos solo porque alguien le dio sentido.","Me gusta que cada mes tenga su día 21. Es como si el tiempo nos regalara una pequeña ocasión de mirar atrás sin tener que esperar al aniversario. Un día para pararse, agradecer y seguir.","No hace falta que hagamos nada especial en esos días. Basta con que los dos sepamos qué día es. Un mensaje, una frase, una simple mirada hacia atrás.","Gracias por haber dado sentido a ese número, Arián. Feliz día 21, hoy y siempre que toque.","Y hay algo más: esos días 21 me recuerdan que lo importante no es hacer cosas enormes, sino no dejar que pasen los meses sin pararnos a mirar lo que tenemos. Un instante de atención basta. Si cada mes nos detenemos así, no se nos escapa nada de lo bueno."]},{"id":"alderaan-familia","title":"Con tu familia","category":"historia","language":"bilingue","planet":"alderaan","transmission":"Transmisión desde Alderaan · una casa en las montañas","unlock":{"type":"flag","flag":"alderaan.places"},"body":["Cuando quiero a alguien, también quiero a quienes forman parte de su vida. Por eso me gustaría hablarte de tu familia.","No quiero inventarme nada sobre ella ni dar por hecho cosas que no sé. Lo que sí sé es que son importantes para ti, y que eso es suficiente para que yo los tenga en consideración. Cada vez que me hablas de ellos, noto el cariño con el que lo haces.","M'agradaria conéixer-los algun dia amb calma i respecte. No amb presses ni amb pressió, sinó quan siga el moment adequat i tots estiguem còmodes. Vull que em vegen tal com sóc, i que vegen que et cuide i que et respecte.","Sé que presentarse no es lo más fácil del mundo. Hay nervios, silencios raros y ganas de caer bien. Pero también creo que lo importante es ser sincero y educado, y dejar que las cosas fluyan por sí solas.","Quiero que tu familia sepa, cuando llegue el día, que contigo hablo siempre con la verdad. Que lo que busco es algo serio, sin prisas y con principios, y que pongo a Jehová por delante de todo lo demás.","Mentrestant, vull que sàpigues que, per a mi, la teua família és part del teu món, i el teu món m'importa moltíssim.","Gracias por dejarme asomarme a ese rincón de tu vida, mi niña.","Y, mientras tanto, quiero que sepas que respeto totalmente cómo y cuándo decidas que sea el momento. Es tu familia, y tú sabes mejor que nadie cómo hacerlo bien. Yo estaré dispuesto cuando lo estés tú, sin adelantarme y sin dejar de estar a tu lado."]},{"id":"alderaan-lugares","title":"Lugares por conocer","category":"suenos","language":"es","planet":"alderaan","transmission":"Transmisión desde Alderaan · cápsula del tiempo","unlock":{"type":"flag","flag":"alderaan.capsule"},"body":["Hay una lista que no he escrito en ningún papel pero que llevo en la cabeza: los lugares que me gustaría conocer contigo.","No hace falta que sean sitios lejanos ni famosos. Algunos son rincones de Valencia que todavía no hemos pisado, calles por las que pasear sin rumbo, un sitio donde sentarnos a hablar sin mirar la hora. Otros estarían en Tenerife, y me encantaría enseñarte los lugares que me gustan y que forman parte de mi día a día.","Y otros son sitios con una historia detrás. Me acuerdo de que te gusta la historia de Roma, la mitología y los lugares con un pasado, y me imagino paseando contigo por alguno de ellos, escuchándote contar lo que sabes. Creo que sería de los mejores viajes.","Me gusta soñar con esas cosas porque son pequeñas y posibles. No son castillos en el aire. Son planes que tal vez se hagan realidad poco a poco, con paciencia y con calma.","También soñar es una manera de cuidar lo que tenemos. Cuando imagino un viaje contigo, estoy diciendo que quiero que haya muchos más momentos. Que lo que vivimos hoy no es el final de nada, sino el principio de un camino con paradas bonitas.","He dejado esta carta en una cápsula, para que alguien la encuentre más adelante. Y ese alguien eres tú.","Gracias por ser mi compañera de sueños, Arián. Te quiero muchísimo.","Me quedo también con la idea de los sitios sencillos: una cafetería con ventana, un banco al sol, una plaza donde no pase nada. Ahí es donde suelen ocurrir las conversaciones que recuerdas más tarde. No necesito un sitio espectacular, solo un lugar donde estemos tú y yo con tiempo."]},{"id":"alderaan-gossets","title":"Els teus gossets","category":"recuerdos","language":"va","planet":"alderaan","transmission":"Transmissió des d’Alderaan · patis i jardins","unlock":{"type":"flag","flag":"alderaan.places"},"body":["Esta carta és, en part, per als teus dos gossets. No et rigues, que és molt seriosa.","Cada vegada que m'ensenyes una foto d'ells o em contes alguna cosa que han fet, em fa un efecte molt bonic. Perquè vol dir que em deixes entrar en la teua vida de cada dia, en eixos detalls tan teus. I perquè es nota com els estimes: se't posa una veu diferent quan parles d'ells.","Jo no els conec en persona, i no vull inventar-me com són. Però ja els tinc un cert carinyo només per com tu els tractes. Gent que cuida així els seus animals normalment cuida així tot el que és important.","Em fa il·lusió pensar que algun dia els conega. Que vinguen a olorar-me, a veure si els caic bé, a fer-me sentir un poc nerviós i alhora molt content. Ja t'aviso que faré tot el possible perquè m'aproven.","Els animals tenen una manera de dir les coses sense parlar. Sempre s'alegren, sempre acompanyen. Em sembla que tenir-los és una manera de ser feliç amb coses xicotetes, i això és una cosa que admire en tu.","Així que, per favor, dóna'ls una carícia de part meua. I no, no és una broma: ho dic de veres.","Gràcies per compartir els teus gossets amb mi, xiqueta. T'estime molt.","Y tinc una confessió: de vegades, quan em manques, em consola veure les fotos que m'has enviat d'ells. Els veig amb eixa cara de felicitat senzilla que només tenen els gossos, i pense que el món no és tan complicat. Només cal estar ací, i ser amable amb qui t'estima."]},{"id":"alderaan-secreta-2","title":"Si pudiera guardar un instante","category":"secreta","language":"es","planet":"alderaan","transmission":"Transmisión cifrada desde Alderaan · secreto II","unlock":{"type":"all","of":[{"type":"flag","flag":"alderaan.places"},{"type":"flag","flag":"alderaan.capsule"},{"type":"flag","flag":"alderaan.calendar"}]},"body":["Esta es la segunda carta secreta. Y es una pregunta que me hago a veces: si pudiera guardar un solo instante de todo lo que hemos vivido, ¿cuál elegiría?","Es una pregunta imposible, porque son muchos. Y no puedo guardarlos de verdad, claro. El tiempo pasa y lo único que queda es lo que recordamos y lo que escribimos. Pero me gusta jugar a esa idea, porque me obliga a pensar en lo que más me ha importado.","Elegiría, seguramente, uno que no tiene nada de especial a primera vista. Un momento cualquiera, de esos en los que estábamos tranquilos, hablando de algo sin trascendencia, y yo pensé: qué bien estoy. Y no era por nada que estuviera pasando. Era por ti. Por cómo me hacías sentir sin proponértelo.","Ese tipo de instantes son los que de verdad construyen una relación, y los que mejor recuerdo. Los grandes momentos se explican fácil. Los pequeños se quedan en el cuerpo, en una sensación difícil de describir y fácil de reconocer.","Quiero contarte algo que pocas veces digo: a veces, cuando hay silencio y estoy solo, vuelvo a ellos. Repaso una risa, una frase, un gesto. Y me quedo con una sonrisa que dura un buen rato. Eso es lo que me regala nuestra historia.","Por eso escribo estas cartas. Porque, aunque no pueda guardar el tiempo, sí puedo guardar palabras. Y cuando relea algún día lo que he dicho, quiero acordarme de que fui sincero, de que te quise con cuidado y de que lo hice lo mejor que supe.","Imagino a veces cómo sería ese instante si pudiera guardarlo de verdad. Lo pondría en una cajita pequeña, de esas que se abren con cuidado, y dentro habría solo tres cosas: tu risa, un trozo de silencio tranquilo y la sensación de no tener prisa. Con eso me bastaría para tener un buen día cuando el cielo esté gris.","Pero lo que he descubierto escribiendo es que quizá no hace falta guardarlo. Quizá lo que importa es que sigan pasando. Que haya muchos instantes así, uno detrás de otro, sin necesidad de ponerles nombre. Si algo he aprendido en estos meses es que lo bueno no es tanto lo que se conserva como lo que se vuelve a vivir.","Y por eso, cada vez que hablamos, cada vez que nos vemos, intento estar donde estoy. No pensar en lo que voy a decir después ni en lo que vendrá mañana. Estar. Con los ojos abiertos y con el corazón tranquilo, porque sé que estos ratos no se repiten igual, y quiero tratarlos con el cuidado que merecen.","Si algún día, mucho más adelante, miramos atrás y alguno de esos ratos se ha desdibujado, aquí quedará esta carta para recordarme que existió. Que hubo un tiempo en que te escribía con calma, mirando una pantalla, deseando acertar con cada palabra. Y que lo hice con una alegría silenciosa que no sé explicar mejor.","No sé qué nos espera, y no quiero adelantarme. Solo sé que ahora mismo, en este momento, me siento afortunado de tenerte. Y que si hay un instante que merece guardarse, es este mismo, en el que te escribo pensando en ti.","Con mucho cariño, Yeidan."]},{"id":"hoth-cielo","title":"Mirar el mateix cel","category":"distancia","language":"va","planet":"hoth","transmission":"Transmissió des de Hoth · base de l’observatori","unlock":{"type":"flag","flag":"hoth.stars"},"body":["Hi ha una cosa que em consola molt en els dies que se'm fa llarga la distància: saber que tu i jo mirem el mateix cel.","Siga a València o a Tenerife, quan ve la nit apareix la mateixa lluna. Les mateixes estrelles estan ahí dalt, més o menys en el mateix lloc, i ens fan companyia a tots dos sense que ho sàpiguem. És un pensament senzill, però a mi em calma.","De vegades, quan isc a la terrassa o em quede un minut mirant per la finestra, pense: ara mateix, ella podria estar mirant esta lluna. I eixa idea, que potser no és certa en eixe instant exacte, ja em fa sentir més a prop.","Les estrelles tenen una cosa curiosa: la seua llum ens arriba des de molt lluny, i això ens recorda que les coses poden viatjar una gran distància i continuar sent boniques. Perquè de vegades la distància no apaga res; només el fa arribar d'una altra manera.","Si algun vespre no pots dormir, o simplement tens ganes de pensar en mi, mira el cel. No et pregunte res més. Jo estaré fent el mateix, o pensant en fer-ho.","Al cap i a la fi, fins i tot quan estem separats, vivim sota el mateix cel. I això em fa pensar que no estem tan lluny com a vegades sembla.","Bona nit, xiqueta. Que descanses i que tingues bons somnis. T'estime moltíssim.","I si hi ha núvols, no passa res. Les estrelles continuen ahí dalt, encara que no les vegem. Em sembla una bona imatge per a nosaltres: hi ha coses que no es veuen a cada moment, però no per això deixen d'existir. Només cal esperar que el cel s'òbriga un poc."]},{"id":"hoth-constelacion","title":"Las estrellas del futuro","category":"suenos","language":"bilingue","planet":"hoth","transmission":"Transmisión desde Hoth · constelación nueva","unlock":{"type":"flag","flag":"hoth.constellation"},"body":["En este planeta he dibujado una constelación, y quiero explicarte qué significa.","Las constelaciones son una invención muy bonita: alguien miró un montón de puntos sueltos y decidió unirlos con líneas para ver una forma. Los puntos ya estaban ahí. Lo que hizo falta fue una mirada que les diera sentido.","Això és el que sent que hem fet nosaltres. Teníem moments solts: una conversa, un viatge, una broma, una cançó. I amb el temps hem anat unint-los i ha eixit una forma que té sentit. La nostra història.","Me gusta pensar que todavía quedan estrellas por unir. Momentos que no han llegado, viajes que no hemos hecho, conversaciones que no hemos tenido. Cada uno de ellos será un punto más en el cielo, y no sé qué dibujo formarán. Pero estoy deseando descubrirlo.","No quiero ponerles nombre antes de tiempo ni decirte cómo serán. Prefiero ir viendo, con calma, cómo se van encendiendo. Y mirarlas juntos, aunque sea cada uno desde su lado.","Mentrestant, aquesta constel·lació és per a tu. No té nom oficial, però sé com la anomenaria: «les coses bones que encara han de vindre».","Gracias por ser quien me ayuda a ver formas donde antes solo veía puntos, Arián. Te quiero muchísimo.","Y si algún día miras el cielo y no sabes qué constelación estás viendo, no pasa nada. Puedes inventarte la tuya. Las más bonitas empezaron así, con alguien que quiso ver una forma y la dibujó con su imaginación. Hazlo sin miedo, y si quieres, cuéntame qué dibujo ves."]},{"id":"hoth-secreta-3","title":"Lo que veo en ti","category":"secreta","language":"es","planet":"hoth","transmission":"Transmisión cifrada desde Hoth · secreto III","unlock":{"type":"all","of":[{"type":"flag","flag":"hoth.stars"},{"type":"flag","flag":"hoth.constellation"},{"type":"flag","flag":"hoth.planets"}]},"body":["Esta es la tercera carta secreta, y es sobre lo que veo en ti. Lo escribo con calma porque quiero que sea exacto.","Veo a una persona que tiene un lugar muy claro en su vida para lo que es importante. Que sabe cuáles son sus principios y los vive. Que no necesita aparentar, porque lo que es se nota. Y eso, en un mundo donde casi todo es ruido, se agradece infinitamente.","Veo a alguien con una curiosidad enorme. Con ganas de saber, de leer, de entender cómo funcionan las cosas y de dónde vienen. Cuando hablas de historia o de mitología, se te ilumina algo por dentro, y yo me quedo mirándote sin poder evitar sonreír.","Veo a alguien con un corazón grande y tranquilo. No es de los que hacen mucho ruido con sus sentimientos, pero cuando quiere, quiere de verdad. Con constancia, con cuidado, con ternura. Y yo me siento afortunado de estar en la parte de tu mundo que recibe todo eso.","Veo a alguien con sentido del humor, de ese que aparece de repente y te hace reír cuando menos lo esperas. Con una manera propia de decir las cosas. Con una mirada que se queda en los detalles.","Y veo a alguien a quien todavía le queda mucho por descubrir de sí misma. Cosas que será y que ya empiezan a notarse. Me hace ilusión poder verlo de cerca, aunque sea a distancia.","Quizá a veces no te veas así. Quizá dudes, como dudamos todos. Pero quiero que sepas que, desde donde yo estoy, lo que veo es todo esto. Y que lo digo en serio, sin exagerar nada.","Por eso, si alguna vez necesitas recordar cómo eres, vuelve a esta carta. Es un espejo escrito, hecho con mucho cuidado y con mucho cariño.","Veo, además, a alguien que cuida los detalles de la fe con una delicadeza admirable. Nunca la usas para presumir ni para juzgar. La vives con naturalidad, y eso se contagia sin que lo pretendas. Estar cerca de ti me hace querer ser más coherente conmigo mismo, y no creo que haya mejor manera de influir en alguien que esa.","Veo también a alguien paciente conmigo, y eso lo noto especialmente en mis torpezas. Cuando me quedo callado, cuando me expreso mal, cuando tardo en entender algo, no me haces sentir pequeño. Me das tiempo. Y te aseguro que dar tiempo es una de las formas más delicadas de querer que existen.","Veo a alguien que sabe disfrutar de lo sencillo: un paseo, una buena conversación, una película que le gusta, una historia que la atrapa. No necesitas demasiado para estar bien, y eso, que a veces se ve como algo pequeño, para mí es una señal de equilibrio y de madurez que me inspira mucha confianza.","Y veo, sobre todo, a alguien en quien se puede confiar. Cuando dices algo, lo dices en serio. Cuando te comprometes, lo cumples. Esa coherencia, esa honestidad, es el cimiento sobre el que me gustaría que construyéramos todo lo demás, sin prisas y con los pies en la tierra.","Gracias por ser tú, Arián. Con todo mi cariño, Yeidan."]},{"id":"bespin-postales","title":"Tus dos postales","category":"recuerdos","language":"es","planet":"bespin","transmission":"Transmisión desde Bespin · ciudad en las nubes","unlock":{"type":"flag","flag":"bespin.postcard"},"body":["Quiero hablarte de dos postales. Las dos tuyas, las dos guardadas con mucho cuidado.","Recibir algo escrito a mano de alguien que quieres tiene una magia particular, y aquí uso la palabra solo en sentido figurado: es la sensación de ver su letra, de saber que dedicó un rato a pensar qué decirte, de tener algo físico que puedes tocar y volver a leer. Un mensaje se pierde entre otros mensajes. Una postal se queda.","Cuando leí las tuyas, noté que habías puesto cuidado en las palabras. Que no era algo escrito deprisa. Y eso me emocionó mucho, porque significa que me tuviste presente en un momento tranquilo, sin necesidad de que nadie te lo pidiera.","Las guardo en un sitio donde sé que no se estropearán. Y de vez en cuando las releo, sobre todo cuando tengo un día gris. Es una pequeña medicina que no necesita receta, y que funciona porque viene de ti.","Me gusta pensar que algún día nuestras postales, cartas y mensajes formarán una especie de archivo. Una historia hecha de palabras, que podamos mirar con cariño dentro de mucho tiempo.","Por eso en este planeta he dejado una postal para que puedas guardar, como las que tú me enviaste. Que sea un recuerdo más de nuestra historia.","Gracias por tus dos postales, mi niña. Son de mis tesoros favoritos.","Pienso a veces en lo que cuesta escribir a mano: hay que decidir qué decir sin poder borrar, hay que cuidar la letra, hay que elegir bien cada frase. Quizá por eso las postales pesan más. Son palabras con tiempo dentro, y eso no se consigue con ningún teclado."]},{"id":"bespin-carino","title":"La teua manera d’estimar","category":"admiracion","language":"va","planet":"bespin","transmission":"Transmissió des de Bespin · globus a l’aire","unlock":{"type":"flag","flag":"bespin.balloons"},"body":["Cada persona demostra l'afecte a la seua manera, i la teua és una de les coses que més m'agraden de tu.","No és una manera cridanera, ni de grans paraules. És molt més subtil. Es veu en com t'interesses per com estic, en com recordes les coses que et conte, en el cas que em fas quan et parle d'alguna cosa que em preocupa. Es veu en eixes xicotetes atencions que potser tu no consideres importants, però que a mi em diuen molt.","Jo, que sóc més de donar voltes a les coses, valore moltíssim la teua serenitat. Tens una manera de transmetre que tot va bé, de fer-me sentir que no cal patir tant. I això m'ajuda a respirar.","També m'agrada que no et fas la interessant. Que quan estàs a gust, es nota, i quan no, ho dius amb respecte. Eixa sinceritat és molt de agrair, perquè m'evita haver d'endevinar.","Cada vegada que em dius alguna cosa afectuosa, la guarde. I quan em contestes amb una broma o amb un emoji perfecte, em fa riure sol davant del mòbil. Pareix una bobada, però no ho és.","Estic aprenent a llegir el teu llenguatge, poc a poc. Ja sé que quan escrius d'una certa manera és que estàs contenta, i que quan fas una pausa és que estàs pensant. Vull seguir aprenent-lo tota la vida que em deixes.","Gràcies per estimar-me com ho fas, xiqueta. És un regal que no mereixia, però que agraïsc moltíssim.","Em fa pensar que l'afecte autèntic no té fórmula. No hi ha una manera correcta d'estimar, sinó la que naix de cadascú. La teua és tranquil·la i constant, i amb el temps m'he adonat que és justament el que necessite: una cosa que no s'apaga, que no obliga i que acompanya."]},{"id":"bespin-webs","title":"Mis webs para ti","category":"historia","language":"bilingue","planet":"bespin","transmission":"Transmisión desde Bespin · torre de control","unlock":{"type":"flag","flag":"bespin.landmarks"},"body":["Esta carta es para contarte algo que quizá ya sospechas: hago webs para ti.","Para mí, programar es una forma de hablar. Hay personas que escriben poemas, otras que cantan, otras que dibujan. Yo construyo páginas. Y cuando quiero decirte algo importante, mi manera natural de hacerlo es crearte un espacio en el que puedas entrar, explorar y encontrar cosas que he pensado para ti.","Esta galaxia no es la primera cosa que hago pensando en ti, y creo que tampoco será la última. Cada vez que empiezo una, me pasa lo mismo: me imagino tu cara al abrirla. Pienso en qué te gustará, en qué te hará sonreír, en qué detalle te sorprenderá.","Hi ha molta feina darrere, i no ho dic per presumir. Ho dic perquè volia que sabérem que cada línia de codi va escrita amb un pensament teu. Que quan alguna cosa no funciona i em desespere, tinc present que és per a tu, i això em dóna ganes de seguir fins que ixca bé.","Quiero que estas páginas no sean un juguete tecnológico, sino una forma de cuidar lo que tenemos. Que cada planeta, cada carta, cada pequeño rincón te diga: me importas, y lo he hecho con calma.","Sé que hay cosas más importantes que una web. Pero también sé que ponerle esfuerzo a algo para alguien es una de las formas más sinceras de quererle.","Gracias por abrir lo que hago con tanta ilusión, Arián. Hace que quiera seguir creando.","Y no pienso en ellas como obras terminadas. Las veo como cartas que siguen creciendo: añado un detalle, corrijo un fallo, mejoro un rincón. Igual que nuestra historia, que tampoco está acabada y a la que sigo dedicando atención cada día, un pedacito más."]},{"id":"kashyyyk-tulipanes","title":"Tulipanes","category":"admiracion","language":"es","planet":"kashyyyk","transmission":"Transmisión desde Kashyyyk · el jardín del bosque","unlock":{"type":"flag","flag":"kashyyyk.tulip"},"body":["Hay flores que parecen hechas para decir las cosas con calma, y para mí el tulipán es una de ellas.","Es una flor sencilla y elegante. No necesita mucho para destacar: un tallo recto, unos pétalos que se cierran como si guardaran algo, y un color que se queda en la memoria. No hace ruido. Se limita a estar, y al estar, ilumina el sitio.","Cada vez que pienso en tulipanes, pienso en ti. Y no porque sean tu flor oficial ni porque lo hayamos hablado mil veces, sino porque comparten algo contigo: esa belleza tranquila, que no necesita llamar la atención y que se aprecia mejor cuanto más tiempo la miras.","Me gusta que, en el jardín de este planeta, haya un tulipán que puedas cuidar. Porque cuidar una flor es un acto pequeño y paciente, y esas son las cosas que mejor nos salen a los dos. Un poco de agua, un poco de luz, un poco de tiempo. Y un día la ves abierta, y sientes que ha valido la pena esperar.","Con las personas pasa lo mismo. Las que merecen la pena no florecen de golpe. Se abren a su ritmo, cuando se sienten seguras. Y yo estoy dispuesto a esperar todo lo que haga falta para ver abrirse cada parte de ti, sin forzar ninguna.","Ojalá algún día pueda regalarte tulipanes de verdad y ver tu cara al recibirlos. Mientras tanto, te dejo estos, que no se marchitan.","Gracias por ser como eres, mi vida. Te quiero muchísimo."]},{"id":"kashyyyk-bichito","title":"El bichito virtual","category":"recuerdos","language":"bilingue","planet":"kashyyyk","transmission":"Transmisión desde Kashyyyk · criaturas del bosque","unlock":{"type":"flag","flag":"kashyyyk.creatures"},"body":["Esta carta es para un recuerdo que me hace sonreír cada vez que lo pienso: el bichito virtual.","Sé que dicho así suena a broma. Y en parte lo es, pero también es una de esas cosas pequeñas que se te quedan grabadas. Una criatura digital que hay que cuidar, alimentar, atender, y que tiene su carácter y sus necesidades. Algo tan sencillo y que, sin embargo, nos dio un motivo más para compartir un momento.","M'agrada que les coses xicotetes puguen tindre tant de valor. Un bitxet que no existeix de veres, però que ens va fer riure, ens va preocupar un poc i ens va donar conversa. Perquè al final no importa tant el que és l'objecte, sinó el que significa: algú que pensa en tu i et regala un detall amb la intenció de passar-ho bé junts.","Cuidar de algo juntos, aunque sea de mentira, enseña cosas. Enseña a ser constante, a acordarse, a tener paciencia, a no abandonar lo que has empezado. Y no es poca cosa para un juego.","També m'agrada que no hi hagi càstigs. Si t'oblides un dia, el bitxet no s'enfada; t'espera. Així és com m'agradaria que fora tot: amb cura i sense culpes.","Por eso en este planeta he dejado criaturas que puedes cuidar a tu ritmo. Nada de agobios ni de perder cosas si te olvidas. Solo la tranquilidad de saber que, cuando vuelvas, todo seguirá aquí, esperándote.","Gràcies per compartir amb mi les coses xicotetes, Arián. Són les que més recorde."]},{"id":"kashyyyk-mitologia","title":"Dioses, héroes y libros","category":"admiracion","language":"es","planet":"kashyyyk","transmission":"Transmisión desde Kashyyyk · biblioteca verde","unlock":{"type":"flag","flag":"kashyyyk.plants"},"body":["Esta carta es para tu parte más curiosa: la que se pierde entre mitos, historias y libros.","Me encanta cómo hablas de Atenea y de la mitología griega. Se nota que no es solo un gusto pasajero, sino algo que has estudiado y disfrutado con ganas. Conoces las historias, los nombres, los símbolos, y cuando las cuentas, las haces tan vivas que me dan ganas de leerlas yo también.","Me hablas de Percy Jackson con un entusiasmo que contagia, y de esas historias donde los héroes son adolescentes con dudas y con valor. Me hablas de Epic, de su música y de cómo se cuenta una historia a través de ella. Y me hablas de Roma, de su historia, de sus personajes, de cómo vivía la gente.","Y luego está Orgullo y prejuicio, que parece muy distinto pero en el fondo tiene algo en común con todo lo anterior: personajes con carácter, diálogos con ingenio, y una manera de mirar a las personas con ojo crítico y también con ternura.","Lo que más admiro de tus gustos no son los títulos concretos. Es la forma en que los vives. Con curiosidad, con respeto, con ganas de comprender. Para ti una historia no es solo entretenimiento: es una ventana a otra época, a otra forma de pensar.","Te lo digo como alguien que no siempre ha sido de leer mucho. Contigo me están entrando ganas de redescubrirlo. Y no quiero hacerlo por impresionarte, sino porque me gusta ver cómo disfrutas y quiero entenderte mejor.","Y si alguna vez quieres explicarme una historia entera, de principio a fin, con todos los detalles, tienes mi atención asegurada. Prometo no interrumpir más de dos veces.","Gracias por enseñarme a mirar el mundo con curiosidad, mi niña. Te quiero muchísimo."]},{"id":"jedha-meses","title":"Desde el 21 de junio","category":"historia","language":"bilingue","planet":"jedha","transmission":"Transmisión desde Jedha · piedras con historia","unlock":{"type":"flag","flag":"jedha.cipher"},"body":["Desde el 21 de junio han pasado ya unos cuantos meses, y quiero escribir sobre ese tiempo como quien repasa un camino que ha recorrido con alguien.","Al principio todo era nuevo, y eso trae su propia emoción. No sabía qué esperar, ni cómo hablarte, ni qué sentirías tú. Cada mensaje tenía algo de examen y mucho de ilusión. Poco a poco fuimos encontrando el tono, las bromas y el ritmo, y lo que era incertidumbre se convirtió en confianza.","Després van vindre els viatges. Els nervis abans de vore'ns, la sensació estranya de tindre davant la persona amb qui parlava cada dia, les passejades, les rialles. I les despedides, que són dures però que ens han ensenyat a valorar cada moment.","Y entre viaje y viaje, la vida de cada día. Los mensajes por la mañana, las llamadas, las fotos, las cartas, las pequeñas sorpresas. Una rutina bonita, que he llegado a querer muchísimo.","He aprendido muchas cosas en este tiempo. He aprendido que me gusta cuidarte. Que la distancia se lleva mejor con sinceridad. Que no hace falta correr. Y que hay una felicidad tranquila en saber que alguien piensa en ti.","Aquestos mesos han sigut, per a mi, un regal. No perquè tot haja estat perfecte, sinó perquè hi ha hagut sinceritat i ganes de fer les coses bé.","Y todavía estamos al principio de lo que vendrá. Con paciencia, con respeto y con ilusión. Gracias por cada día de este recorrido, Arián.","Si pudiera resumir estos meses en una palabra, sería «sinceramente». Pero como las palabras no alcanzan, prefiero decir que hemos hecho un buen trabajo juntos, con sus tropiezos y sus aciertos. Y que, mirando atrás, no cambiaría casi nada de lo que ha pasado."]},{"id":"jedha-crecido","title":"Lo que he aprendido de ti","category":"historia","language":"es","planet":"jedha","transmission":"Transmisión desde Jedha · el templo de los símbolos","unlock":{"type":"flag","flag":"jedha.symbols"},"body":["Si hiciera una lista de lo que he aprendido de ti desde que nos conocemos, saldría más larga de lo que imaginas.","He aprendido a esperar sin desesperarme. Antes, cuando algo me importaba, quería resolverlo ya. Contigo he entendido que algunas cosas necesitan su tiempo y que forzarlas las estropea.","He aprendido a escuchar mejor. A no responder enseguida, a preguntar por lo que de verdad importa, a quedarme con el matiz de lo que dices y no solo con las palabras.","He aprendido a valorar lo pequeño. Un mensaje, una foto, una broma. Cosas que antes pasaban sin darles importancia, y ahora me alegran el día.","He aprendido a hablar de lo que siento, aunque me cueste. Todavía no se me da bien, pero lo intento, y estas cartas son parte de ese esfuerzo.","Y he aprendido que mantener los principios no es una carga, sino algo que da seguridad. Cuando sé lo que quiero y lo que no, todo es más claro, y puedo quererte con tranquilidad.","No digo esto para quedar bien. Lo digo porque es verdad, y porque creo que lo bueno de querer a alguien es que te hace crecer sin pedírtelo.","Espero haberte enseñado yo también alguna cosa, aunque sea pequeña. Aunque solo sea que alguien puede quererte con paciencia y con cuidado.","Gracias por todo lo que me enseñas sin darte cuenta, mi vida.","Y quizá lo más importante de todo: he aprendido que no hace falta ser perfecto para querer bien. Basta con intentarlo todos los días, con humildad, y con ganas de corregir lo que falla. Eso me lo has enseñado con tu paciencia, sin decírmelo, simplemente siendo así."]},{"id":"jedha-fotos","title":"Fotografías","category":"recuerdos","language":"es","planet":"jedha","transmission":"Transmisión desde Jedha · piedras grabadas","unlock":{"type":"flag","flag":"jedha.symbols"},"body":["Tengo en el móvil una carpeta que no enseño a nadie y que miro más de lo que admitiría: las fotos de nuestros días.","No son fotos perfectas. Algunas salieron movidas, otras con mala luz, y en alguna de ellas alguien está a medio reírse. Pero son mías, y valen más que cualquier imagen de revista. Porque cada una tiene detrás un momento que sé exactamente cómo sentí.","Cuando las miro, vuelvo al sitio. Recuerdo qué hacíamos justo antes, de qué hablábamos, qué se nos ocurrió decir. Es como una máquina de volver a los buenos ratos, y sin necesidad de tecnología avanzada.","Me gusta pensar que dentro de mucho tiempo, cuando las veamos de nuevo, nos reiremos con ternura. Nos parecerá que éramos otros, más jóvenes, más nerviosos. Y sentiremos agradecimiento por haber guardado aquello.","Por eso intento sacar fotos de los momentos que quiero recordar, aunque a veces me da pena interrumpir lo que estamos viviendo. Prefiero tener pocas fotos y estar presente a tener muchas y no haber disfrutado.","Y también me gusta que tú tengas tus propias imágenes de estos días. Las mías no son más importantes que las tuyas. Cada uno recuerda lo suyo, y juntos formamos la historia completa.","Gracias por cada una de esas fotos y por todo lo que hay detrás, Arián.","Hay una foto, en particular, que miro más que las demás, aunque no voy a decir cuál. Es una de esas imágenes en las que no pasa nada espectacular, y justo por eso me gusta. Se nota que estábamos bien, sin esfuerzo, y eso es lo mejor que puede decir una fotografía."]},{"id":"jedha-abrazos","title":"Els abraços","category":"recuerdos","language":"va","planet":"jedha","transmission":"Transmissió des de Jedha · llegendes escrites","unlock":{"type":"flag","flag":"jedha.legends"},"body":["Hi ha coses que no es poden explicar bé amb paraules, i un abraç és una d'elles. Però ho vaig a intentar.","Un abraç teu és un moment on el món baixa el volum. Durant uns segons no hi ha pressa, ni distància, ni calendari. Només estem nosaltres i eixa sensació de seguretat que costa de descriure. Com si algú t'haguera dit: ací pots descansar.","Recorde especialment els abraços de les despedides. Eixos que duren un poc més del compte i en què cap dels dos vol ser el primer a soltar. Són abraços amb una mica de tristesa, però també amb molta promesa de tornar.","I recorde els de les trobades. Eixos són diferents: més alegres, més nerviosos, amb un puntet de «per fi». Se n'ixen sols, sense pensar-hi, i són els que més m'agraden.","Els abraços diuen coses que no sé dir. Diuen: m'alegre que estigues. Diuen: t'he trobat a faltar. Diuen: ací estic. I tot això, sense una sola paraula.","Quan estic lluny i tinc un dia difícil, de vegades tanque els ulls i recorde un d'ells. No és igual que tindre'l de veres, però ajuda moltíssim.","Així que et deixe un abraç escrit, xiqueta. Que sàpigues que el tens tantes vegades com el necessites.","T'estime moltíssim.","Crec que per això m'agrada tant que posem límits en el que fem: un abraç sincer és net, senzill i sense segones intencions. És una manera de dir l'afecte amb respecte, i em fa sentir que estem fent les coses de manera correcta, a poc a poc i amb la consciència tranquil·la."]},{"id":"desconocido-secreta-4","title":"La galaxia que hemos construido","category":"secreta","language":"es","planet":"desconocido","transmission":"Transmisión cifrada desde la Región Desconocida · secreto IV","unlock":{"type":"planets-visited","min":10},"body":["Esta es la cuarta carta secreta. Y es la que habla de esta galaxia, de por qué la hice y de lo que significa para mí.","Cuando empecé, no sabía muy bien cómo explicarlo. Quería regalarte algo, pero no quería que fuera algo que se acabara en un día. Quería que fuera un lugar al que pudieras volver, en el que hubiera pedazos de nuestra historia repartidos para que los fueras encontrando a tu ritmo. Un sitio sin prisas, sin presión, sin castigos. Un sitio que solo te pidiera una cosa: que lo disfrutes.","Por eso hay doce planetas. Cada uno tiene su carácter: uno es un jardín, otro una ciudad llena de luces, otro un desierto con dos soles. En cada uno hay algo escondido, y en cada uno he dejado cartas con cosas que quería decirte y que a veces no me salen a la cara. No es un videojuego. Es una forma de hablarte.","Quise que fuera bonito porque tú me importas. Que cada cosa estuviera pensada, incluso las que quizá no veas. Que si tenías un mal día, hubiera un sitio al que ir a respirar. Que si tenías un buen día, hubiera un sitio al que ir a sonreír. Que si pasaban semanas sin abrirlo, nada se perdiera ni se castigara, porque la vida real es lo primero.","Me hizo mucha ilusión imaginarte explorándolo con el móvil en la mano. Pensé en cada detalle: en cómo tocarías la pantalla, en qué te haría gracia, en qué te sorprendería. Y mientras lo construía, me daba cuenta de que, en el fondo, no estaba haciendo una web. Estaba escribiéndote una carta enorme, con muchas puertas.","También quise ser honesto en cada cosa que cuento. No he inventado conversaciones que no existieron ni he puesto promesas en tu boca. Todo lo que hay en estas cartas son cosas que quiero decirte yo, con mis palabras, desde mi sitio. Si algún detalle no encaja con tu recuerdo, dímelo, y lo corregiremos juntos sin ningún problema.","Y quise que hubiera espacio para lo importante sin mezclarlo con lo que no corresponde. Mi fe y la tuya son cosas serias, y no las he querido convertir en parte de un juego. Por eso aquí no hay magia, ni destinos, ni cosas que no son verdad. Solo hay cariño, recuerdos, ilusión y respeto.","Si me preguntaras qué espero de todo esto, te diría que muy poco y muchísimo a la vez. Poco, porque no te pido nada: ni que lo termines, ni que lo entiendas todo, ni que respondas de ninguna manera concreta. Y muchísimo, porque lo que deseo es que, al recorrerlo, sientas lo que yo siento al pensar en ti: que hay alguien que te cuida y que te quiere de verdad.","Y una última cosa sobre el porqué: quería que, al terminar, no te quedara una sensación de obligación, sino de cercanía. Que sintieras que alguien se había sentado a tu lado, un rato, a contarte cosas con calma. Si lo he conseguido, aunque sea un poquito, entonces todo el trabajo ha merecido la pena.","Gracias por abrir esta galaxia, Arián. Es lo más bonito que sé hacer, y lo hice para ti.","Con todo mi cariño, Yeidan."]},{"id":"desconocido-lejos","title":"Lo que sí se puede compartir a distancia","category":"distancia","language":"va","planet":"desconocido","transmission":"Transmissió des de la Regió Desconeguda · senyal feble","unlock":{"type":"planets-visited","min":10},"body":["Hi ha coses que la distància no ens pot llevar, i vull fer-ne una llista.","Podem compartir el temps encara que no estiguem al mateix lloc. Una trucada a la nit, un missatge de bon dia, una fotografia del que veiem pel camí. Podem fer que l'altre ens acompanye en el dia a dia, sense necessitat d'estar en la mateixa habitació.","Podem compartir cançons, llibres, històries. Quan descobrisc alguna cosa que crec que et pot agradar, te la passe. Quan tu em contes una cosa que t'ha encantat, jo me la apunte per mirar-la. Així anem teixint un món comú que no depén de la geografia.","Podem compartir els somnis i les preocupacions. Sempre amb calma, sense dramatismes. Parlar de com ens sentim, d'allò que ens fa il·lusió i d'allò que ens preocupa. Escoltar-nos de veritat és una manera de fer companyia.","Podem compartir la fe. Cadascú des del seu lloc, però amb la mateixa direcció. Pensar l'un en l'altre en les pregàries, i animar-nos a estar ferms en el que és important.","I podem compartir l'espera, que no és poca cosa. Perquè esperar junts, amb sinceritat i amb respecte, ja és una manera de caminar junts.","Hi ha coses que no podem compartir encara: una abraçada, una passejada, un sopar. Però estes coses arribaran quan toque, i mentrestant tot el que sí podem compartir ens manté a prop.","Així que no estem tan lluny com pareix. Gràcies per fer-ho possible, xiqueta. T'estime moltíssim.","Podem compartir també el silenci. Eixos moments de la trucada en què no diem res i no passa res. Estar en línia, cadascú amb les seues coses, sabent que l'altre és ahí. Eixa companyia sense paraules és de les més bones que he trobat."]},{"id":"desconocido-secreta-5","title":"Para cuando las hayas encontrado todas","category":"secreta","language":"es","planet":"desconocido","transmission":"Transmisión final · el último secreto","unlock":{"type":"counter","key":"letters.read","min":59},"body":["Si estás leyendo esto es porque has encontrado y leído todas las demás. Todas. Cincuenta y nueve cartas, y esta es la sexagésima. Quiero que sepas que no me parece poca cosa, y que te lo agradezco con todo mi corazón.","Escribí esta carta la última, y es la que más me costó. No porque no tuviera nada que decir, sino porque tenía demasiado, y quería que cada palabra estuviera en su sitio. Así que voy a ir por partes, con calma, como nos gusta a los dos.","Primero, gracias. Gracias por tu tiempo. Hay mucha gente con la agenda llena, y tú has dedicado ratos de tus días a recorrer unas páginas que yo hice con ilusión. Gracias por la paciencia de ir abriendo una a una, por leer cosas largas, por no saltarte nada. Sé que no es poco, y sé que lo has hecho con cariño.","Segundo, quiero repasar lo que hemos vivido, no para que lo recordemos como una lista, sino para que sientas lo que sentí yo al escribirlo. Un 21 de junio empezó algo. Desde entonces hemos tenido mensajes, llamadas, viajes, abrazos, despedidas, bromas que solo entendemos nosotros, silencios cómodos, y una cantidad enorme de pequeñas cosas que, juntas, se han convertido en algo muy valioso para mí.","Tercero, quiero decirte lo que más he aprendido contigo: que querer es cuidar. No en grandes gestos, sino en la constancia de acordarse, de respetar, de escuchar, de esperar y de estar. Tú lo haces tan bien, y tan en silencio, que a veces creo que ni te das cuenta. Pero yo sí me doy cuenta, y lo valoro cada día.","Cuarto, quiero hablarte de tu fe. Lo que más admiro de ti es tu amor por Jehová, y lo digo ahora que ya hemos recorrido todo esto porque quiero que sea lo último que recuerdes: que lo que yo más deseo es que sigamos mirando en la misma dirección. Que lo que construyamos, si se construye, tenga ese cimiento. Que ninguna ilusión mía ni tuya esté por encima de lo que nos importa de verdad.","Quinto, la distancia. No te voy a decir que desaparecerá por arte de magia, porque no es verdad y porque prefiero ser sincero. Lo que sí te digo es que no me asusta. Que cada kilómetro que nos separa me ha enseñado a valorar más lo que tengo. Que, con paciencia, con respeto y con constancia, se pueden hacer muchas cosas. Y que no hay ninguna prisa.","Sexto, tus cosas. Tus gustos, tus historias, tus pasiones, tus dos perritos, tu manera de reírte y de callar, tu manera de querer. Quiero que sigas siendo así, sin cambiar nada para encajar en nada. Me gusta cómo eres, tal cual. Y quiero que sepas que, mientras me lo permitas, seguiré conociéndote con el mismo interés con el que empecé.","Séptimo, lo que viene. No voy a hacer promesas que no dependen solo de mí, ni voy a ponerle fecha a lo que todavía no la tiene. Lo que sí voy a prometerte es que seguiré cuidando esto con todo el cariño y la sinceridad que sé. Que cuando haya dudas hablaré contigo. Que cuando haya alegría la compartiré. Que cuando haya días difíciles intentaré estar, a mi manera y a mi ritmo.","Octavo, y este es muy simple: quiero que sepas que no tienes que hacer nada para merecer lo que siento. No tienes que ser perfecta, ni estar siempre bien, ni responder siempre rápido. Puedes ser tú, con tus días buenos y tus días tranquilos. Para mí, eso ya es más que suficiente.","Y noveno, y último: esta galaxia no se acaba aquí. Puedes volver a cualquier planeta, releer cualquier carta, buscar de nuevo algo que se te pasó. Seguirá aquí, esperándote, sin prisas ni castigos. Y yo, igual. Porque un archivo de estrellas perdidas no es algo que se cierre; es algo que se guarda.","Cuando pienso en todo esto, lo que siento no es tristeza porque termine, sino una gratitud muy tranquila. Me parece un regalo haber podido escribirte y tener a alguien que lo lea con este cuidado. Y quiero que esa gratitud sea lo que te quede.","No sé qué nos espera. Sé que ahora mismo, mientras escribo, estoy contento. Que estoy pensando en ti con una sonrisa. Y que, si pudiera elegir cómo cerrar esta colección, sería con esto: gracias por existir, gracias por dejarme formar parte de tu vida, y gracias por haber llegado hasta aquí.","Te quiero, Arián. Con cuidado, con paciencia y con todo mi corazón.","Yeidan."]}],"effects":[{"id":"endor-a-coruscant","requires":["endor.holocron"],"effect":{"id":"tx-eco-del-bosque","kind":"transmission","planet":"coruscant","title":"Eco del bosque","body":"Una baliza de Endor ha llegado a Coruscant: el holocrón escondido entre los árboles guardaba un fragmento de la transmisión."}},{"id":"hoth-a-tatooine","requires":["hoth.constellation"],"effect":{"id":"tx-mapa-estelar","kind":"transmission","planet":"tatooine","title":"Mapa estelar recibido","body":"El observatorio de Hoth ha cerrado una constelación y ha enviado sus coordenadas: cruzan el cielo de los dos soles."}},{"id":"tatooine-a-coruscant","requires":["tatooine.trips3"],"effect":{"id":"tx-nave-en-transito","kind":"transmission","planet":"coruscant","title":"Nave en tránsito","body":"Los controladores de Coruscant han detectado una nave que cruza una y otra vez el desierto de Tatooine. Dicen que va y viene con mensajes."}},{"id":"kashyyyk-a-naboo","requires":["k
