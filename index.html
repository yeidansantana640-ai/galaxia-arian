<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Galaxia de Arián</title>
<meta name="theme-color" content="#03040a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
:root{
  --void:#03040a;--deep:#070a18;--panel:#0c1126;--panel2:#121937;
  --ink:#eef3ff;--ink2:#b7c3dd;--ink3:#7b88a6;--hair:rgba(255,255,255,.1);--hair2:rgba(255,255,255,.18);
  --gold:#ffd98a;--gold2:#f2b84b;--ok:#8dffc4;--danger:#ff8a9b;
  --accent-h:205;--accent:hsl(var(--accent-h) 100% 70%);--accent-soft:hsl(var(--accent-h) 100% 70% / .16);
  --accent-line:hsl(var(--accent-h) 100% 70% / .45);--accent-glow:hsl(var(--accent-h) 100% 65% / .55);
  --holo:#7fe3ff;
  --f-display:"Orbitron","Trebuchet MS",system-ui,sans-serif;--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--f-letter:"Cormorant Garamond",Georgia,serif;
  --ts:1;--tabh:64px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
html[data-accent=azul]{--accent-h:208}html[data-accent=verde]{--accent-h:140}html[data-accent=violeta]{--accent-h:272}
html[data-accent=blanco]{--accent-h:210}html[data-accent=blanco]{--accent:#eef4ff;--accent-glow:rgba(220,235,255,.55)}
html[data-accent=ambar]{--accent-h:36}html[data-accent=turquesa]{--accent-h:174}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:calc(16px * var(--ts));line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:clip}
body{min-height:100dvh}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
html[data-motion=reduced] *,html[data-motion=reduced] *::before,html[data-motion=reduced] *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--hair2);background:rgba(255,255,255,.06);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;touch-action:manipulation;transition:transform .14s,background .2s,box-shadow .3s}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn--primary{background:linear-gradient(180deg,hsl(var(--accent-h) 100% 76%),hsl(var(--accent-h) 90% 58%));color:#03101c;border-color:transparent;box-shadow:0 6px 24px var(--accent-glow)}
html[data-accent=blanco] .btn--primary{background:linear-gradient(180deg,#fff,#cfdcf2)}
.btn--gold{background:linear-gradient(180deg,#ffe7a8,#e9a83c);color:#241400;border-color:transparent;box-shadow:0 6px 24px rgba(255,190,80,.35)}
.btn--ghost{background:transparent}
.btn--sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn--icon{width:48px;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.07);color:var(--ink2);white-space:nowrap}
.chip--gold{background:rgba(255,217,138,.14);color:var(--gold)}
.chip--ok{background:rgba(110,240,170,.13);color:var(--ok)}
.chip--accent{background:var(--accent-soft);color:var(--accent)}
.eyebrow{font:600 11px var(--f-display);letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--ink3)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .8s var(--ease)}
.ring{--p:0;--sz:56px;width:var(--sz);height:var(--sz);border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.1) 0)}
.ring>span{width:calc(var(--sz) - 10px);height:calc(var(--sz) - 10px);border-radius:50%;background:#0a0f22;display:grid;place-items:center;font:700 13px var(--f-body)}
.holo{position:relative;background:linear-gradient(180deg,rgba(16,26,56,.94),rgba(7,10,25,.96));border:1px solid hsl(var(--accent-h) 100% 70% / .3);border-radius:20px;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.holo::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,hsl(var(--accent-h) 100% 80% / .04) 0 1px,transparent 1px 3px)}
.holo::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
.corners{position:absolute;inset:6px;pointer-events:none}
.corners i{position:absolute;width:12px;height:12px;border:2px solid var(--accent);opacity:.7}
.corners i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.corners i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.corners i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.corners i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}

/* ---------- app shell ---------- */
#app{position:relative;min-height:100dvh}
.view{position:relative;min-height:100dvh;padding:calc(16px + var(--st)) 16px calc(var(--tabh) + var(--sb) + 28px);display:flex;flex-direction:column;align-items:center}
.view>.page{width:100%;max-width:640px;display:grid;gap:18px;align-content:start;position:relative;z-index:2}
.view-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(1200px 700px at 80% -10%,hsl(var(--accent-h) 80% 30% / .22),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(140,70,200,.18),transparent 60%),var(--void)}
.view-bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 120px 80px,#cfe3ff,transparent),radial-gradient(1.4px 1.4px at 200px 160px,#ffe9c7,transparent),radial-gradient(1px 1px at 60px 190px,#fff,transparent);background-size:240px 240px;opacity:.5}
.ptop{display:flex;align-items:center;gap:10px;min-height:48px}
.ptop .grow{flex:1;min-width:0}
.ptitle{font:700 clamp(1.6rem,7vw,2.2rem)/1.1 var(--f-display);letter-spacing:.04em}
.plead{margin:6px 0 0;color:var(--ink2);max-width:52ch}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px 0 4px;margin-left:-4px;background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer}
.section-t{display:flex;align-items:center;gap:10px;margin:6px 2px -6px;font:600 11px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ink3)}
.section-t::after{content:"";flex:1;height:1px;background:var(--hair)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--hair)}
.seg button{min-height:40px;border:0;border-radius:11px;background:none;color:var(--ink2);font-weight:600;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent-line)}
.empty{padding:28px 18px;text-align:center;color:var(--ink3);border:1px dashed var(--hair2);border-radius:18px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tabh) + var(--sb));padding:0 max(6px,env(safe-area-inset-left)) var(--sb);background:rgba(5,7,16,.86);border-top:1px solid var(--hair);}
.tab{position:relative;display:grid;place-content:center;justify-items:center;gap:3px;background:none;border:0;color:var(--ink3);font-size:11px;font-weight:600;cursor:pointer;touch-action:manipulation}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent)}
.tab[aria-current=page]::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 4px 4px;background:var(--accent);box-shadow:0 0 14px var(--accent-glow)}
.tab .badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--gold);color:#140c00;font:700 10px/16px var(--f-body)}

/* ---------- MAP ---------- */
.map{position:fixed;inset:0;z-index:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#02030a;cursor:grab}
.map.dragging{cursor:grabbing}
.map canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.map-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.route{fill:none;stroke-linecap:round}
.route-base{stroke:rgba(140,190,255,.16);stroke-width:1.2}
.route-on{stroke:hsl(var(--accent-h) 100% 72% / .75);stroke-width:1.6;stroke-dasharray:2 7;animation:dash 1.4s linear infinite;filter:drop-shadow(0 0 3px var(--accent-glow))}
.route-link{stroke:rgba(255,217,138,.32);stroke-width:1;stroke-dasharray:1 6}
@keyframes dash{to{stroke-dashoffset:-18}}
.region{position:absolute;transform:translate(-50%,-50%);font:600 11px var(--f-display);letter-spacing:.5em;text-transform:uppercase;color:rgba(170,200,255,.28);white-space:nowrap;pointer-events:none;text-align:center}
.region small{display:block;font:500 9px var(--f-body);letter-spacing:.3em;color:rgba(170,200,255,.2);margin-top:4px}
.pnode{position:absolute;left:0;top:0;will-change:transform;border:0;padding:0;background:none;cursor:pointer;border-radius:50%;touch-action:none}
.pnode .halo{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,var(--atm) 0%,transparent 62%);opacity:.32;pointer-events:none}
.pnode[data-next] .halo{opacity:.55;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.12);opacity:.75}}
.pnode[data-locked] .planet{filter:grayscale(.85) brightness(.45)}
.pnode[data-sel] .reticle{opacity:1;transform:scale(1)}
.reticle{position:absolute;inset:-30%;opacity:0;transform:scale(1.5);transition:opacity .35s,transform .5s var(--ease);pointer-events:none}
.reticle svg{width:100%;height:100%;overflow:visible;animation:spin 14s linear infinite}
.reticle .pulse{position:absolute;inset:18%;border-radius:50%;border:2px solid var(--gold);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.plabel{position:absolute;left:0;top:0;transform:translate(-50%,0);pointer-events:none;display:grid;justify-items:center;gap:2px;transition:opacity .25s}
.plabel b{font:700 11px var(--f-display);letter-spacing:.18em;text-transform:uppercase;padding:3px 9px 3px 11px;border-radius:99px;background:rgba(4,6,16,.72);border:1px solid rgba(255,255,255,.14);white-space:nowrap;}
.plabel small{font-size:10px;color:var(--ink3);white-space:nowrap;background:rgba(4,6,16,.55);padding:0 6px;border-radius:6px}
.plabel[data-next] b{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(255,200,100,.25)}
.plabel[data-done] b::after{content:" ✓";color:var(--ok)}
.plabel[data-hide]{opacity:0}
.planet{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:0 0 calc(var(--d) * .18) var(--atm);transform:translateZ(0)}
.planet>.tex{position:absolute;left:0;top:0;height:100%;width:400%;background-size:auto 100%;background-repeat:repeat-x;animation:rot var(--rot,60s) linear infinite;will-change:transform}
.planet::before{content:"";position:absolute;inset:0;z-index:1;border-radius:50%;background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.35),transparent 38%),radial-gradient(circle at 72% 72%,rgba(0,0,0,.82),transparent 62%);mix-blend-mode:normal}
.planet::after{content:"";position:absolute;inset:0;z-index:1;border-radius:50%;box-shadow:inset calc(var(--d) * -.14) calc(var(--d) * -.1) calc(var(--d) * .22) rgba(0,0,0,.85),inset 0 0 calc(var(--d) * .06) var(--atm)}
@keyframes rot{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.p-extra{position:absolute;pointer-events:none}
.map-ui{position:fixed;z-index:30;pointer-events:none;inset:0}
.map-ui>*{pointer-events:auto}
.map-head{position:absolute;left:0;right:0;top:0;padding:calc(10px + var(--st)) 14px 30px;display:flex;align-items:flex-start;gap:10px;background:linear-gradient(180deg,rgba(2,3,10,.85),transparent);pointer-events:none}
.map-head>*{pointer-events:auto}
.map-title{flex:1;min-width:0}
.map-title h1{font:700 15px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);text-shadow:0 0 18px rgba(255,200,100,.35)}
.map-title p{margin:2px 0 0;font-size:12px;color:var(--ink2);letter-spacing:.04em}
.map-tools{position:absolute;right:12px;top:calc(var(--st) + 74px);display:grid;gap:8px}
.mtool{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(8,12,28,.78);border:1px solid var(--hair2);color:var(--ink);cursor:pointer;touch-action:manipulation}
.mtool:active{transform:scale(.94)}
.mtool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.coords{position:absolute;left:14px;top:calc(var(--st) + 78px);font:500 10px/1.5 var(--f-display);letter-spacing:.14em;color:rgba(160,200,255,.55);pointer-events:none;text-transform:uppercase}
.sheet{position:absolute;left:50%;bottom:calc(var(--tabh) + var(--sb) + 12px);width:min(calc(100% - 24px),560px);transform:translate(-50%,calc(100% + 120px));transition:transform .5s var(--ease);padding:16px 16px 14px;display:grid;gap:12px}
.sheet[data-open]{transform:translate(-50%,0)}
.sheet-h{display:flex;gap:14px;align-items:center}
.sheet-h .mini{width:62px;height:62px;flex:none}
.sheet-h .grow{flex:1;min-width:0}
.sheet-h h2{font:700 20px var(--f-display);letter-spacing:.08em}
.sheet-h p{margin:2px 0 0;font-size:13px;color:var(--ink2)}
.sheet .x{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.06);color:var(--ink2);cursor:pointer;z-index:2}
.sheet-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--hair)}
.stat b{display:block;font:700 16px var(--f-display);color:var(--ink)}
.stat span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.sheet-actions{display:flex;gap:8px}
.sheet-actions .btn{flex:1}
.sheet .sector{font:500 10px var(--f-display);letter-spacing:.18em;color:var(--ink3);text-transform:uppercase}
.minimap{position:absolute;left:12px;bottom:calc(var(--tabh) + var(--sb) + 12px);width:104px;height:74px;border-radius:12px;background:rgba(6,9,22,.78);border:1px solid var(--hair2);overflow:hidden;transition:opacity .3s}
.minimap canvas{width:100%;height:100%}
.sheet-open .minimap{opacity:0;pointer-events:none}
.map-hint{position:absolute;left:50%;bottom:calc(var(--tabh) + var(--sb) + 22px);transform:translateX(-50%);padding:8px 14px;border-radius:99px;font-size:12px;color:var(--ink2);background:rgba(6,9,22,.8);border:1px solid var(--hair);white-space:nowrap;transition:opacity .4s;pointer-events:none}
.sheet-open .map-hint{opacity:0}

/* hyperspace */
.hyper{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;transition:opacity .25s}
.hyper[data-on]{opacity:1}
.hyper canvas{width:100%;height:100%}
.flash{position:fixed;inset:0;z-index:91;pointer-events:none;background:#fff;opacity:0}
.flash[data-on]{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}

/* droid */
.droid-fab{position:fixed;right:12px;bottom:calc(var(--tabh) + var(--sb) + 12px);z-index:45;width:62px;height:70px;border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 8px 16px rgba(0,0,0,.6));transition:transform .3s var(--ease),opacity .3s}
.droid-fab:active{transform:scale(.92)}
.sheet-open .droid-fab,.hide-droid .droid-fab{opacity:0;pointer-events:none;transform:translateY(20px)}
.droid-fab svg{width:100%;height:100%;overflow:visible}
.bb-body{animation:roll 2.6s ease-in-out infinite;transform-origin:32px 52px}
.bb-head{animation:bobh 2.6s ease-in-out infinite}
@keyframes roll{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes bob{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
.droid-bubble{position:fixed;right:80px;bottom:calc(var(--tabh) + var(--sb) + 40px);z-index:46;max-width:min(250px,64vw);padding:10px 12px;border-radius:16px 16px 4px 16px;font-size:13.5px;line-height:1.4;background:rgba(10,16,36,.95);border:1px solid hsl(var(--accent-h) 100% 70% / .35);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}

/* modal & sheets */
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,3,9,.72);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal-card{width:100%;max-width:600px;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;padding:18px 16px calc(18px + var(--sb));border-radius:24px 24px 0 0;display:grid;gap:14px;align-content:start;animation:up .45s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:700px){.modal{align-items:center}.modal-card{border-radius:24px;max-height:86dvh}}
.modal-h{display:flex;align-items:center;gap:12px}
.modal-h .grow{flex:1;min-width:0}
.modal-h h2{font:700 18px var(--f-display);letter-spacing:.06em}
.modal-x{width:42px;height:42px;flex:none;border-radius:12px;border:0;background:rgba(255,255,255,.07);color:var(--ink2);cursor:pointer;font-size:18px}

/* toast */
.toasts{position:fixed;left:0;right:0;top:calc(var(--st) + 10px);z-index:95;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;width:min(100%,420px);display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;cursor:pointer;animation:tin .5s var(--ease)}
.toast .ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);font-size:18px}
.toast b{display:block;font-size:14px}
.toast span{font-size:12.5px;color:var(--ink2)}
.toast.out{animation:tout .4s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateY(-16px) scale(.97)}}
@keyframes tout{to{opacity:0;transform:translateY(-12px)}}

/* ---------- PLANET VIEW ---------- */
.pv{position:relative;min-height:100dvh;padding:0 0 calc(var(--tabh) + var(--sb) + 30px)}
.pv-amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.pv-amb canvas{position:absolute;inset:0;width:100%;height:100%}
.pv-amb .scape{position:absolute;left:0;right:0;bottom:0;width:100%;height:46vh}
.pv-amb .sky{position:absolute;inset:0}
.pv-amb .veil{position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(3,4,10,.55) 60%,rgba(3,4,10,.92))}
.pv-inner{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:calc(10px + var(--st)) 16px 0;display:grid;gap:16px}
.pv-hero{display:grid;justify-items:center;text-align:center;gap:8px;padding:8px 0 4px}
.pv-hero .big{width:min(46vw,190px);aspect-ratio:1}
.pv-hero h1{font:700 clamp(2rem,10vw,3rem)/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 30px var(--atm,rgba(255,255,255,.3))}
.pv-hero .tag{font-family:var(--f-letter);font-style:italic;font-size:1.3rem;color:var(--ink2)}
.pv-hero .desc{max-width:44ch;color:var(--ink2);font-size:14.5px;margin:0}
.pv-stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.effect{display:flex;gap:12px;padding:12px 14px;align-items:flex-start;border-radius:16px;border:1px solid rgba(255,217,138,.4);background:linear-gradient(180deg,rgba(255,200,100,.1),rgba(255,200,100,.03))}
.effect .ic{font-size:20px;line-height:1}
.effect b{color:var(--gold);display:block;font-size:14px}
.effect span{font-size:13.5px;color:var(--ink2)}
.missions{display:grid;gap:10px}
.mission{display:flex;align-items:center;gap:14px;width:100%;padding:14px;text-align:left;cursor:pointer;border-radius:18px;transition:transform .15s}
.mission:active{transform:scale(.985)}
.mission .mi{width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(255,255,255,.03));border:1px solid var(--hair2)}
.mission[data-done] .mi{border-color:rgba(141,255,196,.5);box-shadow:0 0 16px rgba(141,255,196,.18)}
.mission .grow{flex:1;min-width:0}
.mission b{display:block;font-size:15.5px}
.mission span{font-size:13px;color:var(--ink2)}
.mission[data-locked]{opacity:.55}
.lcards{display:grid;gap:10px}
.lcard{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;text-align:left;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair);cursor:pointer;transition:transform .15s,background .2s}
.lcard:active{transform:scale(.985);background:rgba(255,255,255,.07)}
.lcard[disabled]{cursor:default;opacity:.62}
.lcard .lk{width:46px;height:46px;flex:none;display:grid;place-items:center}
.lcard .grow{flex:1;min-width:0}
.lcard b{display:block;font-size:15px;line-height:1.25}
.lcard span{font-size:12.5px;color:var(--ink3)}
.lcard .new{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);flex:none}
.lcard .fav{color:var(--gold);font-size:16px}
.kind-ic svg{width:40px;height:40px;overflow:visible}

/* mission stages */
.stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:1px solid var(--hair2);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage--tall{aspect-ratio:3/4}
.stage .it,.pano .it{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:44px;display:grid;place-items:center;background:none;border:0;padding:0;font-size:26px;cursor:pointer;transition:transform .3s,opacity .4s}
.stage .it:active,.pano .it:active{transform:translate(-50%,-50%) scale(.9)}
.stage .it[data-got],.pano .it[data-got]{opacity:.15;pointer-events:none;transform:translate(-50%,-50%) scale(1.6)}
.m-note{margin:0;color:var(--ink2);font-size:14.5px}
.m-quote{margin:0;font-family:var(--f-letter);font-size:1.35rem;line-height:1.45;text-align:center;color:var(--ink);text-wrap:balance}
.m-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.m-done{display:grid;justify-items:center;gap:8px;text-align:center;padding:14px;border-radius:16px;background:rgba(141,255,196,.07);border:1px solid rgba(141,255,196,.3)}
.m-done b{color:var(--ok)}
.pads{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pad{aspect-ratio:1.4;border-radius:18px;border:2px solid rgba(255,255,255,.14);background:color-mix(in srgb,var(--c) 22%,#0b0f23);cursor:pointer;transition:filter .12s,transform .12s,box-shadow .2s}
.pad[data-lit]{background:var(--c);filter:brightness(1.25);transform:scale(.97);box-shadow:0 0 30px var(--c)}
.holdbtn{position:relative;width:150px;height:150px;border-radius:50%;margin:0 auto;display:grid;place-items:center;border:2px solid var(--accent-line);background:radial-gradient(circle,var(--accent-soft),transparent 70%);color:var(--ink);font-weight:700;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.holdbtn svg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);transform:rotate(-90deg)}
.holdbtn circle{fill:none;stroke-width:5}
.field{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid var(--accent-line);background:rgba(0,0,0,.35);color:var(--ink);font:inherit;font-size:16px}
textarea.field{min-height:110px;resize:vertical}
.optgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.opt{min-height:56px;padding:10px 12px;border-radius:14px;border:1px solid var(--hair2);background:rgba(255,255,255,.05);color:var(--ink);text-align:left;cursor:pointer;font-size:14px;font-weight:600;display:grid;gap:2px}
.opt small{font-weight:400;color:var(--ink3);font-size:12px}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 14px var(--accent-glow)}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem{aspect-ratio:1;border-radius:14px;border:1px solid var(--hair2);background:linear-gradient(135deg,#2a2016,#16110b);font-size:26px;cursor:pointer;display:grid;place-items:center;color:var(--gold);transition:transform .3s}
.mem[data-open]{background:linear-gradient(135deg,rgba(255,217,138,.25),rgba(255,217,138,.05));border-color:var(--gold)}
.mem[data-ok]{opacity:.55}
.mem:not([data-open])>span{opacity:0}
.cipher{display:grid;justify-items:center;gap:14px}
.cipher-wheel{width:220px;height:220px;border-radius:50%;position:relative;border:2px solid rgba(255,217,138,.45);background:radial-gradient(circle,rgba(255,217,138,.12),rgba(0,0,0,.2) 70%);transition:transform .35s var(--ease)}
.cipher-wheel span{position:absolute;left:50%;top:50%;font:700 12px var(--f-display);color:var(--gold)}
.cipher-out{font:700 clamp(1.05rem,5vw,1.4rem) var(--f-display);letter-spacing:.14em;text-align:center;min-height:2.6em;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}
.cal b{font-size:11px;color:var(--ink3);font-weight:600}
.cal button{aspect-ratio:1;border-radius:10px;border:1px solid transparent;background:rgba(255,255,255,.04);color:var(--ink2);cursor:pointer}
.cal button[data-21]{border-color:var(--gold);color:var(--gold);font-weight:700;box-shadow:0 0 12px rgba(255,217,138,.3)}
.cal button[data-today]{background:var(--accent-soft);color:var(--ink)}
.range{width:100%;accent-color:var(--gold);height:36px}

/* ---------- LETTER READER ---------- */
.reader{position:fixed;inset:0;z-index:80;overflow-y:auto;overscroll-behavior:contain;background:#03040a}
.reader-bg{position:fixed;inset:0;pointer-events:none}
.reader-in{position:relative;max-width:640px;margin:0 auto;padding:calc(10px + var(--st)) 16px calc(30px + var(--sb));display:grid;gap:16px}
.reader-top{display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:3;padding:calc(6px + var(--st)) 0 6px;margin-top:calc(-10px - var(--st))}
.reader-top::before{content:"";position:absolute;inset:0 -16px;background:linear-gradient(180deg,rgba(3,4,10,.95) 60%,transparent);z-index:-1}
.reader-top .grow{flex:1}
.projector{display:grid;justify-items:center;gap:0;margin-top:6px}
.beam{width:min(78%,420px);height:46px;clip-path:polygon(44% 100%,56% 100%,100% 0,0 0);background:linear-gradient(0deg,rgba(127,227,255,.55),rgba(127,227,255,.04));filter:blur(1px);animation:flicker 3s infinite}
@keyframes flicker{0%,100%{opacity:.85}47%{opacity:.85}48%{opacity:.4}50%{opacity:.9}}
.paper{position:relative;display:grid;gap:18px;padding:26px 22px 28px;border-radius:22px;animation:materialize .9s var(--ease) both}
@keyframes materialize{0%{opacity:0;transform:translateY(12px) scaleY(.96);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
.paper p{margin:0;font-family:var(--f-letter);font-size:calc(1.28rem * var(--ts));line-height:1.62;color:#f3f7ff;text-wrap:pretty;hyphens:auto}
.paper .stamp{font:600 10.5px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--holo)}
.paper .rule{height:1px;background:linear-gradient(90deg,transparent,var(--hair2),transparent)}
.paper h1{font-family:var(--f-letter);font-size:clamp(2rem,8.5vw,2.6rem);line-height:1.08;font-weight:600}
.paper--holo{background:linear-gradient(180deg,rgba(40,120,170,.18),rgba(10,30,60,.25));border:1px solid rgba(127,227,255,.35);box-shadow:0 0 40px rgba(127,227,255,.12),inset 0 0 30px rgba(127,227,255,.06)}
.paper--holo::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(127,227,255,.05) 0 1px,transparent 1px 4px)}
.paper--holo p,.paper--holo h1{color:#e8fbff;text-shadow:0 0 12px rgba(127,227,255,.25)}
.paper--archive{background:linear-gradient(180deg,#e9dcc0,#d8c5a0);color:#2b1f12;border:1px solid #b89a6a;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 60px rgba(120,80,30,.25)}
.paper--archive p,.paper--archive h1{color:#2b1f12;text-shadow:none}
.paper--archive .stamp{color:#7a5528}
.paper--archive .rule{background:linear-gradient(90deg,transparent,#a8865a,transparent)}
.paper--archive .sign{color:#7a5528}
.paper--holocron{background:linear-gradient(180deg,rgba(60,40,10,.4),rgba(20,12,4,.6));border:1px solid rgba(255,217,138,.5);box-shadow:0 0 60px rgba(255,190,80,.15),inset 0 0 40px rgba(255,190,80,.08)}
.paper--holocron p,.paper--holocron h1{color:#fff6e3}
.paper--holocron .stamp{color:var(--gold)}
.paper .sign{text-align:right;font-style:italic;color:var(--gold)}
.reader-actions{display:flex;gap:8px}
.reader-actions .btn{flex:1}
.glyphs{display:flex;justify-content:center;gap:10px;opacity:.55;font-size:13px;letter-spacing:.3em;color:#7a5528;font-family:var(--f-display)}
.cube{width:120px;height:120px;margin:10px auto 0;perspective:500px}
.cube-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:cuberot 9s linear infinite}
.cube-in i{position:absolute;inset:0;border:2px solid rgba(255,217,138,.8);background:radial-gradient(circle,rgba(255,217,138,.35),rgba(120,70,10,.25) 70%);box-shadow:inset 0 0 20px rgba(255,200,100,.5)}
.cube-in i:nth-child(1){transform:translateZ(60px)}.cube-in i:nth-child(2){transform:rotateY(90deg) translateZ(60px)}.cube-in i:nth-child(3){transform:rotateY(180deg) translateZ(60px)}
.cube-in i:nth-child(4){transform:rotateY(-90deg) translateZ(60px)}.cube-in i:nth-child(5){transform:rotateX(90deg) translateZ(60px)}.cube-in i:nth-child(6){transform:rotateX(-90deg) translateZ(60px)}
@keyframes cuberot{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.cube.opening .cube-in{animation:cubeopen 1.4s var(--ease) forwards}
@keyframes cubeopen{0%{transform:rotateX(-20deg) rotateY(0) scale(1)}70%{transform:rotateX(-20deg) rotateY(540deg) scale(1.2);opacity:1}100%{transform:rotateX(-20deg) rotateY(720deg) scale(.2);opacity:0}}

/* ---------- pages ---------- */
.pcards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.pcards{grid-template-columns:repeat(3,1fr)}}
.pcard{display:grid;justify-items:center;gap:6px;padding:16px 10px 12px;text-align:center;border-radius:18px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid var(--hair);transition:transform .15s}
.pcard:active{transform:scale(.97)}
.pcard .pp{width:64px;height:64px}
.pcard b{font:700 13px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.pcard span{font-size:11.5px;color:var(--ink3)}
.pcard .bar{width:80%}
.pcard[data-locked]{opacity:.5}
.summary{display:flex;gap:14px;align-items:center;padding:14px 16px}
.summary .grow{flex:1;min-width:0;display:grid;gap:4px}
.summary b{font-size:15px}
.summary span{font-size:13px;color:var(--ink2)}
.timeline{position:relative;display:grid;gap:14px;padding-left:24px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--gold),var(--accent),transparent)}
.tl{position:relative;padding:14px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair)}
.tl::before{content:"";position:absolute;left:-23px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.tl .d{font:600 11px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.tl b{display:block;font-size:16px;margin-top:2px}
.tl p{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.tl .m-row{justify-content:flex-start;margin-top:8px}
.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.counter div{padding:14px 6px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair)}
.counter b{display:block;font:700 clamp(1.4rem,7vw,2rem) var(--f-display);color:var(--gold)}
.counter span{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em}
.secret-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair)}
.secret-row .grow{flex:1;min-width:0}
.secret-row b{display:block;font-size:14.5px}
.secret-row span{font-size:12.5px;color:var(--ink3)}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair)}
.setrow .grow{flex:1;min-width:0}
.setrow b{display:block;font-size:15px}
.setrow span{font-size:12.5px;color:var(--ink3)}
.switch{position:relative;width:52px;height:30px;flex:none;border-radius:99px;border:0;background:rgba(255,255,255,.15);cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.switch[aria-checked=true]{background:var(--accent)}
.switch[aria-checked=true]::after{transform:translateX(22px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;background:#0a0f22}
.swatch i{width:8px;height:30px;border-radius:4px;background:#fff;box-shadow:0 0 6px 3px var(--c),0 0 16px 6px var(--c)}
.swatch[aria-pressed=true]{border-color:var(--c)}

/* ---------- intro ---------- */
.intro{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;touch-action:manipulation}
.intro canvas{position:absolute;inset:0;width:100%;height:100%}
.intro-stage{position:relative;z-index:2;width:100%;max-width:560px;padding:0 26px;text-align:center}
.i-meta{margin:0;font:600 12px var(--f-display);letter-spacing:.28em;text-transform:uppercase;color:var(--holo);opacity:0;animation:iup 1s var(--ease) both}
.i-line{margin:10px 0 0;font-family:var(--f-letter);font-size:clamp(1.45rem,6.2vw,2rem);line-height:1.3;color:#eef4ff;opacity:0;animation:iup 1.1s var(--ease) both;text-wrap:balance}
.i-gold{color:var(--gold);font-size:clamp(2rem,9vw,2.8rem);text-shadow:0 0 30px rgba(255,217,138,.45)}
@keyframes iup{from{opacity:0;transform:translateY(14px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.longago{font-family:var(--f-body);font-size:clamp(1.05rem,4.6vw,1.35rem);color:#5fb8ff;line-height:1.5;opacity:0;animation:lga 5s ease both;text-align:left;max-width:22em;margin:0 auto}
@keyframes lga{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
.crawl-wrap{position:fixed;inset:0;perspective:320px;perspective-origin:50% 30%;overflow:hidden;z-index:2;mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 100%);-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 30%,#000 100%)}
.crawl{position:absolute;left:50%;bottom:0;width:min(88vw,520px);transform-origin:50% 100%;transform:translateX(-50%) rotateX(24deg) translateY(100%);animation:crawl 24s linear forwards;color:var(--gold);text-align:justify;font:600 clamp(1.15rem,5vw,1.55rem)/1.5 var(--f-body)}
.crawl h2{text-align:center;font:700 clamp(1.2rem,5.4vw,1.7rem) var(--f-display);letter-spacing:.1em;margin-bottom:1em}
.crawl .ep{text-align:center;font:600 .9em var(--f-display);letter-spacing:.2em;margin-bottom:.4em}
.crawl p{margin:0 0 1em}
@keyframes crawl{from{transform:translateX(-50%) rotateX(24deg) translateY(100%)}to{transform:translateX(-50%) rotateX(24deg) translateY(-160%)}}
.i-title{display:grid;justify-items:center;gap:10px}
.i-sw{margin:0;font:900 clamp(2.4rem,12vw,4.6rem)/1 var(--f-display);letter-spacing:.08em;color:transparent;-webkit-text-stroke:2px var(--gold);text-shadow:0 0 40px rgba(255,217,138,.35);opacity:0;animation:zoomout 2.4s var(--ease) both}
@keyframes zoomout{from{opacity:0;transform:scale(2.4);letter-spacing:.3em}to{opacity:1;transform:none}}
.i-sub{margin:0;font:600 clamp(.95rem,4.6vw,1.3rem) var(--f-display);letter-spacing:.3em;text-transform:uppercase;opacity:0;animation:iup 1s var(--ease) 1.2s both}
.i-date{margin:4px 0 18px;font-family:var(--f-letter);font-size:1.2rem;color:var(--ink2);opacity:0;animation:iup 1s var(--ease) 1.6s both}
.i-cta{opacity:0;animation:iup 1s var(--ease) 2s both;min-width:240px}
.i-foot{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:0 20px calc(20px + var(--sb));display:grid;justify-items:center;gap:8px}
.i-skip{min-height:44px;padding:0 22px;border-radius:99px;border:1px solid var(--hair2);background:rgba(255,255,255,.06);color:var(--ink);cursor:pointer;font-weight:600}
.i-hint{margin:0;font-size:12px;color:var(--ink3);letter-spacing:.06em}

/* setup */
.setup{position:fixed;inset:0;z-index:99;overflow-y:auto;background:radial-gradient(ellipse at 50% 20%,#0d1638,#03040a 65%);padding:calc(24px + var(--st)) 16px calc(24px + var(--sb));display:flex;justify-content:center}
.setup-in{width:100%;max-width:520px;display:grid;gap:18px;align-content:center}
.setup h1{font:700 1.6rem var(--f-display);letter-spacing:.06em}
.dots{display:flex;gap:6px}
.dots i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.14)}
.dots i[data-on]{background:var(--accent);box-shadow:0 0 10px var(--accent-glow)}
.droid-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.droid-pick button{display:grid;justify-items:center;gap:4px;padding:12px 6px;border-radius:16px;border:1px solid var(--hair2);background:rgba(255,255,255,.04);cursor:pointer;color:var(--ink)}
.droid-pick button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.droid-pick svg{width:56px;height:62px}
.droid-pick small{color:var(--ink3);font-size:11.5px;line-height:1.3;text-align:center}

/* saber divider */
.saber{height:4px;border-radius:99px;background:#fff;box-shadow:0 0 6px 2px var(--accent),0 0 18px 4px var(--accent-glow);transform-origin:left;animation:ignite .9s var(--ease) both}
@keyframes ignite{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.planet,.bb-body,.bb-head,.reticle svg,.route-on,.cube-in{animation:none!important}}
@media (orientation:landscape) and (max-height:520px){
  .sheet{left:auto;right:12px;transform:translate(0,calc(100% + 120px));width:340px}
  .sheet[data-open]{transform:translate(0,0)}
  .map-tools{top:calc(var(--st) + 60px)}
  .pv-hero .big{width:120px}
}
.pcard{overflow:hidden}
.kind-ic svg{width:100%;height:auto}
.lcard .kind-ic svg{width:40px;height:40px}
@keyframes fly{from{transform:translateX(-40vw)}to{transform:translateX(120vw)}}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) translateY(-4px)}50%{transform:translate(-50%,-50%) translateY(4px)}}

@keyframes bobh{0%,100%{transform:translateX(-2px)}50%{transform:translateX(2px)}}
@media (orientation:landscape) and (max-height:560px){
  .sheet{left:auto;right:12px;top:calc(var(--st) + 10px);bottom:calc(var(--tabh) + var(--sb) + 10px);transform:translate(0,0) translateX(calc(100% + 40px));width:min(360px,46vw);overflow-y:auto;align-content:start}
  .sheet[data-open]{transform:none}
  .sheet .m-note{display:none}
  .map-tools{right:auto;left:12px;top:calc(var(--st) + 112px);grid-auto-flow:column}
  .coords{display:none}
}
/* droid hangar, npcs, orbi, achievements */
.dr-head{display:flex;gap:14px;align-items:center}
.dr-ava{width:92px;height:100px;flex:none;display:grid;place-items:center;border-radius:20px;background:radial-gradient(circle at 50% 60%,var(--accent-soft),transparent 70%)}
.dr-ava svg{overflow:visible}
.dr-stats{display:grid;gap:6px;flex:1;min-width:0;font-size:12px;color:var(--ink2)}
.bubble{margin:0;padding:12px 14px;border-radius:14px;background:hsl(var(--accent-h) 100% 70% / .1);border:1px solid hsl(var(--accent-h) 100% 70% / .3);color:var(--ink);line-height:1.5;font-size:14.5px}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}
.topic{min-height:42px;padding:0 14px;border-radius:99px;border:1px solid var(--hair2);background:rgba(255,255,255,.05);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.topic:active{transform:scale(.96)}
.care-grid,.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.care,.acc{min-height:58px;padding:10px 12px;border-radius:14px;border:1px solid var(--hair2);background:rgba(255,255,255,.05);color:var(--ink);font-weight:600;font-size:14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.care small,.acc small{font-weight:400;color:var(--ink3);font-size:12px}
.care[disabled],.acc[disabled]{opacity:.5;cursor:default}
.acc[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.npc{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;text-align:left;cursor:pointer;color:inherit;font:inherit;border-radius:18px}
.npc .grow{flex:1;min-width:0;display:grid;gap:2px}
.npc .grow>b{font-size:15px}
.npc .grow>span{font-size:13.5px;color:var(--ink2);font-family:var(--f-letter);font-size:1.08rem;font-style:italic;line-height:1.4}
.npc-face{position:relative;width:46px;height:52px;flex:none}
.npc-face i{position:absolute;left:6px;right:6px;top:2px;height:26px;border-radius:13px 13px 6px 6px;background:linear-gradient(180deg,#e8eef8,#9aa8c0);box-shadow:inset 0 -4px 0 var(--c)}
.npc-face i::after{content:"";position:absolute;left:50%;top:9px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#0a1022;box-shadow:0 0 0 2px var(--c)}
.npc-face b{position:absolute;left:10px;right:10px;top:30px;bottom:0;border-radius:6px;background:linear-gradient(180deg,var(--c),#3a4458)}
.orbi{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px}
.orbi .grow{flex:1;min-width:0}
.orbi .bubble{margin-top:8px}
.sphere-ball{width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,#fff,#d9e4ff 30%,#9fb4e8 60%,#4a5d96);position:relative;box-shadow:0 0 18px rgba(159,180,232,.5);animation:orbi 3.2s ease-in-out infinite}
.sphere-ball span{position:absolute;left:34%;top:28%;width:30%;height:30%;border-radius:50%;background:#ff9a3d;box-shadow:0 0 8px #ff9a3d}
@keyframes orbi{0%,100%{transform:translate(-3px) rotate(-12deg)}50%{transform:translate(3px) rotate(12deg)}}
.ach-group{border-radius:16px;border:1px solid var(--hair);background:rgba(255,255,255,.03);padding:4px 10px}
.ach-group summary{display:flex;align-items:center;gap:8px;min-height:46px;cursor:pointer;list-style:none}
.ach-group summary::-webkit-details-marker{display:none}
.ach-group summary b{flex:1;font-size:14.5px}
.ach-group[open]{padding-bottom:10px}
.ach-group[open]>.secret-row{margin-top:8px}
/* journey clarity */
.route-next{stroke:var(--gold);stroke-width:2.4;stroke-dasharray:3 6;animation:dash 1s linear infinite;filter:drop-shadow(0 0 4px rgba(255,200,100,.8))}
.route-base{stroke:rgba(255,217,138,.22);stroke-width:1.4;stroke-dasharray:4 6}
.numtag{position:absolute;left:-4px;top:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:#0a0f22;border:1.5px solid rgba(255,255,255,.4);font:700 11px/19px var(--f-display);color:var(--ink);text-align:center;pointer-events:none;z-index:2}
.pnode[data-next] .numtag{background:var(--gold);color:#1c1200;border-color:#fff}
.pnode[data-sel] .numtag{display:none}
.nextflag{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);color:var(--gold);font-size:22px;text-shadow:0 0 12px rgba(255,200,100,.9);display:none;pointer-events:none;animation:nflag 1.1s ease-in-out infinite}
.pnode[data-next]:not([data-sel]) .nextflag{display:block}
@keyframes nflag{50%{transform:translate(-50%,-7px)}}
.nextbtn{position:absolute;left:12px;top:calc(var(--st) + 66px);display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:16px;cursor:pointer;color:var(--ink);text-align:left;max-width:calc(100% - 90px);border-color:rgba(255,217,138,.55)!important}
.nextbtn .nb-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(180deg,#ffe7a8,#e9a83c);color:#241400;font-size:14px;flex:none;animation:breathe 2.4s ease-in-out infinite}
.nextbtn .nb-t{display:grid;line-height:1.2}
.nextbtn small{font-size:11px;color:var(--gold);letter-spacing:.04em}
.nextbtn b{font:700 14px var(--f-display);letter-spacing:.06em}
.sheet-open .nextbtn{opacity:0;pointer-events:none}
.coords{top:calc(var(--st) + 128px)}
@media (orientation:landscape) and (max-height:560px){.nextbtn{top:calc(var(--st) + 54px)}}
.howto{display:grid;gap:4px;padding:12px 14px;border-radius:16px;background:hsl(var(--accent-h) 100% 70% / .08);border:1px solid hsl(var(--accent-h) 100% 70% / .3)}
.howto b{font-size:14px;color:var(--accent)}
.howto span{font-size:14px;color:var(--ink2);line-height:1.45}
.mission[data-first]{border-color:rgba(255,217,138,.7)!important;box-shadow:0 0 0 1px rgba(255,217,138,.35),0 0 28px rgba(255,190,80,.18)}
.mission .mi-l{display:block;margin-top:4px;font-size:12px;color:var(--gold)}
.mission .grow>.chip{display:inline-flex}
/* gate */
.gate{position:fixed;inset:0;z-index:200;background:#000;display:grid;place-items:center;padding:20px;transition:opacity .7s}
.gate.out{opacity:0}
.gate canvas{position:absolute;inset:0;width:100%;height:100%}
.gate-card{position:relative;z-index:2;width:min(100%,400px);display:grid;gap:12px;justify-items:center;text-align:center}
.gate-card h1{font:700 clamp(1.6rem,7vw,2.1rem) var(--f-display);letter-spacing:.08em;color:var(--gold);text-shadow:0 0 24px rgba(255,200,100,.4)}
.gate-lock .cube{margin:0 auto 6px}
.gate-form{display:grid;gap:10px;width:100%;margin-top:6px}
.gate-in{width:100%;min-height:54px;padding:0 18px;border-radius:16px;border:1px solid rgba(255,217,138,.5);background:rgba(10,8,2,.6);color:var(--ink);font:600 20px var(--f-display);letter-spacing:.3em;text-align:center}
.gate-in:focus{outline:none;box-shadow:0 0 0 3px rgba(255,217,138,.25)}
.gate-msg{margin:0;min-height:1.4em;font-size:14px;color:var(--danger)}
.gate-msg.ok{color:var(--ok)}
.gate-saber{display:none;width:80%;margin:4px auto 0;--accent:#ffd98a;--accent-glow:rgba(255,200,100,.7)}
.gate-foot{margin:6px 0 0;font-size:12px;color:var(--ink3)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
/* help */
.help-s{border-radius:16px;border:1px solid var(--hair);background:rgba(255,255,255,.03);padding:2px 12px}
.help-s summary{display:flex;align-items:center;gap:10px;min-height:50px;cursor:pointer;list-style:none}
.help-s summary::-webkit-details-marker{display:none}
.help-s summary::after{content:"＋";margin-left:auto;color:var(--ink3)}
.help-s[open] summary::after{content:"－"}
.help-ic{font-size:20px}
.help-b{padding:0 0 10px 30px}
.help-b p{margin:0 0 8px;color:var(--ink2);font-size:14.5px;line-height:1.5}
/* tour */
.tour{position:fixed;inset:0;z-index:150}
.tour-spot{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(2,3,10,.78),0 0 0 2px var(--gold),0 0 30px rgba(255,200,100,.5);transition:all .45s var(--ease);pointer-events:none}
.tour-card{position:fixed;padding:16px;display:grid;gap:8px;animation:pop .35s var(--ease)}
.tour-card b{font:700 17px var(--f-display);letter-spacing:.04em}
.tour-card p{margin:0;color:var(--ink2);font-size:14.5px;line-height:1.5}
.touring .droid-bubble{display:none}
.mission .chip--gold{color:var(--gold);font-size:12px}
.mission .chip--ok{color:var(--ok);font-size:12px}
.gate-in::selection{background:rgba(255,217,138,.3)}
/* cinematic polish */
.burst{position:fixed;inset:0;width:100%;height:100%;z-index:96;pointer-events:none}
.pv-hero .big{animation:arrive 1.4s var(--ease) both}
@keyframes arrive{0%{transform:scale(.25);filter:blur(8px) brightness(2);opacity:0}60%{opacity:1}100%{transform:none;filter:none}}
.pv-hero h1{animation:titlein 1.3s var(--ease) .35s both}
@keyframes titlein{from{opacity:0;letter-spacing:.6em;filter:blur(6px)}to{opacity:1}}
.pv-hero .tag,.pv-hero .desc,.pv-hero .pv-stats,.pv-hero .eyebrow{animation:iup .9s var(--ease) .7s both}
.pv-inner>*:nth-child(n+3){animation:iup .8s var(--ease) both}
.pv-inner>*:nth-child(3){animation-delay:.8s}.pv-inner>*:nth-child(4){animation-delay:.9s}.pv-inner>*:nth-child(5){animation-delay:1s}.pv-inner>*:nth-child(6){animation-delay:1.1s}
.view>.page>*{animation:iup .6s var(--ease) both}
.view>.page>*:nth-child(2){animation-delay:.06s}.view>.page>*:nth-child(3){animation-delay:.12s}.view>.page>*:nth-child(4){animation-delay:.18s}.view>.page>*:nth-child(5){animation-delay:.24s}.view>.page>*:nth-child(n+6){animation-delay:.3s}
/* letters: each kind arrives differently */
.paper--holo{animation:holoin 1.1s var(--ease) both}
@keyframes holoin{0%{opacity:0;transform:scaleY(.02) scaleX(.6);filter:brightness(3)}40%{opacity:1;transform:scaleY(.02) scaleX(1)}100%{transform:none;filter:none}}
.paper--holo>*{animation:iup .7s var(--ease) both}
.paper--holo>*:nth-child(1){animation-delay:.6s}.paper--holo>*:nth-child(2){animation-delay:.7s}.paper--holo>*:nth-child(3){animation-delay:.8s}.paper--holo>*:nth-child(4){animation-delay:.9s}.paper--holo>*:nth-child(5){animation-delay:1s}.paper--holo>*:nth-child(6){animation-delay:1.1s}.paper--holo>*:nth-child(n+7){animation-delay:1.2s}
.paper--archive{transform-origin:top;animation:unroll 1.2s var(--ease) both}
@keyframes unroll{0%{opacity:0;clip-path:inset(0 0 100% 0)}20%{opacity:1}100%{clip-path:inset(0 0 0 0)}}
.paper--holocron{animation:materialize 1.2s var(--ease) both}
.reader .saber{animation:ignite 1s var(--ease) 1.2s both}
.mission,.lcard,.pcard,.tl{transition:transform .2s var(--ease),box-shadow .3s,border-color .3s}
@media (hover:hover){.mission:hover,.lcard:hover,.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 0 1px var(--accent-line)}}
.tab svg{transition:transform .3s var(--ease)}
.tab[aria-current=page] svg{transform:translateY(-2px) scale(1.08)}
.noanim .pv-hero .big,.noanim .pv-hero h1,.noanim .pv-hero .tag,.noanim .pv-hero .desc,.noanim .pv-hero .pv-stats,.noanim .pv-hero .eyebrow,.noanim .pv-inner>*,.noanim .view>.page>*{animation:none!important}
.pnode,.plabel{transition:opacity .4s}
.has-sel .pnode:not([data-sel]){opacity:.5}
.has-sel .plabel:not([data-hide]){opacity:.55}
.pv-hero .big{position:relative}
.pv-hero .big::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:1px solid var(--atm);opacity:.35;transform:rotateX(72deg);animation:orbit 12s linear infinite;pointer-events:none}
@keyframes orbit{to{transform:rotateX(72deg) rotate(360deg)}}

.numtag{transform:scale(var(--inv,1));transform-origin:0 0}
.nextflag{transform:translateX(-50%) scale(var(--inv,1));transform-origin:50% 100%}
@keyframes nflag{50%{transform:translateX(-50%) translateY(calc(-7px * var(--inv,1))) scale(var(--inv,1))}}
.reticle .pulse{border-width:calc(2px * var(--inv,1))}

.tabbar{background:rgba(5,7,16,.95)}
.plabel b{background:rgba(4,6,16,.85)}
.mtool{background:rgba(8,12,28,.9)}
.map canvas.fx{pointer-events:none}
/* light mode for phones & tablets: fewer simultaneous animations */
.lite .map .planet>.tex{animation:none}
.lite .map .planet{box-shadow:none}
.lite .pnode .halo{animation:none!important}
.lite .reticle svg{animation:none}
.lite .pnode:not([data-sel]) .reticle .pulse{animation:none}
.lite .route-on,.lite .route-next{animation:none;filter:none}
.lite .region{display:none}
.lite .holo::before{display:none}
.lite .sphere-ball{animation:none}
.lite .view-bg::after{display:none}
.reticle .pulse{animation-play-state:paused}
.pnode[data-sel] .reticle .pulse{animation-play-state:running}
.reticle svg{animation-play-state:paused}
.pnode[data-sel] .reticle svg{animation-play-state:running}
.map canvas:first-child{will-change:transform;transform-origin:50% 50%}
/* letter scene illustrations */
.scene-fig{margin:0;position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--hair2);box-shadow:0 18px 50px rgba(0,0,0,.5);animation:scenein 1.1s var(--ease) both}
@keyframes scenein{from{opacity:0;transform:scale(1.04);filter:blur(6px)}}
.scene-fig .scn{display:block;width:100%;height:auto;aspect-ratio:320/150}
.scene-fig figcaption{position:absolute;left:10px;bottom:8px;padding:4px 10px;border-radius:99px;background:rgba(3,5,14,.7);font:600 10.5px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.scene--holo{border-color:rgba(127,227,255,.45)}
.scene--holo::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(127,227,255,.06) 0 1px,transparent 1px 3px)}
.scene--archive{border-color:#b89a6a;filter:sepia(.25)}
.scene--archive figcaption{background:rgba(60,40,10,.75);color:#ffe9c0}
.scene--holocron{border-color:rgba(255,217,138,.6);box-shadow:0 0 40px rgba(255,190,80,.2),0 18px 50px rgba(0,0,0,.5)}
.paper p.p-head{font:700 13px var(--f-display);letter-spacing:.22em;text-align:center;color:var(--gold);padding:8px 0;border-top:1px solid currentColor;border-bottom:1px solid currentColor}
.paper--archive p.p-head{color:#7a5528}
.paper p.p-field{font-family:var(--f-display);font-size:13.5px;letter-spacing:.06em;line-height:1.5;padding-left:10px;border-left:2px solid var(--holo)}
.paper--archive p.p-field{border-color:#b89a6a;color:#3a2a12}
.scn .tw{animation:twk 3.2s ease-in-out infinite}
@keyframes twk{50%{opacity:.15}}
.scn .wave{animation:wv 3s ease-in-out infinite}
@keyframes wv{50%{translate:8px 0;opacity:.3}}
.scn .drift{animation:drift 10s linear infinite}
.scn .drift.slow{animation-duration:40s}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(380px)}}
.scn .slow{animation:sway 18s ease-in-out infinite alternate}
@keyframes sway{to{translate:30px 0}}
.scn .fall{animation:fall 6s linear infinite}
@keyframes fall{to{transform:translate(-20px,160px)}}
.scn .rise{animation:rise 5s linear infinite}
@keyframes rise{to{transform:translate(10px,-160px);opacity:0}}
.scn .float{animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{translate:0 -6px}}
.scn .flick{animation:flicker 2.6s infinite}
.scn .spin3{animation:sp3 8s linear infinite}
@keyframes sp3{50%{scale:1.08}}
.scn .ship{animation:shipb 3.6s ease-in-out infinite}
@keyframes shipb{50%{translate:0 -4px}}
.scn .lift{animation:lift 4s ease-in-out infinite}
@keyframes lift{0%,100%{translate:0 30px}50%{translate:0 0}}
.scn .flame{transform-origin:50% 100%;transform-box:fill-box;animation:flame .5s ease-in-out infinite alternate}
@keyframes flame{to{transform:scaleY(1.15) skewX(4deg)}}
.scn .burstg{animation:burstg 2.4s ease-out infinite}
@keyframes burstg{0%{transform:scale(.2);opacity:0}20%{opacity:1}100%{transform:scale(1.3);opacity:0}}
.scn .pulse-r{animation:pr 2.4s ease-out infinite}
@keyframes pr{from{transform:scale(.6);opacity:.9}to{transform:scale(2.6);opacity:0}}
.scn .flowl,.scn .flow{animation:dash 1.2s linear infinite}
.scn .aim{animation:aim 2s ease-in-out infinite}
@keyframes aim{50%{translate:6px 0}}
.scn .sand{animation:dash 1s linear infinite}
.scn .saberl{animation:sbl 2.2s ease-in-out infinite}
@keyframes sbl{50%{opacity:.75}}
/* droid shop */
.shop{display:grid;gap:12px}
.shop-stage{position:relative;height:210px;border-radius:20px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 85%,hsl(var(--accent-h) 90% 60% / .35),transparent 55%),radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.12),transparent 60%),linear-gradient(180deg,#0b1030,#05071a);border:1px solid hsl(var(--accent-h) 100% 70% / .35)}
.shop-beam{position:absolute;left:50%;top:-10%;width:180px;height:120%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,255,255,.18),transparent 75%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);pointer-events:none}
.shop-ring{position:absolute;left:50%;bottom:16px;width:190px;height:44px;transform:translateX(-50%);border-radius:50%;border:2px solid hsl(var(--accent-h) 100% 70% / .7);box-shadow:0 0 24px var(--accent-glow),inset 0 0 18px var(--accent-glow);animation:ringpulse 2.6s ease-in-out infinite}
@keyframes ringpulse{50%{box-shadow:0 0 40px var(--accent-glow),inset 0 0 28px var(--accent-glow)}}
.shop-pedestal{position:absolute;left:50%;bottom:6px;width:150px;height:30px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.25),rgba(120,150,220,.1) 60%,transparent 70%)}
.shop-droid{position:relative;z-index:2;margin-bottom:24px;animation:showcase 3.4s ease-in-out infinite}
.shop-droid svg{overflow:visible;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
@keyframes showcase{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.shop-try{position:absolute;left:10px;top:10px;z-index:3;border:1px solid;background:rgba(5,7,20,.7)}
.shop-bal{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:16px;background:linear-gradient(90deg,rgba(255,217,138,.14),transparent);border:1px solid rgba(255,217,138,.35)}
.shop-bal b{font:700 22px var(--f-display);color:var(--gold)}
.shop-bal>span:nth-child(3){color:var(--ink2);font-size:13px}
.shop-coin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff3c8,#e9a83c);color:#5a3a00;font-weight:700;box-shadow:0 0 14px rgba(255,200,100,.6);animation:coinspin 3s ease-in-out infinite}
@keyframes coinspin{50%{transform:rotateY(180deg)}}
.shop-npc{display:flex;gap:10px;align-items:flex-start}
.shop-npc .bubble{flex:1;margin:0;font-size:13.5px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.shop-card{position:relative;display:grid;justify-items:center;gap:4px;padding:22px 6px 10px;border-radius:16px;border:1px solid var(--hair2);background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 12%,transparent),rgba(255,255,255,.03));color:var(--ink);cursor:pointer;text-align:center;transition:transform .15s,border-color .2s,box-shadow .2s}
.shop-card:active{transform:scale(.96)}
.shop-card[aria-pressed=true]{border-color:var(--rc);box-shadow:0 0 0 1px var(--rc),0 0 22px color-mix(in srgb,var(--rc) 45%,transparent)}
.shop-card[data-locked]{opacity:.55}
.shop-card b{font-size:12.5px;line-height:1.2}
.shop-card small{font-size:11.5px;color:var(--ink2)}
.sc-rar{position:absolute;top:6px;left:6px;font:700 8.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--rc)}
.sc-prev{height:66px;display:grid;place-items:center}
.sc-prev svg{overflow:visible}
.shop-detail{padding:14px;display:grid;gap:8px;position:sticky;bottom:-18px;z-index:3}
.coin-fly{position:fixed;z-index:200;pointer-events:none;color:var(--gold);font-size:18px;font-weight:700;text-shadow:0 0 10px rgba(255,200,100,.9)}
.lite .shop-droid,.lite .shop-coin{animation:none}
.droid-fab[data-news]::after{content:"!";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1c1200;font:700 13px/20px var(--f-body);text-align:center;box-shadow:0 0 12px rgba(255,200,100,.8);animation:breathe 1.6s ease-in-out infinite}
/* desktop: use the width */
@media (min-width:900px){
  .pv-inner{max-width:1040px}
  .pv-hero .big{width:220px}
  .missions,.lcards{grid-template-columns:1fr 1fr}
  .view>.page{max-width:920px}
  .pcards{grid-template-columns:repeat(4,1fr)}
  .reader-in{max-width:720px}

/* porgs */
.porg{position:absolute;z-index:7;border:0;padding:0;background:none;cursor:pointer;transform:translateX(-50%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.porg svg{overflow:visible;display:block}
.porg .porg-body{transform-origin:30px 54px;animation:waddle 1.6s ease-in-out infinite}
.porg .porg-eyes{transform-origin:30px 25px;animation:blink 5s infinite}
.porg .flip{transform-box:fill-box;transform-origin:50% 10%}
@keyframes waddle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-1.5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.porg--flock{animation:porgwalk 14s ease-in-out infinite alternate}
@keyframes porgwalk{0%{translate:-14px 0}100%{translate:14px 0}}
.porg.flap .porg-body{animation:hop .7s ease-out}
.porg.flap .flip.l{animation:flapl .12s 5 alternate}.porg.flap .flip.r{animation:flapr .12s 5 alternate}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-16px) rotate(-6deg)}}
@keyframes flapl{to{transform:rotate(-40deg)}}@keyframes flapr{to{transform:rotate(40deg)}}
.porg--hide{animation:peek 6s ease-in-out infinite}
@keyframes peek{0%,55%,100%{translate:0 70%;opacity:.95}62%,90%{translate:0 0;opacity:1}}
.porg--hide.caught{animation:none;transition:transform 1.1s cubic-bezier(.3,0,.2,1),opacity 1.1s;transform:translate(-50%,-260px) rotate(-20deg) scale(.6);opacity:0}
.porg--hide.caught .flip.l{animation:flapl .1s 12 alternate}.porg--hide.caught .flip.r{animation:flapr .1s 12 alternate}
.porg-dex{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:520px){.porg-dex{grid-template-columns:repeat(4,1fr)}}
.pd{display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:1px solid var(--hair);background:rgba(255,255,255,.03)}
.pd svg{filter:brightness(0) opacity(.35)}
.pd.f svg{filter:none}
.pd.f{border-color:rgba(255,217,138,.4);background:rgba(255,217,138,.06)}
.pd small{font-size:11px;color:var(--ink3)}
.pd.f small{color:var(--gold)}
.lite .porg--flock{animation:none}
/* porg breeds */
.porg-svg{overflow:visible}
.p-shiver .porg-body{animation:shiver .18s linear infinite!important}
@keyframes shiver{0%,100%{transform:translateX(-.8px)}50%{transform:translateX(.8px)}}
.p-float .porg-body{animation:pfloat 3s ease-in-out infinite!important}
@keyframes pfloat{50%{transform:translateY(-6px)}}
.p-wise .porg-eyes{animation:wiseblink 4s ease-in-out infinite!important}
@keyframes wiseblink{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.p-glow{filter:drop-shadow(0 0 6px rgba(255,120,60,.7))}
.pembers circle,.plights circle{animation:twk 1.6s ease-in-out infinite}
.porg-stage{display:grid;place-items:center;height:210px;border-radius:20px;background:radial-gradient(ellipse at 50% 90%,hsl(var(--accent-h) 90% 60% / .3),transparent 60%),linear-gradient(180deg,#0b1030,#05071a);border:1px solid hsl(var(--accent-h) 100% 70% / .3)}
.porg-stage .porg{position:relative;transform:none;left:auto;bottom:auto}
.porg-stage.locked svg{filter:brightness(0) opacity(.4)}
.pd{cursor:pointer;color:inherit;font:inherit}
.pd:active{transform:scale(.95)}

const DATA2={"dialog":{"chispa":{"hola":["¡Bip bip! Hola, {n}. Hoy huele a descubrimientos.","¡Aquí estoy! ¿Miramos qué brilla por ahí?","¡Hola, {n}! Tengo las luces encendidas por si hay aventura."],"animo":["Cada pasito cuenta. Yo cuento todos los tuyos, ¡y van muchos!","Si algo no sale, probamos otra cosa. ¡Eso también es explorar!","Eres capaz de más de lo que piensas. Mis sensores no se equivocan."],"curiosidad":["Dato curioso: en Tatooine hay dos soles y aun así a mí me gusta más la luz de tus ojos… quiero decir, de tu pantalla.","Dato curioso: los droides contamos las estrellas dormidos. Siempre salen distintas.","Dato curioso: una chispa viaja a mucha velocidad, pero se detiene si alguien la mira con cariño."],"vuelta":["¡Qué bien verte, {n}! Todo sigue en su sitio, sin prisas.","¡Has vuelto! Yo estaba aquí, ordenando chispas."],"celebra":["¡Lo has conseguido! ¡Chispas por todas partes!","¡Bip bip bip! ¡Qué descubrimiento tan bonito!","¡Eso merece una vuelta de victoria!"],"estado":{"happy":["Estoy a tope: luces brillantes y cabeza despejada."],"curious":["Estoy bien. Con curiosidad, como siempre."],"sleepy":["Tengo poca energía, pero nada grave. Cuando puedas, una recarga y listo."],"celebrate":["¡Estoy de fiesta!"]}},"brujula":{"hola":["Hola, {n}. Respira. Aquí todo va a su ritmo.","Buenas. Cuando quieras, caminamos juntas.","Me alegra que estés aquí, {n}. Sin prisa."],"animo":["No hay que llegar rápido. Hay que llegar con ganas.","Un paso pequeño sigue siendo un paso. Y ya lo has dado.","Descansar también es parte del viaje. Lo haces bien."],"curiosidad":["Dato curioso: las constelaciones solo existen desde donde se miran. Cada mirada dibuja la suya.","Dato curioso: una brújula no sabe adónde vas, solo te ayuda a no perder el norte.","Dato curioso: en Hoth el silencio es tan grande que se oyen las estrellas. Es un decir."],"vuelta":["Bienvenida de nuevo, {n}. Nada se ha movido de sitio.","Qué bien que hayas vuelto. Todo estaba esperándote con calma."],"celebra":["Muy bien hecho. Despacio, pero seguro.","Un buen descubrimiento. Mereces disfrutarlo.","Eso ha quedado precioso. Te lo has ganado."],"estado":{"happy":["Muy bien. Tranquila y con las luces en calma."],"curious":["Estoy bien. Atenta a lo que venga."],"sleepy":["Me pesan un poco los engranajes. Una recarga me vendría bien, sin agobio."],"celebrate":["Estoy contenta. Mucho."]}},"tuerca":{"hola":["¡Hola, {n}! Si algo está torcido, yo lo arreglo. Y si no, lo abrazo.","Aquí estoy, con la llave inglesa y el corazón preparado.","¡Ya era hora de verte! Bueno, no, no había hora. Aquí siempre eres bienvenida."],"animo":["No te rindas, que yo no soy de abandonar tornillos ni amistades.","Si hoy cuesta, mañana se arregla. Y yo estaré aquí para ayudarte.","Tienes buen corazón. Eso no se fabrica en ningún taller."],"curiosidad":["Dato curioso: un droide cabezota es solo un droide que cree mucho en las cosas.","Dato curioso: cada tuerca encaja con su tornillo. No es casualidad; es diseño.","Dato curioso: la mejor herramienta del taller es tener a alguien que te sostenga la linterna."],"vuelta":["¡Has vuelto, {n}! Yo he ido engrasando todo, por si acaso.","Qué alegría. No te preocupes por el tiempo: aquí nada se oxida."],"celebra":["¡Mira qué bien ha quedado eso! ¡Orgullo de taller!","¡Eso es trabajo bien hecho!","¡Ole mis tuercas! ¡Lo has logrado!"],"estado":{"happy":["Como nueva. Hasta chirrío de contenta."],"curious":["Bien. Con ganas de arreglar algo."],"sleepy":["Me falla un poco la batería. Una recarga y vuelvo a ser yo."],"celebrate":["¡Estoy radiante!"]}}},"npcs":{"archivista":{"id":"archivista","name":"Madame Tinta","role":"Archivista de cartas","where":"Cartas","color":"#e6b87a","shape":"visera","job":"Cuida las cartas y te señala cuál leer a continuación.","lines":["Bienvenida al archivo. Cada carta está en su estante, esperando a su lectora.","Las cartas no caducan. Yo les quito el polvo para que siempre estén listas.","Si no sabes por dónde empezar, empieza por la más nueva. Yo te la señalo.","Leer despacio es la mejor manera de leer."]},"piloto":{"id":"piloto","name":"Capitán Rumbo","role":"Piloto de transmisiones","where":"Mapa","color":"#7fd6ff","shape":"casco","job":"Trae una transmisión nueva cada día y te regala chispas por recogerla.","lines":["¡Aquí el capitán Rumbo! Traigo la transmisión de hoy, calentita.","Entrego mensajes por toda la galaxia. Algunos llegan en un segundo; otros tardan en encontrar a su destinataria.","Mañana habrá otra. Si hoy no puedes, no pasa nada: aquí no se acumulan deberes."]},"explorador":{"id":"explorador","name":"Vega la Mirona","role":"Exploradora de constelaciones","where":"Hoth","color":"#b8c8ff","shape":"capa","job":"Te da pistas sobre las estrellas y las constelaciones de Hoth.","lines":["Aquí el cielo se ve entero. Si miras bien, las estrellas dibujan cosas.","Una constelación es solo una historia que alguien decidió contar uniendo puntos.","Empieza por las estrellas más brillantes y ve uniendo. Sin prisa."]},"guardian":{"id":"guardian","name":"Grumo el Guardián","role":"Guardián de holocrones","where":"Endor","color":"#9bd37a","shape":"capucha","job":"Guarda los holocrones de Endor y te ayuda a encontrar sus secretos.","lines":["Los holocrones son memorias en forma de luz. Los guardo con mucho cariño.","En este bosque todo se esconde cerca de lo pequeño: una luz, una criatura, un cofre.","Si un cofre no se abre, quizá le falte una pista de otro planeta."]},"jardinero":{"id":"jardinero","name":"Brote","role":"Robot jardinero","where":"Naboo","color":"#6fe0b0","shape":"sombrero","job":"Cuida el jardín de Naboo y te cuenta qué falta por hacer allí.","lines":["Clic, clic. Estoy regando. Las flores crecen cuando no las miras con prisa.","Cada tulipán tiene su ritmo. El jardín no compite con nadie.","Si quieres ayudar, toca las flores con suavidad. No muerden, lo prometo."]},"comerciante":{"id":"comerciante","name":"Don Baratija","role":"Comerciante de accesorios","where":"Tienda","color":"#ffb347","shape":"tunica","job":"Vende accesorios para tu droide a cambio de chispas.","lines":["¡Pasa, pasa! Tengo cosas que ni los droides saben que necesitan.","Las chispas se ganan jugando y explorando. Aquí no se cobra ni un céntimo de verdad.","Los accesorios nuevos se van desbloqueando según crece la amistad con tu droide."]},"narrador":{"id":"narrador","name":"La Voz de las Estrellas","role":"Narradora de historias","where":"Recuerdos","color":"#d6a6ff","shape":"tunica","job":"Cuenta pequeñas leyendas de la galaxia mientras repasas tus recuerdos.","lines":["Hace mucho, una estrella se quedó sin su luz y empezó a escribir cartas para que alguien la encontrara.","Dicen que el archivo de las estrellas perdidas guarda lo que otros olvidaron. Yo prefiero decir: lo que alguien ha querido conservar.","Cada recuerdo es una pequeña luz. Juntas, hacen un mapa.","Las historias no se acaban: esperan a que alguien las vuelva a contar."]}},"news":["Hoy no hay nada que arreglar. Solo que explorar si te apetece.","Se ha avistado una estrella nueva cerca de tu planeta favorito. Quizá sea la tuya.","Recordatorio oficial de la galaxia: beber agua y estirar las piernas.","Un droide ha informado de que hoy es un buen día para leer una carta con calma.","Las constelaciones están especialmente claras esta noche.","Aviso: aquí no existe el retraso. Todo llega cuando tiene que llegar.","Mensaje sin importancia: los droides te echan de menos cuando no estás, pero se les pasa jugando.","Los tulipanes de Naboo han crecido un poco. Nadie sabe por qué, pero a todos nos gusta.","Hoy la nave va tranquila. Puedes llevarla a donde quieras.","El archivo informa de que ninguna carta ha caducado. Ninguna.","Una pequeña esfera ha sido vista rodando por ahí. Parece que lleva un mensaje.","Previsión: cielos despejados, ánimo suave y nada de prisa.","Mensaje oficial: cualquier momento es bueno para empezar. También este.","La galaxia dice que sigas a tu ritmo. Y la galaxia casi nunca se equi function celebrate(kind = "gold") {

  const dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight; cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext("2d"); g.scale(dpr, dpr);

  const ps = Array.from({ length: 140 }, () => { const a = Math.random() * 6.283, v = 3 + Math.random() * 9; return { x: W / 2, y: H * .45, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 3, r: 1.5 + Math.random() * 3.5, c: cols[Math.floor(Math.random() * cols.length)], st: Math.random() > .55, rot: Math.random() * 6 }; });
  const t0 = performance.now();
  (function fr(t) {
    const k = Math.max(0, (t - t0) / 1600); g.clearRect(0, 0, W, H);
    if (k < .25) { const gr = g.createRadialGradient(W / 2, H * .45, 0, W / 2, H * .45, Math.max(1, 260 * k * 4)); gr.addColorStop(0, `rgba(255,240,200,${.5 * (1 - k * 4)})`); gr.addColorStop(1, "rgba(0,0,0,0)"); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.vy += .16; p.vx *= .985; p.rot += .1;
      g.globalAlpha = Math.max(0, 1 - k); g.fillStyle = p.c;
      if (p.st) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.beginPath(); for (let i = 0; i < 4; i++) { g.rotate(Math.PI / 2); g.lineTo(0, -p.r * 2.2); g.lineTo(p.r * .5, -p.r * .5); } g.fill(); g.restore(); }
      else { g.beginPath(); g.arc(p.x, p.y, p.r, 0, 7); g.fill(); }

}

    h("div", { class: "projector" }, droidSVG((S.profile && S.profile.droid) || "chispa", 50), h("div", { class: "beam", style: { height: "30px" } })),

      h("p", { style: { fontSize: "1.15rem" } }, `${herName()}, han llegado ${LETTERS.length} cartas nuevas a la galaxia.`),

function boot() {
  const app = h("div", { id: "app" }); viewEl = h("main", { id: "view" }); app.append(viewEl); document.body.append(app);
  applySettings(); buildTabbar(); placeDroid();
  onChange(() => { clearTimeout(boot.t); boot.t = setTimeout(rerender, 30); });
  try { history.replaceState({ name: "map", params: {} }, ""); } catch (e) { }
  const start = () => {
    const back = welcomeBack(); render(); rememberRoute();
    placeAdminBadge();
    const tour = () => { if (isAdmin()) return; if (!getData("tourDone")) { if (route.name !== "map") go("map"); setTimeout(startTour, 900); } else if (!back) setTimeout(() => droidSay(droidHint()), 1500); };
    setTimeout(() => whatsNew(tour), 2000);
  };
  const afterIntro = () => S.profile ? start() : setup(start);
  gate(() => { if (!S.introSeen) playIntro(afterIntro); else afterIntro(); });
  addEventListener("pagehide", () => { rememberRoute(); try { localStorage.setItem(KEY, JSON.stringify({ state: { ...S, wizard: null }, version: 3 })); } catch (e) { } });
}
document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", boot) : boot();
